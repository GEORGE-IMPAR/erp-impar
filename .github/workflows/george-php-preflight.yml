name: George PHP Preflight

on:
  push:
    paths:
      - 'george-reuniao/backend-ci/**'
      - 'george-reuniao/tests/**'
      - 'cronograma/agenda_do_dia_novo.html'
      - 'cronograma/agenda_client_v2.js'
      - 'cronograma/agenda_interacoes.js'
      - 'cronograma/testes/**'
      - '.github/workflows/george-php-preflight.yml'
  pull_request:
    paths:
      - 'george-reuniao/backend-ci/**'
      - 'george-reuniao/tests/**'
      - 'cronograma/agenda_do_dia_novo.html'
      - 'cronograma/agenda_client_v2.js'
      - 'cronograma/agenda_interacoes.js'
      - 'cronograma/testes/**'
      - '.github/workflows/george-php-preflight.yml'
  workflow_dispatch:

jobs:
  php-preflight:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, pdo, pdo_mysql
          coverage: none
      - name: Versões
        run: php -v && node -v
      - name: Sintaxe de todos os PHPs
        run: find george-reuniao/backend-ci -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Sintaxe JavaScript crítica
        run: |
          node --check george-reuniao/assets/v09/app.js
          node --check george-reuniao/assets/v09/agenda_report_bridge.js
          node --check cronograma/agenda_client_v2.js
          node --check cronograma/agenda_interacoes.js
      - name: Regressão da interface e cliente da Agenda do Dia
        run: |
          node cronograma/testes/agenda-dia-ui-contract.test.mjs
          node cronograma/testes/agenda-client-v2.test.mjs
          node george-reuniao/tests/agenda_george_contract.test.mjs
          node george-reuniao/tests/agenda_report_pdf_regression.test.mjs
      - name: Smoke HTTP e JSON
        run: bash -x george-reuniao/tests/php_api_smoke.sh
      - name: Regressão do domínio da Agenda AD-001 a AD-006
        run: bash -x george-reuniao/tests/run_agenda_domain_regression.sh
