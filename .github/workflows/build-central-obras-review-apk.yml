name: Build Central Obras Review APK
on:
  pull_request:
    paths:
      - 'android-central-obras-review/**'
      - '.github/workflows/build-central-obras-review-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android-central-obras-review
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: central-obras-george-v2-review-apk
          path: android-central-obras-review/app/build/outputs/apk/debug/app-debug.apk
