<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ERP ÍMPAR — Saída</title>

<style>
:root{
  --bg:#061b2a;
  --green:#22c55e;
  --blue:#38bdf8;
  --text:#f8fafc;
  --soft:#cbd5e1;
}
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
html,body{
  margin:0;
  width:100%;
  min-height:100vh;
  min-height:100dvh;
  background:#061b2a;
  color:var(--text);
  overflow:hidden;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 42%,rgba(34,197,94,.24),transparent 26%),
    radial-gradient(circle at 34% 44%,rgba(56,189,248,.25),transparent 35%),
    radial-gradient(circle at 72% 58%,rgba(34,197,94,.14),transparent 34%),
    linear-gradient(135deg,#020617 0%,#061b2a 45%,#021713 100%);
}
.exit-screen{
  position:relative;
  width:min(960px,100%);
  min-height:min(680px,92dvh);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.light-rays{
  position:absolute;
  inset:-20%;
  background:
    conic-gradient(from 270deg at 50% 44%,
      transparent 0deg,
      rgba(56,189,248,.12) 22deg,
      transparent 44deg,
      rgba(34,197,94,.16) 78deg,
      transparent 106deg,
      rgba(56,189,248,.10) 150deg,
      transparent 210deg,
      rgba(34,197,94,.12) 255deg,
      transparent 360deg);
  filter:blur(10px);
  opacity:.8;
  animation:rays 7s ease-in-out infinite alternate;
}
@keyframes rays{
  from{transform:scale(1) rotate(-2deg);opacity:.65}
  to{transform:scale(1.08) rotate(3deg);opacity:.95}
}
.orbit{
  position:absolute;
  width:min(520px,70vw);
  aspect-ratio:1/1;
  border-radius:50%;
  border:1px solid rgba(56,189,248,.18);
  box-shadow:0 0 80px rgba(56,189,248,.08), inset 0 0 70px rgba(34,197,94,.06);
  animation:orbitIn 1.1s ease both, orbitPulse 3.6s ease-in-out infinite 1.2s;
}
@keyframes orbitIn{
  from{transform:scale(.72);opacity:0}
  to{transform:scale(1);opacity:1}
}
@keyframes orbitPulse{
  0%,100%{transform:scale(1);opacity:.78}
  50%{transform:scale(1.04);opacity:1}
}
.content{
  position:relative;
  z-index:2;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.app-icon{
  width:190px;
  height:190px;
  border-radius:54px;
  background:
    radial-gradient(circle at 50% 36%,rgba(34,197,94,.15),transparent 42%),
    linear-gradient(145deg,#031623,#06372f);
  border:1px solid rgba(34,197,94,.32);
  box-shadow:
    0 34px 88px rgba(0,0,0,.46),
    0 0 0 8px rgba(34,197,94,.08),
    0 0 80px rgba(56,189,248,.20);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  animation:iconEntrance 1.05s cubic-bezier(.18,.95,.24,1.18) both,
            iconFloat 3.8s ease-in-out infinite 1.1s;
}
@keyframes iconEntrance{
  0%{transform:translateY(22px) scale(.72);opacity:0;filter:blur(8px)}
  70%{transform:translateY(0) scale(1.06);opacity:1;filter:blur(0)}
  100%{transform:translateY(0) scale(1);opacity:1}
}
@keyframes iconFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-8px) scale(1.015)}
}
.color-disc{
  width:88px;
  height:88px;
  border-radius:50%;
  background:conic-gradient(from 210deg,#22c55e,#38bdf8,#1d4ed8,#7c3aed,#fb923c,#facc15,#22c55e);
  box-shadow:0 0 36px rgba(56,189,248,.25);
  position:relative;
}
.color-disc:after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:radial-gradient(circle at 42% 38%,rgba(255,255,255,.26),transparent 33%);
}
.icon-erp{
  margin-top:18px;
  font-size:34px;
  line-height:.92;
  font-weight:950;
  letter-spacing:.02em;
  text-shadow:0 2px 8px rgba(0,0,0,.45);
}
.icon-sub{
  margin-top:4px;
  font-size:14px;
  font-weight:900;
  letter-spacing:.1em;
}
.big-logo{
  margin-top:34px;
  opacity:0;
  animation:logoZoom 1.05s cubic-bezier(.18,.95,.24,1.18) .78s both;
}
@keyframes logoZoom{
  0%{opacity:0;transform:translateY(24px) scale(.72);filter:blur(8px)}
  70%{opacity:1;transform:translateY(0) scale(1.06);filter:blur(0)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
.big-logo h1{
  margin:0;
  font-size:clamp(46px,7vw,76px);
  line-height:.98;
  font-weight:950;
  letter-spacing:.02em;
  text-shadow:0 8px 24px rgba(0,0,0,.52);
}
.big-logo .platform{
  margin-top:12px;
  color:#67f39a;
  font-size:clamp(17px,2.5vw,27px);
  font-weight:900;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.underline{
  width:92px;
  height:4px;
  margin:26px auto 0;
  border-radius:999px;
  background:linear-gradient(90deg,#38bdf8,#22c55e);
  box-shadow:0 0 24px rgba(34,197,94,.5);
  transform:scaleX(0);
  animation:lineGrow .75s ease 1.6s both;
}
@keyframes lineGrow{to{transform:scaleX(1)}}
.message{
  margin-top:26px;
  opacity:0;
  animation:fadeUp .8s ease 1.85s both;
}
.message b{
  display:block;
  font-size:clamp(24px,3vw,34px);
}
.message span{
  display:block;
  margin-top:10px;
  color:var(--soft);
  font-size:clamp(16px,2vw,22px);
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
.progress-wrap{
  width:min(520px,84vw);
  margin-top:34px;
  opacity:0;
  animation:fadeUp .7s ease 2.1s both;
}
.progress{
  height:4px;
  border-radius:999px;
  overflow:hidden;
  background:rgba(148,163,184,.22);
}
.progress span{
  display:block;
  height:100%;
  width:0%;
  border-radius:999px;
  background:linear-gradient(90deg,#1d4ed8,#38bdf8,#22c55e);
  box-shadow:0 0 24px rgba(34,197,94,.52);
  animation:progress 4.2s linear 2.15s forwards;
}
@keyframes progress{to{width:100%}}
.redirect{
  margin-top:16px;
  color:#b8c4d7;
  font-size:16px;
}
.actions{
  margin-top:24px;
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
  opacity:0;
  animation:fadeUp .7s ease 2.6s both;
}
.btn{
  border:1px solid rgba(34,197,94,.42);
  background:rgba(2,6,23,.52);
  color:#dfffee;
  border-radius:999px;
  padding:12px 18px;
  font-weight:900;
  cursor:pointer;
  transition:.14s ease;
}
.btn.primary{
  background:linear-gradient(120deg,#22c55e,#38bdf8);
  color:#052e16;
  border:0;
}
.btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.06);
}
@media(max-width:620px){
  body{padding:16px}
  .exit-screen{min-height:92dvh}
  .app-icon{
    width:152px;
    height:152px;
    border-radius:44px;
  }
  .color-disc{
    width:70px;
    height:70px;
  }
  .icon-erp{font-size:28px;margin-top:14px}
  .icon-sub{font-size:12px}
  .big-logo{margin-top:28px}
  .message{margin-top:22px}
  .progress-wrap{margin-top:28px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .big-logo,.message,.progress-wrap,.actions{opacity:1}
  .progress span{width:100%}
}
@supports(padding:max(0px)){
  body{
    padding-top:max(16px,env(safe-area-inset-top));
    padding-bottom:max(16px,env(safe-area-inset-bottom));
  }
}
</style>
</head>

<body>
<section class="exit-screen" aria-label="Saída do ERP ÍMPAR">
  <div class="light-rays"></div>
  <div class="orbit"></div>

  <div class="content">
    <div class="app-icon" aria-hidden="true">
      <div class="color-disc"></div>
      <div class="icon-erp">ERP</div>
      <div class="icon-sub">ÍMPAR</div>
    </div>

    <div class="big-logo">
      <h1>ERP ÍMPAR</h1>
      <div class="platform">Plataforma Integrada</div>
      <div class="underline"></div>
    </div>

    <div class="message">
      <b>Até logo!</b>
      <span>Você saiu do sistema com sucesso.</span>
    </div>

    <div class="progress-wrap">
      <div class="progress"><span></span></div>
      <div class="redirect">Redirecionando para o início...</div>
    </div>

    <div class="actions">
      <button class="btn primary" type="button" onclick="window.location.href='index.html'">Entrar novamente</button>
      <button class="btn" type="button" onclick="window.location.href='abertura_arte_erp_impar.html'">Tela de abertura</button>
    </div>
  </div>
</section>

<script>
const KEY = "ERPIMPAR_USER";

async function limparSessao(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  try{ sessionStorage.removeItem(KEY); }catch(e){}
  try{ localStorage.setItem("ERPIMPAR_LOGOUT_TS", String(Date.now())); }catch(e){}

  if("caches" in window){
    try{
      const keys = await caches.keys();
      await Promise.all(keys
        .filter(k => String(k).toLowerCase().includes("erp-impar"))
        .map(k => caches.delete(k)));
    }catch(e){}
  }
}

limparSessao();

setTimeout(() => {
  window.location.replace("abertura_arte_erp_impar.html");
}, 6500);
</script>
</body>
</html>
