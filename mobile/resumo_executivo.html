<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GEORGE • Resumo Executivo</title>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#edf3f5;color:#173247}
body{display:grid;place-items:center;padding:18px}
.card{width:min(560px,100%);background:#fff;border:1px solid #d7e2e8;border-radius:24px;padding:28px;box-shadow:0 24px 80px rgba(23,50,71,.14);text-align:center}
.orb{width:66px;height:66px;border-radius:20px;margin:0 auto 16px;background:linear-gradient(135deg,#18a66f,#2db9cc,#7357d9);display:grid;place-items:center;color:#fff;font-weight:1000;font-size:28px}
h1{font-size:22px;margin:0 0 6px}.sub{font-size:11px;font-weight:800;letter-spacing:1.1px;color:#718695;margin-bottom:22px}
.status{background:#f5f9fa;border:1px solid #dce7eb;border-radius:15px;padding:18px;text-align:left}
.status b{display:block;font-size:15px;margin-bottom:6px}.status span{font-size:12px;line-height:1.45;color:#617687}
.progress{height:8px;border-radius:10px;background:#e5edf0;overflow:hidden;margin-top:14px}.bar{height:100%;width:12%;background:linear-gradient(90deg,#18a66f,#2db9cc);border-radius:10px;transition:width .3s}
.actions{display:none;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:18px}
button{border:1px solid #cad8df;background:#f7fafb;color:#173247;border-radius:12px;height:44px;padding:0 17px;font-weight:900;cursor:pointer}
button.primary{background:#18a66f;color:#fff;border-color:#18a66f}
.error{color:#b3261e}.meta{margin-top:12px;font-size:10px;color:#8a9ba7}
#capture{position:fixed;left:-20000px;top:0;width:1600px;background:white}
#sourceFrame{position:fixed;left:-22000px;top:0;width:1600px;height:1100px;border:0;opacity:.01;pointer-events:none}
</style>
</head>
<body>
<div class="card">
  <div class="orb">G</div>
  <h1>Resumo Executivo</h1>
  <div class="sub">GEORGE • ERP ÍMPAR</div>
  <div class="status">
    <b id="title">Localizando a obra...</b>
    <span id="text">Consultando a Gestão de Obras e identificando o cronograma vinculado.</span>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>
  <div class="actions" id="actions">
    <button class="primary" id="share">↗ Compartilhar PDF</button>
    <button id="download">↓ Baixar PDF</button>
  </div>
  <div class="meta" id="meta"></div>
</div>

<iframe id="sourceFrame" title="fonte do resumo"></iframe>
<div id="capture"></div>

<script>
const OAPI="https://api.erpimpar.com.br/obras/api.php";
const CRONO="../cronograma/cronograma_novo.html";
const $=id=>document.getElementById(id);
let pdfBlob=null,pdfName="Resumo_Executivo.pdf";

function norm(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
}
function setStep(n,title,text){
  $("bar").style.width=n+"%";$("title").textContent=title;$("text").textContent=text;
}
async function post(url,body){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),cache:"no-store"});
  const txt=await r.text();let j;
  try{j=JSON.parse(txt)}catch(_){throw new Error("Resposta inválida da Gestão de Obras.");}
  if(!r.ok||j.ok===false)throw new Error(j.error||("HTTP "+r.status));
  return j;
}
async function findProject(q){
  const list=await post(OAPI,{action:"project_list"});
  const projects=Array.isArray(list.projects)?list.projects:[];
  const nq=norm(q);
  let hit=projects.find(p=>norm(p.name)===nq||norm(p.code)===nq||norm(p.id)===nq);
  if(!hit){
    hit=projects.find(p=>norm(p.name).includes(nq)||nq.includes(norm(p.name)));
  }
  if(!hit)throw new Error("Obra não encontrada na Gestão de Obras.");
  const id=hit.id||hit.code;
  if(!id)return hit;
  try{
    const full=await post(OAPI,{action:"project_get",id});
    return full.project||hit;
  }catch(_){return hit}
}
function copyIframeStyles(doc){
  const host=document.head;
  document.querySelectorAll("[data-george-imported-style]").forEach(x=>x.remove());
  [...doc.querySelectorAll("style,link[rel='stylesheet']")].forEach(node=>{
    const c=node.cloneNode(true);
    c.setAttribute("data-george-imported-style","1");
    if(c.tagName==="LINK"){
      try{c.href=new URL(node.getAttribute("href"),doc.baseURI).href}catch(_){}
    }
    host.appendChild(c);
  });
}
async function waitClientPages(frame){
  for(let i=0;i<180;i++){
    try{
      const d=frame.contentDocument;
      const pages=d?.getElementById("clientPages");
      if(pages && pages.children.length)return pages;
    }catch(_){}
    await new Promise(r=>setTimeout(r,100));
  }
  throw new Error("A Visão Cliente não terminou de carregar.");
}
async function generate(){
  const obra=new URLSearchParams(location.search).get("obra")||"";
  if(!obra)throw new Error("Parâmetro obra não informado.");

  setStep(18,"Localizando a obra...",obra);
  const p=await findProject(obra);

  const file=p.scheduleFile||p.documents?.schedule?.file||p.documents?.executive?.file;
  if(!file)throw new Error("A obra foi encontrada, mas não possui cronograma vinculado.");

  $("meta").textContent=(p.name||obra)+" • "+file;
  setStep(38,"Cronograma localizado",file);

  const frame=$("sourceFrame");
  frame.src=CRONO+"?arquivo="+encodeURIComponent(file)+"&visao=cliente&embed=1";
  const pages=await waitClientPages(frame);

  setStep(62,"Preparando o documento...","Montando o mesmo Resumo Executivo já usado pela Visão Cliente.");
  copyIframeStyles(frame.contentDocument);

  const capture=$("capture");
  capture.innerHTML="";
  const cloned=pages.cloneNode(true);
  cloned.id="georgeClientPagesClone";
  capture.appendChild(cloned);

  // Ajusta URLs relativas das imagens clonadas.
  [...capture.querySelectorAll("img")].forEach(img=>{
    const src=img.getAttribute("src");
    if(src){try{img.src=new URL(src,frame.contentDocument.baseURI).href}catch(_){}}
  });

  await new Promise(r=>setTimeout(r,350));
  setStep(78,"Gerando PDF...","Convertendo o Resumo Executivo para PDF.");

  pdfName=("Resumo_Executivo_"+(p.name||obra)).replace(/[^\p{L}\p{N}._-]+/gu,"_")+".pdf";
  const worker=html2pdf().set({
    margin:0,
    filename:pdfName,
    image:{type:"jpeg",quality:.98},
    html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",windowWidth:1600},
    jsPDF:{unit:"mm",format:"a4",orientation:"landscape"},
    pagebreak:{mode:["css","legacy"]}
  }).from(cloned).toPdf();

  const pdf=await worker.get("pdf");
  pdfBlob=pdf.output("blob");

  setStep(100,"PDF pronto ✓","O arquivo foi gerado no navegador. Escolha Compartilhar PDF ou Baixar PDF para salvar no dispositivo.");
  $("actions").style.display="flex"; $("share").focus();
}
function downloadPdf(){
  if(!pdfBlob)return;
  const url=URL.createObjectURL(pdfBlob),a=document.createElement("a");
  a.href=url;a.download=pdfName;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function sharePdf(){
  if(!pdfBlob)return;
  const file=new File([pdfBlob],pdfName,{type:"application/pdf"});
  try{
    if(navigator.canShare?.({files:[file]}) && navigator.share){
      await navigator.share({files:[file],title:"Resumo Executivo — Visão Cliente"});
      return;
    }
  }catch(e){if(e?.name==="AbortError")return}
  downloadPdf();
}
$("share").onclick=sharePdf;$("download").onclick=downloadPdf;

generate().catch(e=>{
  console.error(e);
  $("bar").style.width="100%";
  $("title").textContent="Não foi possível gerar o resumo";
  $("title").classList.add("error");
  $("text").textContent=e.message||String(e);
});
</script>
</body>
</html>
