<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4c3a73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ERP ÍMPAR">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png"><title>ERP ÍMPAR • Mobile V1.1 Consultas</title>
<style>
:root{--bg:#eef3f5;--ink:#173247;--muted:#718895;--line:#d8e4e9;--green:#18b878;--cyan:#31bfe2;--violet:#6f55c9;--violet2:#8b6ee8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
body{min-height:100dvh;overflow:hidden}.top{height:72px;padding:max(10px,env(safe-area-inset-top)) 14px 8px;background:linear-gradient(135deg,#35454d,#48545b 62%,#594a78);color:#fff;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px #1233;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px}.orb{width:39px;height:39px;border-radius:12px;background:conic-gradient(#22c55e,#22d3ee,#3b82f6,#8b5cf6,#fb7185,#f59e0b,#22c55e)}.brand span{font-weight:950}.brand b{color:#8effbd}.ver{position:absolute;left:50%;transform:translateX(-50%);top:7px;background:linear-gradient(90deg,#f0a900,#ffd45a);color:#302500;border:1px solid #fff3b0;border-radius:99px;padding:3px 9px;font-size:9px;font-weight:950;letter-spacing:.08em;white-space:nowrap}.user{text-align:right;font-size:10px}.user b{display:block}
.shell{height:calc(100dvh - 72px);position:relative}.chat-scroll{position:absolute;inset:0;overflow:auto;padding:16px 13px 150px}.welcome{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 34px #1232;margin-bottom:17px}.welcome small{color:var(--violet);font-weight:850}.welcome h1{font-size:23px;margin:5px 0 6px}.welcome p{margin:0;color:var(--muted);line-height:1.45}
.chat{display:flex;flex-direction:column;gap:12px}.row{display:flex}.row.me{justify-content:flex-end}.bubble{max-width:90%;background:#fff;padding:13px 14px;border:1px solid #1732470d;border-radius:18px 18px 18px 6px;box-shadow:0 8px 22px #1231;line-height:1.45}.me .bubble{background:linear-gradient(135deg,#f1edff,#e9fbff);border-radius:18px 18px 6px 18px}.time{display:block;font-size:10px;color:#91a1aa;margin-top:7px}.list{margin:8px 0 0;padding-left:18px}.list li{margin:4px 0}.strong{font-weight:900}.error{color:#bd3c4e}
.module-layer{position:absolute;inset:0 0 112px;background:#fff;z-index:20;display:none;flex-direction:column}.module-layer.on{display:flex}.module-bar{height:38px;flex:none;background:linear-gradient(90deg,#5e49aa,#8069db);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11px;font-weight:900}.module-bar span:last-child{opacity:.8}.module-layer iframe{width:100%;height:100%;border:0;background:#fff}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:40;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 25%)}.composer{max-width:700px;margin:auto;background:#fff;border:2px solid #7860d3;border-radius:31px;padding:7px;display:flex;align-items:center;gap:7px;box-shadow:0 14px 38px #4c3a7330}.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:11px}.mic,.send{border:0;cursor:pointer}.mic{width:52px;height:52px;border-radius:50%;font-size:23px;color:#fff;background:linear-gradient(145deg,var(--violet),var(--green))}.send{width:40px;height:40px;border-radius:50%;background:#eeeafd;color:#493c82}.hint{text-align:center;color:#7669a2;font-size:10px;margin-top:5px}.listen{animation:p 1s infinite}@keyframes p{50%{box-shadow:0 0 0 12px #6f55c922}}
.voice-stage{margin:0 0 16px;padding:16px 12px 12px;min-height:155px;border:1px solid #d9e3e9;border-radius:24px;background:radial-gradient(circle at 50% 20%,#fff,#f4f0ff 48%,#eef3f5);display:grid;place-items:center;overflow:hidden}.voice-orb{width:72px;height:72px;border-radius:50%;position:relative;display:grid;place-items:center;background:linear-gradient(145deg,#765bd4,#18b878);box-shadow:0 13px 35px #5d4bb344}.voice-dot{color:#fff;font-size:24px;z-index:2}.vr{position:absolute;inset:0;border:2px solid #765bd455;border-radius:50%;opacity:0}.voice-stage.listening .vr{animation:vr 1.5s infinite}.voice-stage.listening .v2{animation-delay:.55s}@keyframes vr{0%{transform:scale(.85);opacity:.75}100%{transform:scale(2.25);opacity:0}}.wave{height:42px;width:min(94%,420px);display:flex;align-items:center;justify-content:center;gap:3px}.wave i{width:4px;height:6px;border-radius:9px;background:linear-gradient(#765bd4,#18b878);opacity:.38}.voice-stage.listening .wave i,.voice-stage.thinking .wave i{animation:wv .62s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.04s)}.voice-stage.thinking .wave i{animation-duration:1s}@keyframes wv{to{height:38px;opacity:1}}#voiceLabel{font-size:10px;letter-spacing:.12em;color:#6653a8}</style></head><body>
<header class="top"><div class="brand"><span class="orb"></span><span>ERP <b>ÍMPAR</b></span></div><div class="ver">V1.4 • ASSISTENTE EXECUTIVO</div><div class="user"><b id="topName">Usuário</b><span id="topRole">Mobile</span></div></header>
<div class="shell">
 <div class="chat-scroll" id="scroll"><section class="welcome"><small>ASSISTENTE DE VISIBILIDADE</small><h1 id="greeting">Em que posso ajudar?</h1><p>Consulte o ERP falando naturalmente. Ao abrir uma tela, a conversa continua disponível embaixo.</p></section><section id="chat" class="chat"></section></div>
 <section id="moduleLayer" class="module-layer"><div class="module-bar"><span id="moduleTitle">Módulo</span><span>Diga “fechar tela” para voltar ao chat</span></div><iframe id="moduleFrame" title="Módulo ERP ÍMPAR"></iframe></section>
 <div class="dock"><div class="composer"><button id="mic" class="mic">🎙</button><input id="text" placeholder="Pergunte ou peça para abrir uma tela…"><button id="send" class="send">➤</button></div><div id="hint" class="hint">V1.4 • PWA EXECUTIVO • VOZ</div></div>
</div>
<script src="./assistant_bridge.js"></script><script>
const $=s=>document.querySelector(s),chat=$("#chat"),input=$("#text"),layer=$("#moduleLayer"),frame=$("#moduleFrame");
const tm=()=>new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function add(x,me=false,html=false){const r=document.createElement("div");r.className="row"+(me?" me":"");const b=document.createElement("div");b.className="bubble";if(html)b.innerHTML=x;else b.textContent=x;b.insertAdjacentHTML("beforeend",`<span class="time">${tm()}</span>`);r.appendChild(b);chat.appendChild(r);r.scrollIntoView({behavior:"smooth",block:"end"})}
function openModule(name){if(!ERPAssistantBridge.hasAccess(name)){add("Essa funcionalidade não está liberada para o seu usuário.");return}const cfg=window.__cfg||{};const url=cfg.modules?.[name]?.url;if(!url){add("Não encontrei a rota dessa funcionalidade.");return}$("#moduleTitle").textContent=name;frame.src=url;layer.classList.add("on");add("Abri "+name+". O campo de conversa continua ativo; diga “fechar tela” quando quiser voltar.");}
function closeModule(){frame.src="about:blank";layer.classList.remove("on");add("Tela fechada. Pode continuar a consulta.");}
function resultHtml(j){if(Array.isArray(j.items)){return `<div class="strong">${esc(j.answer||"Resultado")}</div><ul class="list">${j.items.map(i=>`<li>${esc(typeof i==="string"?i:(i.label||i.nome||i.name||JSON.stringify(i)))}</li>`).join("")}</ul>`}return esc(j.answer||"Consulta concluída.")}
async function answer(q){
 const n=ERPAssistantBridge.norm(q);
 if(/^(fechar|fecha|feche)( a)? (tela|funcionalidade|modulo)|voltar pro chat|volta pro chat/.test(n)){closeModule();return}
 if(/funcional|modul|tenho acesso|posso usar|o que eu posso/.test(n)){const a=ERPAssistantBridge.allowedModules();add(`Você tem acesso a ${a.length} funcionalidades:<ul class="list">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`,false,true);return}
 if(/abr|abre|abrir|acess|entrar|mostra|mostre|gera|gere/.test(n)){const m=ERPAssistantBridge.findModule(q);if(m){openModule(m);return}}
 $("#voiceStage").className="voice-stage thinking";$("#voiceLabel").textContent="ANALISANDO ERP…";add("Consultando o ERP…");
 const wait=chat.lastElementChild;
 try{const j=await ERPAssistantBridge.query(q);wait.remove();$("#voiceStage").className="voice-stage";$("#voiceLabel").textContent="PRONTO PARA OUVIR";add(resultHtml(j),false,true)}
 catch(e){wait.remove();$("#voiceStage").className="voice-stage";$("#voiceLabel").textContent="PRONTO PARA OUVIR";add("Não consegui concluir essa consulta: "+e.message,false)}
}
function send(){const q=input.value.trim();if(!q)return;add(q,true);input.value="";answer(q)}
$("#send").onclick=send;input.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
(async()=>{try{const r=await ERPAssistantBridge.init();window.__cfg=r.cfg;if(!r.user){location.replace("/login_novo.html");return}$("#topName").textContent=r.user.nome||"Usuário";$("#topRole").textContent=r.user.cargo||"Mobile";const first=String(r.user.nome||"").split(/\s+/)[0];const h=new Date().getHours();$("#greeting").textContent=(h<12?"Bom dia":h<18?"Boa tarde":"Boa noite")+(first?", "+first:"")+"! Em que posso ajudar?";add("Esta é a V1.4 do Assistente Executivo. Pergunte, por exemplo: “Quantas obras ativas temos?”, “Quais obras estão atrasadas?”, “Quais usuários ativos temos?” ou “Quantas empresas estão cadastradas?”.")}catch(e){add("Falha ao iniciar: "+e.message)}})();
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const r=new SR();r.lang="pt-BR";r.interimResults=true;$("#mic").onclick=()=>{try{r.start();$("#mic").classList.add("listen");$("#voiceStage").className="voice-stage listening";$("#voiceLabel").textContent="OUVINDO…";$("#hint").textContent="Fale naturalmente"}catch(_){}};r.onresult=e=>{let s="";for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript;input.value=s;if(e.results[e.results.length-1].isFinal)send()};r.onend=()=>{$("#mic").classList.remove("listen");$("#hint").textContent="V1.4 • PWA EXECUTIVO • VOZ"}}else $("#mic").onclick=()=>$("#hint").textContent="Reconhecimento de voz indisponível neste navegador.";
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", {scope:"./"}).catch(console.error);
  });
}
</script>
</body></html>
