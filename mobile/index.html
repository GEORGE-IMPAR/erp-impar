<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#31454e">
<title>ERP ÍMPAR • Assistente Mobile</title>
<style>
:root{--bg:#eef3f5;--card:#fff;--ink:#173247;--muted:#6f8798;--line:#d7e2e8;--green:#18b878;--cyan:#31bfe2;--side:#3f5058}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
body{min-height:100dvh}.top{height:68px;padding:max(8px,env(safe-area-inset-top)) 16px 8px;background:linear-gradient(180deg,#42535c,#384850);color:#fff;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(15,43,56,.12)}
.brand{display:flex;align-items:center;gap:11px}.orb{width:38px;height:38px;border-radius:12px;background:conic-gradient(from 210deg,#22c55e,#22d3ee,#3b82f6,#8b5cf6,#fb7185,#f59e0b,#22c55e);box-shadow:0 0 0 5px rgba(255,255,255,.08)}.brand b{color:#8dffbd}.brand span{font-weight:950}.user{font-size:11px;text-align:right}.user b{display:block;color:#fff}
main{max-width:720px;margin:auto;padding:18px 13px 145px}.welcome{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 15px 38px rgba(17,52,72,.08);margin-bottom:18px}.welcome small{color:var(--muted)}.welcome h1{font-size:23px;margin:5px 0 6px}.welcome p{margin:0;color:var(--muted);line-height:1.45}
.chat{display:flex;flex-direction:column;gap:12px}.row{display:flex}.row.me{justify-content:flex-end}.bubble{max-width:88%;background:#fff;border:1px solid rgba(23,50,71,.06);border-radius:18px 18px 18px 6px;padding:13px 14px;box-shadow:0 8px 22px rgba(17,52,72,.06);line-height:1.45}.me .bubble{background:linear-gradient(135deg,#eafff4,#e8f8ff);border-radius:18px 18px 6px 18px}.time{display:block;font-size:10px;color:#8da0ab;margin-top:6px}
.mods{list-style:none;padding:6px 0 0;margin:8px 0 0;border-top:1px solid var(--line)}.mods li{padding:8px 0;border-bottom:1px solid var(--line);font-weight:850}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 13px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 25%)}.composer{max-width:700px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:30px;padding:8px;display:flex;gap:7px;align-items:center;box-shadow:0 14px 36px rgba(17,52,72,.16)}.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:11px}.mic,.send{border:0;cursor:pointer}.mic{width:52px;height:52px;border-radius:50%;font-size:23px;color:#fff;background:linear-gradient(145deg,var(--cyan),var(--green))}.send{width:40px;height:40px;border-radius:50%;background:#edf4f6}.hint{text-align:center;font-size:10px;color:#80929d;margin-top:6px}.listen{animation:p 1s infinite}@keyframes p{50%{box-shadow:0 0 0 12px rgba(24,184,120,.15)}}
.error{color:#b33d4a}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="orb"></span><span>ERP <b>ÍMPAR</b></span></div><div class="user"><b id="topName">Usuário</b><span id="topRole">Assistente Mobile</span></div></header>
<main>
<section class="welcome"><small id="today"></small><h1 id="greeting">Olá! Em que posso ajudar?</h1><p>Fale naturalmente. O assistente respeita as permissões do seu usuário.</p></section>
<section class="chat" id="chat"></section>
</main>
<div class="dock"><div class="composer"><button class="mic" id="mic">🎙</button><input id="text" autocomplete="off" placeholder="Fale ou digite o que precisa…"><button class="send" id="send">➤</button></div><div class="hint" id="hint">Toque no microfone e fale naturalmente</div></div>
<script src="./assistant_bridge.js"></script>
<script>
const $=s=>document.querySelector(s),chat=$("#chat"),input=$("#text");
const tm=()=>new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
function add(text,me=false,html=false){const r=document.createElement("div");r.className="row"+(me?" me":"");const b=document.createElement("div");b.className="bubble";html?b.innerHTML=text:b.textContent=text;b.insertAdjacentHTML("beforeend",`<span class="time">${tm()}</span>`);r.appendChild(b);chat.appendChild(r);r.scrollIntoView({behavior:"smooth",block:"end"})}
async function answer(q){
 const shell=await ERPAssistantBridge.shellQuery(q);
 if(shell.handled){
   if(shell.type==="list"){add(shell.message+`<ul class="mods">${shell.items.map(x=>`<li>${x}</li>`).join("")}</ul>`,false,true);return}
   add(shell.message||"Certo.");return;
 }
 add("Entendi. Nesta primeira integração o Chat Mobile já controla sessão, permissões e abertura dos módulos do novo ERP. As consultas e ações de negócio entram na próxima camada do assistant_bridge.");
}
function send(){const q=input.value.trim();if(!q)return;add(q,true);input.value="";answer(q)}
$("#send").onclick=send;input.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
(async()=>{
 try{
  const {user}=await ERPAssistantBridge.init();
  if(!user){location.replace("/login_novo.html");return}
  $("#topName").textContent=user.nome||"Usuário";$("#topRole").textContent=user.cargo||"Assistente Mobile";
  const first=String(user.nome||"").trim().split(/\s+/)[0];const h=new Date().getHours();$("#greeting").textContent=(h<12?"Bom dia":h<18?"Boa tarde":"Boa noite")+(first?", "+first:"")+"! Em que posso ajudar?";
  $("#today").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
  add(`Olá${first?", "+first:""}! Estou usando a mesma sessão do ERP ÍMPAR. Pergunte “Quais funcionalidades eu tenho acesso?” ou peça para abrir uma delas.`);
 }catch(e){add("Não consegui iniciar o assistente: "+e.message,false);console.error(e)}
})();
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const r=new SR();r.lang="pt-BR";r.interimResults=true;$("#mic").onclick=()=>{try{r.start();$("#mic").classList.add("listen");$("#hint").textContent="Estou ouvindo…"}catch(_){}};r.onresult=e=>{let s="";for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript;input.value=s;if(e.results[e.results.length-1].isFinal)send()};r.onend=()=>{$("#mic").classList.remove("listen");$("#hint").textContent="Toque no microfone e fale naturalmente"}}else $("#mic").onclick=()=>$("#hint").textContent="Este navegador não disponibilizou reconhecimento de voz.";
</script>
</body></html>
