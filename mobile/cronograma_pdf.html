<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEORGE • Resumo Executivo</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,"Segoe UI",sans-serif;background:#edf3f5;color:#173247}body{display:grid;place-items:center;padding:20px}.c{width:min(540px,94vw);background:#fff;border:1px solid #d7e2e8;border-radius:22px;padding:26px;box-shadow:0 22px 70px #17324722}.h{display:flex;gap:12px;align-items:center}.o{width:52px;height:52px;border-radius:17px;background:linear-gradient(135deg,#18a66f,#2db9cc,#7357d9);display:grid;place-items:center;color:#fff;font-weight:1000;font-size:22px}.h h1{margin:0;font-size:19px}.h p{margin:4px 0 0;font-size:10px;font-weight:800;letter-spacing:1px;color:#738895}.s{margin-top:20px;border:1px solid #dce7eb;border-radius:15px;padding:17px;background:#f7fafb}.s b{display:block;font-size:14px}.s span{display:block;margin-top:5px;font-size:12px;line-height:1.45;color:#617687}.t{height:8px;border-radius:10px;background:#e3ecef;overflow:hidden;margin-top:13px}.b{height:100%;width:8%;background:#18a66f;border-radius:10px;transition:width .25s}.m{margin-top:10px;font-size:10px;color:#8395a0}.a{display:none;margin-top:15px}.a button{height:40px;border:0;border-radius:10px;background:#18a66f;color:#fff;padding:0 14px;font-weight:900}iframe{position:fixed;left:-30000px;top:0;width:1600px;height:1100px;border:0}</style></head><body><div class="c"><div class="h"><div class="o">G</div><div><h1 id="title">Preparando arquivo...</h1><p>GEORGE • ERP ÍMPAR</p></div></div><div class="s"><b id="step">Iniciando...</b><span id="text">Aguarde um instante.</span><div class="t"><div class="b" id="bar"></div></div></div><div class="m" id="meta"></div><div class="a" id="actions"><button id="again">Abrir impressão novamente</button></div></div><iframe id="src"></iframe><script>const OAPI="https://api.erpimpar.com.br/obras/api.php",CRON="/cronograma/cronograma_novo.html",$=id=>document.getElementById(id);let frame=null;const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();function stage(p,s,t){$("bar").style.width=p+"%";$("step").textContent=s;$("text").textContent=t}async function post(body){const r=await fetch(OAPI,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),cache:"no-store"}),x=await r.text();let j;try{j=JSON.parse(x)}catch(_){throw new Error("Resposta inválida da Gestão de Obras.")}if(!r.ok||j.ok===false)throw new Error(j.error||("HTTP "+r.status));return j}async function project(q){const l=await post({action:"project_list"}),n=norm(q),a=Array.isArray(l.projects)?l.projects:[];let h=a.find(p=>norm(p.name)===n||norm(p.code)===n||norm(p.id)===n)||a.find(p=>norm(p.name).includes(n)||n.includes(norm(p.name)));if(!h)throw new Error("Obra não encontrada.");try{const f=await post({action:"project_get",id:h.id||h.code});return f.project||h}catch(_){return h}}async function wait(fn,ms=45000){const t=Date.now();while(Date.now()-t<ms){try{const v=fn();if(v)return v}catch(_){}await new Promise(r=>setTimeout(r,120))}throw new Error("Tempo excedido aguardando o módulo.")}async function run(){const obra=new URLSearchParams(location.search).get("obra")||"";if(!obra)throw new Error("Informe a obra.");$("title").textContent="Cronograma da Obra";stage(15,"Localizando a obra...",obra);const p=await project(obra),file=p.scheduleFile||p.documents?.schedule?.file;if(!file)throw new Error("Cronograma vinculado não encontrado.");$("meta").textContent=(p.name||obra)+" • "+file;stage(40,"Cronograma localizado",file);frame=$("src");frame.src=CRON+"?arquivo="+encodeURIComponent(file)+"";await wait(()=>frame.contentWindow?.document?.getElementById("reportBtn"));frame.contentWindow.document.getElementById("reportBtn").click();await wait(()=>frame.contentWindow?.document?.getElementById("reportPrint"));stage(75,"Relatório oficial pronto","Usando exatamente a função Relatório + Imprimir / PDF do cronograma.");await new Promise(r=>setTimeout(r,350));stage(92,"Abrindo impressão nativa...","Sem html2pdf, captura ou redimensionamento.");frame.contentWindow.document.getElementById("reportPrint").click();stage(100,"Impressão aberta ✓","Escolha Salvar como PDF. O navegador usa o layout oficial do cronograma.");$("actions").style.display="block"}$("again").onclick=()=>frame?.contentWindow?.document?.getElementById("clientPrint")?.click();run().catch(e=>{$("title").textContent="Não foi possível gerar";$("step").textContent="Falha";$("text").textContent=e.message;$("bar").style.width="100%"})</script></body></html>
