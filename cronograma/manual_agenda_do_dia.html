<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modelo do Manual ERP ÍMPAR</title>
<style>
:root{--navy:#103f78;--blue:#1672e6;--blue-dark:#0d4a9c;--blue-soft:#eaf3ff;--cyan:#18a8e8;--indigo:#4b38ed;--ink:#173247;--muted:#667b8d;--line:#c9dcf2;--bg:#edf3f7;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#dfeaf5,#f8fbff);font-family:Arial,sans-serif;color:var(--ink)}
.demo{min-height:100vh;padding:28px}.shell{max-width:1120px;margin:auto;background:#fff;border-radius:24px;box-shadow:0 24px 80px #17324730;overflow:hidden}
.erp-head{height:92px;background:#fff;border-bottom:1px solid #dbe6ef;display:flex;align-items:center;justify-content:space-between;padding:0 28px;color:var(--navy)}.brand{display:flex;align-items:center;gap:12px}.brand img{width:50px;height:50px;border-radius:14px;box-shadow:0 8px 22px #1672e633}.brand small{display:block;color:#657a90;font-weight:700;font-size:11px}.brand b{display:block;font-size:25px;color:var(--blue-dark)}.status{font-size:13px;font-weight:800;color:var(--blue-dark)}.status:before{content:"";display:inline-block;width:10px;height:10px;background:var(--blue);border-radius:50%;margin-right:8px;box-shadow:0 0 0 5px #1672e622}
.module{padding:22px;background:#edf3f7}.module-card{background:#fff;border:1px solid var(--line);border-left:7px solid var(--blue);border-radius:18px;padding:18px}.module-title{display:flex;align-items:center;justify-content:space-between;gap:14px}.module-title h1{margin:0;font-size:22px;color:var(--blue-dark)}.help-open{border:0;border-radius:11px;background:linear-gradient(135deg,var(--blue-dark),var(--blue),var(--indigo));color:#fff;padding:12px 18px;font-weight:900;cursor:pointer}.ghost-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.ghost{height:150px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(#f9fbff,#eaf2fa)}
.overlay{position:fixed;inset:0;background:#0d2f57c4;display:flex;padding:24px;align-items:center;justify-content:center}.overlay[hidden]{display:none}.viewer{width:min(1080px,100%);height:min(840px,94vh);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 30px 100px #0005;display:grid;grid-template-rows:auto 1fr}.viewer-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}.viewer-brand{display:flex;align-items:center;gap:11px}.viewer-brand img{width:44px;height:44px;border-radius:12px;box-shadow:0 6px 18px #1672e633}.viewer-head h2{margin:0;font-size:20px;color:var(--blue-dark)}.viewer-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #bfd4ea;background:#f3f8ff;color:#234f7d;padding:10px 12px;border-radius:9px;font-weight:800}.actions .primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.viewer-body{display:grid;grid-template-columns:250px 1fr;min-height:0}.nav{padding:18px;background:#f1f6fb;border-right:1px solid var(--line);overflow:auto}.nav b{font-size:11px;color:var(--muted);letter-spacing:.08em}.nav a{display:block;padding:9px 10px;margin:4px 0;border-radius:9px;color:#31556d;text-decoration:none;font-size:12px;font-weight:700}.nav a.active{background:var(--blue-soft);color:var(--blue-dark)}.doc{overflow:auto;padding:28px 34px}.doc-kicker{color:var(--blue);font-weight:900;font-size:11px;letter-spacing:.12em}.doc h1{font-size:30px;margin:8px 0;color:var(--blue-dark)}.summary{color:var(--muted);font-size:15px;line-height:1.55;max-width:760px}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:22px 0}.flow div{border:1px solid var(--line);background:#f7faff;border-radius:12px;padding:12px;font-size:11px;line-height:1.35}.flow strong{display:block;color:var(--blue);font-size:18px;margin-bottom:5px}.manual-section{padding:18px 0;border-top:1px solid var(--line)}.manual-section h2{font-size:19px;margin:0 0 8px;color:var(--blue-dark)}.manual-section p,.manual-section li{font-size:13px;line-height:1.55}.manual-section li{margin-bottom:5px}.command{border-left:4px solid var(--blue);background:#eef5ff;padding:9px 12px;margin:7px 0;border-radius:0 9px 9px 0;font-size:12px}.faq b{color:var(--blue-dark)}
@media(max-width:760px){.demo{padding:0}.shell{border-radius:0}.ghost-cards{grid-template-columns:1fr}.overlay{padding:0}.viewer{height:100vh;border-radius:0}.viewer-head{align-items:flex-start;flex-direction:column}.viewer-brand img{width:40px;height:40px}.actions{width:100%}.actions button{flex:1;font-size:11px;padding:9px 5px}.viewer-body{grid-template-columns:1fr}.nav{display:none}.doc{padding:22px 18px}.flow{grid-template-columns:1fr}.erp-head{height:78px;padding:0 18px}.brand img{width:42px;height:42px}.brand b{font-size:20px}}
@media print{body{background:#fff}.demo,.overlay{padding:0}.shell,.viewer{box-shadow:none}.erp-head,.module,.nav,.viewer-head{display:none}.overlay{position:static;background:#fff}.viewer{height:auto}.viewer-body{display:block}.doc{overflow:visible}.manual-section{break-inside:avoid}}
</style>
</head>

<script>const MANUAL={"schema_version": "1.0", "manual_id": "agenda-do-dia", "module": "Agenda do Dia", "product": "ERP ÍMPAR", "version": "1.3", "updated_at": "2026-09-12", "title": "Manual da Agenda do Dia", "subtitle": "Guia operacional para planejar, atualizar, acompanhar e fechar o dia", "summary": "A Agenda do Dia organiza colaboradores, obras, atividades, viagens e veículos. Ela nasce da Agenda Semanal uma única vez e, depois de criada, passa a ser o rascunho oficial e independente daquele dia.", "quick_flow": ["Confira o dia selecionado e os colaboradores exibidos.", "Atualize as atividades e mova ou copie os cards quando necessário.", "Use Salvar para registrar o estado atual e criar o ponto de retorno do Desfazer.", "Revise percentuais e motivos antes de finalizar.", "Finalize o dia e use o relatório para consultar, imprimir, baixar ou compartilhar."], "sections": [{"id": "visao-geral", "title": "Entenda a Agenda do Dia", "intro": "A tela mostra o planejamento e a execução de um único dia de trabalho.", "items": ["A Agenda Semanal é usada somente para criar o dia.", "Depois da criação, a Agenda do Dia não consulta, compara nem reconstrói o conteúdo com base na Agenda Semanal.", "Enquanto estiver aberta, a Agenda do Dia é mutável e a última gravação válida prevalece.", "Cada salvamento registra usuário, data e horário para permitir identificar quem realizou a última atualização.", "A sessão já autenticada no ERP ÍMPAR é reutilizada; o módulo não deve solicitar um segundo login."]}, {"id": "cards-estados", "title": "Leia os cards e os estados", "intro": "Cada colaborador possui um card com suas atividades do dia.", "items": ["Atividade planejada mantém sua origem e pode ser atualizada durante o dia.", "Atividade replanejada identifica uma mudança feita depois da criação do dia.", "Atividade cancelada permanece visível quando veio do planejamento semanal, preservando o histórico.", "Atividade criada manualmente pode ser removida do rascunho.", "Obra sem cronograma é apresentada com o estado visual correspondente, sem impedir o uso do rascunho."]}, {"id": "colaboradores", "title": "Gerencie colaboradores", "intro": "A lista da tela representa somente os colaboradores vinculados ao dia aberto.", "items": ["Adicionar cria a participação do colaborador naquele dia e abre um card vazio para programação.", "Remover retira a participação e as atividades do dia, mas não apaga o cadastro mestre.", "Cargo e função são somente leitura e vêm do Cadastro Mestre.", "Se uma pessoa já estiver no rascunho, uma pendência no cadastro global não bloqueia Salvar ou Finalizar.", "O cadastro rápido deve ser usado apenas para uma inclusão realmente nova."]}, {"id": "atividades", "title": "Crie e edite atividades", "intro": "As atividades podem ser ajustadas enquanto o dia estiver aberto.", "items": ["Clique na atividade para selecioná-la e use o editor do campo para alterar o conteúdo.", "Informe obra, descrição e os demais dados operacionais aplicáveis.", "Ao cancelar uma atividade planejada, preserve o item e informe o motivo quando exigido no fechamento.", "Uma atividade cancelada de origem semanal pode ser restaurada.", "Uma atividade manual removida desaparece do rascunho e não possui restauração como item semanal."]}, {"id": "mover-copiar", "title": "Mova e copie atividades", "intro": "Use arrastar e soltar para reorganizar o trabalho entre colaboradores e atividades.", "items": ["Arrastar sem Ctrl move a atividade selecionada para o destino.", "Manter Ctrl pressionado permite copiar a atividade para um ou mais destinos.", "Na movimentação, a origem planejada preserva seu histórico de cancelamento; um item manual sai da origem.", "Na cópia, a origem permanece intacta e os destinos recebem novas atividades.", "Clique fora da seleção ou pressione Esc para limpar a seleção atual."]}, {"id": "veiculos-viagens", "title": "Registre veículos e viagens", "intro": "Veículos e viagens acompanham a execução do dia e permanecem associados ao colaborador quando aplicável.", "items": ["Arraste a placa disponível para o colaborador ou para a atividade conforme o comportamento da tela.", "A troca ou devolução do veículo deve usar os controles existentes do módulo.", "Marque viagem e informe o período quando houver deslocamento.", "Atividades internas da empresa podem seguir as exceções de veículo previstas na Agenda.", "O relatório apresenta viagens e veículos registrados naquele dia."]}, {"id": "salvar-desfazer", "title": "Use Salvar e Desfazer", "intro": "Salvar confirma o estado atual do rascunho. Desfazer retorna ao último salvamento confirmado.", "items": ["Salvar persiste exatamente o que está visível e registra autoria e horário.", "Cada novo Salvar substitui o ponto de retorno anterior.", "Desfazer e Ctrl Z restauram todas as alterações posteriores ao último Salvar.", "O salvamento automático não cria um novo ponto de retorno para o Desfazer.", "Salvar não significa Finalizar e o dia continua editável."]}, {"id": "finalizar", "title": "Finalize o dia", "intro": "Finalizar encerra a edição e grava o histórico oficial e congelado daquele dia.", "items": ["Revise todas as atividades antes de finalizar.", "Atividade concluída recebe 100 por cento.", "Atividade parcialmente concluída exige percentual realizado e motivo.", "Atividade cancelada exige o motivo operacional quando aplicável.", "O fechamento valida somente os dados operacionais do próprio dia e não depende da próxima Agenda Semanal.", "Depois de finalizado, o histórico fica disponível somente para consulta."]}, {"id": "relatorios", "title": "Consulte e compartilhe relatórios", "intro": "O relatório oficial reúne colaboradores, obras, atividades, viagens, veículos e estados registrados.", "items": ["Abra o relatório dentro do próprio ERP ÍMPAR.", "Use os controles do visualizador para fechar, imprimir, baixar o PDF ou compartilhar.", "A abertura e a geração do relatório são operações somente de leitura e não alteram o rascunho.", "O George pode consolidar horas e alocações por período, obra, colaborador, função, atividade, veículo e situação.", "Nas análises, cada colaborador representa oito horas por dia, rateadas igualmente entre suas atividades produtivas válidas.", "Resultados analíticos podem ser apresentados como resumo, tabela, CSV compatível com Excel, gráfico, dashboard ou PDF."]}, {"id": "george", "title": "Use o George na Agenda do Dia", "intro": "Depois de entrar no contexto Agenda do Dia, comandos curtos são entendidos dentro desse módulo até você pedir outro contexto.", "commands": [["Ajuda e manual", "George, gera o manual da Agenda do Dia."], ["Funções disponíveis", "George, o que você consegue fazer na Agenda do Dia?"], ["Consulta", "George, lista as atividades do Valdeci na semana passada."], ["Movimentação", "George, move esta atividade para o Leandro."], ["Cancelamento", "George, cancela a atividade do Leandro."], ["Salvamento", "George, salva a Agenda do Dia."], ["Desfazer", "George, volta ao último salvamento."], ["Fechamento", "George, fecha a Agenda do Dia."], ["Relatório", "George, gera e abre o relatório em PDF."], ["Análise", "George, qual obra consumiu mais horas neste mês?"]], "items": ["O George usa as mesmas operações oficiais da tela.", "Áudio e texto mantêm o mesmo contexto de conversa.", "Quando não puder concluir uma solicitação, deve informar diretamente o motivo e não confirmar uma operação que não foi verificada."]}, {"id": "duvidas", "title": "Resolva dúvidas frequentes", "faqs": [["Salvar fecha a Agenda?", "Não. Salvar registra o rascunho atual e mantém o dia editável."], ["A Agenda Semanal pode alterar o dia depois de criado?", "Não. Depois da criação, a Agenda do Dia é independente."], ["Posso desfazer várias mudanças?", "Sim. Desfazer retorna todo o rascunho ao último Salvar confirmado."], ["Quem salvou por último?", "A auditoria registra usuário, data e horário da última gravação válida."], ["Por que não consigo abrir o próximo dia?", "Verifique se o dia anterior ainda está aberto e precisa ser finalizado."], ["O relatório modifica a Agenda?", "Não. Consultar, imprimir, baixar e compartilhar o relatório são operações somente de leitura."], ["O George pede uma nova senha?", "Não deve pedir. Ele reutiliza a sessão autenticada do ERP ÍMPAR."], ["Posso consultar dias anteriores?", "Sim. Dias finalizados são abertos em modo de consulta e não podem ser alterados."]]}]};
const nav=document.getElementById('nav'), sections=document.getElementById('sections');
