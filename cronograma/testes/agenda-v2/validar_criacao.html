<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ERP ÍMPAR — Validação criação Agenda V2</title>
  <style>
    :root{--bg1:#07111f;--bg2:#0b1e4a;--panel:rgba(255,255,255,.06);--border:rgba(148,163,184,.22);--text:#e5e7eb;--muted:#94a3b8;--green:#22c55e;--yellow:#facc15;--red:#fb7185;--blue:#38bdf8;--shadow:0 18px 50px rgba(0,0,0,.32)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}
    body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);background:radial-gradient(circle at top left,rgba(56,189,248,.10),transparent 28%),radial-gradient(circle at top right,rgba(34,197,94,.10),transparent 24%),linear-gradient(135deg,var(--bg1),var(--bg2));padding:24px}
    .wrap{width:min(1180px,96vw);margin:0 auto}.head{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
    h1{margin:0 0 6px;font-size:26px}.sub{color:var(--muted);font-size:14px}.status{margin:16px 0;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:rgba(2,6,23,.52);font-family:Consolas,monospace;font-weight:700}
    .status.ok{color:#bbf7d0;border-color:rgba(34,197,94,.35)}.status.warn{color:#fde68a;border-color:rgba(250,204,21,.35)}.status.err{color:#fecdd3;border-color:rgba(251,113,133,.35)}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}button{border:0;border-radius:999px;padding:11px 16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#22c55e,#16a34a);color:#031312}
    button.secondary{background:rgba(56,189,248,.16);color:#dbeafe;border:1px solid rgba(56,189,248,.30)}pre{margin:0;white-space:pre-wrap;word-break:break-word;background:#020617;border:1px solid #334155;border-radius:16px;padding:18px;line-height:1.45;box-shadow:var(--shadow);font-family:Consolas,monospace;font-size:13px;min-height:280px}
    .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 16px}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px}.card small{display:block;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.card b{font-size:15px}
    @media (max-width:760px){body{padding:14px}.meta{grid-template-columns:1fr}h1{font-size:22px}}
  </style>
</head>
<body>
<div class="wrap">
  <section class="head">
    <h1>ERP ÍMPAR — Validação servidor da Agenda V2</h1>
    <div class="sub">Teste de integração GitHub → API KingHost → Banco V2. Esta tela não grava a Agenda do Dia.</div>
  </section>
  <div class="meta">
    <div class="card"><small>Semana</small><b id="metaSemana">2026-09-07</b></div>
    <div class="card"><small>Data destino</small><b id="metaData">2026-09-08</b></div>
    <div class="card"><small>Modo</small><b>Somente validação</b></div>
  </div>
  <div class="actions">
    <button id="btnExecutar">Executar validação</button>
    <button class="secondary" id="btnLimpar">Limpar resultado</button>
  </div>
  <div id="status" class="status">Aguardando execução...</div>
  <pre id="out"></pre>
</div>
<script>
(() => {
  "use strict";
  const API_BASE = "https://api.erpimpar.com.br";
  const EMAIL = "george@imparsistemas.com";
  const SEMANA = "2026-09-07";
  const DATA_DESTINO = "2026-09-08";
  const $ = (id) => document.getElementById(id);
  $("metaSemana").textContent = SEMANA;
  $("metaData").textContent = DATA_DESTINO;
  function setStatus(texto,tipo=""){const el=$("status");el.className="status"+(tipo?" "+tipo:"");el.textContent=texto}
  async function lerJson(url,options={}){
    const resp=await fetch(url,{cache:"no-store",...options});
    const texto=await resp.text();
    let json;
    try{json=JSON.parse(texto)}catch(e){throw new Error("Resposta não-JSON em "+url+"\nHTTP "+resp.status+"\n\n"+texto.slice(0,2000))}
    if(!resp.ok){throw new Error("HTTP "+resp.status+" em "+url+"\n\n"+JSON.stringify(json,null,2))}
    return json;
  }
  async function executar(){
    $("btnExecutar").disabled=true;$("out").textContent="";setStatus("1/2 — Lendo Agenda Semanal oficial...","warn");
    try{
      const fonteUrl=API_BASE+"/agenda/carregar_agenda.php?semana="+encodeURIComponent(SEMANA)+"&t="+Date.now();
      const fonte=await lerJson(fonteUrl);
      setStatus("2/2 — Validando no Banco V2...","warn");
      const validarUrl=API_BASE+"/db-v2/agenda/validar_criacao.php";
      const resposta=await lerJson(validarUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:EMAIL,semana:SEMANA,data_destino:DATA_DESTINO,fonte})});
      $("out").textContent=JSON.stringify(resposta,null,2);
      if(resposta.status==="PRONTO_PARA_CRIAR"){setStatus("PRONTO_PARA_CRIAR — validação concluída e nenhum dado foi gravado.","ok")}
      else{setStatus(resposta.status||"Validação concluída com pendências.","warn")}
    }catch(e){console.error(e);$("out").textContent=e.stack||String(e);setStatus("ERRO NA VALIDAÇÃO","err")}
    finally{$("btnExecutar").disabled=false}
  }
  $("btnExecutar").addEventListener("click",executar);
  $("btnLimpar").addEventListener("click",()=>{$("out").textContent="";setStatus("Aguardando execução...")});
  executar();
})();
</script>
</body>
</html>
