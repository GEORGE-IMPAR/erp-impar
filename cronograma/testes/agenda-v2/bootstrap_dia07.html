<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERP ÍMPAR — Bootstrap Dia Atual</title><style>body{margin:0;padding:22px;background:#07111f;color:#e5e7eb;font-family:Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto}.box{background:#0b1b2d;border:1px solid #27445a;border-radius:16px;padding:18px;margin-bottom:14px}button{border:0;border-radius:999px;padding:12px 18px;background:#22c55e;font-weight:900;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#020617;border:1px solid #334155;border-radius:14px;padding:16px;min-height:300px}.ok{color:#86efac}.warn{color:#fde68a}.err{color:#fda4af}</style><body><div class="wrap"><div class="box"><h2>Agenda do Dia V2 — Preview do rascunho real de 07/09/2026</h2><p>Esta tela lê o draft atual do servidor legado. <b>Não grava nada</b> e <b>não relê a Agenda Semanal</b>.</p><button id="go">Analisar rascunho do dia 07</button><div id="status"></div></div><pre id="out"></pre></div><script>const API='https://api.erpimpar.com.br/db-v2/agenda/bootstrap_dia_atual.php?data=2026-09-07&t=';async function run(){status.textContent='Lendo...';status.className='warn';out.textContent='';try{const r=await fetch(API+Date.now(),{cache:'no-store'});const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){throw new Error(t)}out.textContent=JSON.stringify(j,null,2);status.textContent=j.status+' • gravou_dados='+(j.gravou_dados?'true':'false');status.className=j.ok?'ok':'err'}catch(e){status.textContent='ERRO';status.className='err';out.textContent=e.stack||String(e)}}go.onclick=run;run();</script></body></html>
