<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP ÍMPAR • Medição Empreiteiro</title>
<style>
:root{--g:#14b878;--g2:#087451;--ink:#173247;--muted:#6f8798;--line:#d5e1e7;--soft:#f3f7f8;--white:#fff;--danger:#e65361;--warn:#e3a31d}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--soft)}
button,input{font:inherit}.page{height:100%;padding:10px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
.hero,.panel,.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(17,52,72,.06)}
.hero{padding:13px 16px;border-left:6px solid var(--g);display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h1{margin:0;color:var(--g2);font-size:21px;letter-spacing:-.03em}.hero p{margin:4px 0 0;color:var(--muted);font-size:10px}
.hero-badge{padding:7px 10px;border-radius:999px;background:#eaf8f1;color:var(--g2);font-size:9px;font-weight:950}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{padding:10px 12px}.kpi small{display:block;font-size:8px;color:var(--muted);font-weight:950;letter-spacing:.08em}.kpi b{display:block;margin-top:4px;font-size:19px}
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:310px minmax(0,1fr);gap:9px}.panel{min-height:0;overflow:hidden;display:flex;flex-direction:column}
.ph{padding:11px 13px;background:#f8fbfc;border-bottom:1px solid var(--line);font-weight:950;color:var(--g2);font-size:12px}.list,.body{padding:9px;overflow:auto;min-height:0}
.contract{padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff}.contract:hover{border-color:#91cdb5}.contract.active{border-color:var(--g);background:#eefaf4;box-shadow:inset 3px 0 0 var(--g)}
.contract b{display:block;font-size:11px}.contract small{display:block;margin-top:3px;color:var(--muted);font-size:9px;line-height:1.4}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:9px}.meta>div{padding:9px;background:#f8fbfc;border:1px solid var(--line);border-radius:9px}.meta small{display:block;font-size:8px;color:var(--muted);font-weight:950}.meta b{display:block;margin-top:3px;font-size:10px}
.table{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:970px}th{padding:8px;background:#eaf1f5;color:#526b7b;font-size:8px;text-align:left;white-space:nowrap}td{padding:7px;border-top:1px solid #e8eff3;font-size:9px;vertical-align:middle}td.desc{min-width:260px;font-weight:800}
input.pct{width:86px;height:30px;border:1px solid #c6d6df;border-radius:7px;padding:0 7px;text-align:right}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.btn{height:38px;border:1px solid #cbd9e1;border-radius:9px;background:#eef3f6;color:#28495b;padding:0 14px;font-size:10px;font-weight:950;cursor:pointer}.btn.primary{background:var(--g);border-color:var(--g);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.history{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.history h3{margin:0;padding:9px 11px;background:#f8fbfc;color:var(--g2);font-size:10px}.hrow{display:grid;grid-template-columns:130px 1fr 130px;gap:8px;padding:8px 11px;border-top:1px solid #edf2f5;font-size:9px}.status{font-weight:950}.status.ok{color:var(--g2)}.status.wait{color:#9b6d00}.status.no{color:#b23a47}
.empty{padding:55px 20px;text-align:center;color:var(--muted);font-size:12px}.toast{position:fixed;right:18px;top:18px;display:none;max-width:420px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--g);border-radius:11px;padding:12px 14px;box-shadow:0 18px 45px rgba(17,52,72,.20);z-index:99}.toast.show{display:block}.toast.error{border-left-color:var(--danger)}
@media(max-width:850px){.workspace{grid-template-columns:1fr}.kpis,.meta{grid-template-columns:1fr 1fr}.page{overflow:auto;height:auto}.workspace{min-height:700px}}
</style>
</head>
<body>
<div class="page">
  <header class="hero"><div><h1>MEDIÇÃO EMPREITEIRO</h1><p>Contrato • Composição • Medição • Aprovação por e-mail • Financeiro</p></div><span class="hero-badge">WORKFLOW INTEGRADO</span></header>
  <section class="kpis">
    <div class="kpi"><small>VALOR CONTRATADO</small><b id="kContrato">R$ 0,00</b></div>
    <div class="kpi"><small>JÁ MEDIDO</small><b id="kMedido">R$ 0,00</b></div>
    <div class="kpi"><small>ESTA MEDIÇÃO</small><b id="kAtual">R$ 0,00</b></div>
    <div class="kpi"><small>SALDO</small><b id="kSaldo">R$ 0,00</b></div>
  </section>
  <section class="workspace">
    <aside class="panel"><div class="ph">Contratos de empreiteiro</div><div class="list" id="contracts">Carregando contratos...</div></aside>
    <main class="panel"><div class="ph">Lançamento da medição</div><div class="body" id="work"><div class="empty">Selecione um contrato de empreiteiro.</div></div></main>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
const DOC_API="https://api.erpimpar.com.br/documentos/api.php";
const MED_API="https://api.erpimpar.com.br/medicoes/api.php";
const $=id=>document.getElementById(id);
let contracts=[],selected=null,measurements=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function money(v){if(typeof v==="number")return v;let s=String(v||"").replace(/R\$/gi,"").trim();if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");return Number(s)||0}
function toast(msg,error=false){const el=$("toast");el.textContent=msg;el.className="toast show"+(error?" error":"");clearTimeout(toast.t);toast.t=setTimeout(()=>el.className="toast",5200)}
async function post(url,payload){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),cache:"no-store"});const text=await r.text();let j={};try{j=text?JSON.parse(text):{}}catch{}if(!r.ok||j.ok===false)throw new Error(j.error||text||("HTTP "+r.status));return j}
function contractItems(c){return c?.form?.composicaoMedicao||c?.form?.contractorItems||c?.composicaoMedicao||[]}
async function loadContracts(){
  const j=await post(DOC_API,{action:"document_list"});
  const docs=Array.isArray(j.documents)?j.documents:(Array.isArray(j.data)?j.data:[]);

  // document_list da Gestão Documental retorna SOMENTE o resumo do contrato.
  // O formulário completo (tipoContrato, obra e composicaoMedicao) vem em document_get.
  contracts=docs.filter(x=>{
    const template=String(x.templateNome||x.template_name||x.templateId||"").toLowerCase();
    return template.includes("empreiteiro");
  });

  $("contracts").innerHTML=contracts.length?contracts.map((c,i)=>`
    <div class="contract" data-i="${i}">
      <b>${esc(c.codigo||c.id||"Contrato de Empreiteiro")}</b>
      <small>${esc(c.contratada||"Empreiteiro")} • ${esc(c.servico||c.templateNome||"Contrato de Empreiteiro")}</small>
    </div>`).join(""):'<div class="empty">Nenhum contrato de empreiteiro encontrado.</div>';

  $("contracts").onclick=e=>{const x=e.target.closest("[data-i]");if(x)openContract(Number(x.dataset.i))}
}

async function openContract(i){
  const summary=contracts[i];
  document.querySelectorAll(".contract").forEach((x,n)=>x.classList.toggle("active",n===i));

  // Busca o contrato COMPLETO pelo mesmo endpoint usado pela Gestão Documental.
  const detail=await post(DOC_API,{action:"document_get",id:summary.id});
  const full=detail.document;
  if(!full)throw new Error("Contrato de empreiteiro não encontrado.");

  selected=full;

  // Validação defensiva: aceita o template ou o tipo gravado no formulário.
  const f=selected.form||{};
  const isContractor=
    String(f.tipoContrato||"").toLowerCase()==="empreiteiro" ||
    String(f.templateId||"").toLowerCase()==="contrato_empreiteiro" ||
    String(summary.templateNome||"").toLowerCase().includes("empreiteiro");
  if(!isContractor)throw new Error("O documento selecionado não é um contrato de empreiteiro.");

  const contractId=selected.id||f.codigo||summary.id;
  const j=await post(MED_API,{action:"list",contract_id:contractId});
  measurements=j.medicoes||[];
  render();
}
function previousMap(){
  const p={};
  measurements.filter(m=>!["REPROVADA_DIRETOR","CANCELADA"].includes(String(m.status||"").toUpperCase())).forEach(m=>(m.itens||[]).forEach(x=>p[String(x.item)]=(p[String(x.item)]||0)+Number(x.percentual_medicao||0)));
  return p;
}
function itemValue(x){return Number(x.valorTotal??x.valor_total??((Number(x.quantidade)||0)*(Number(x.valorUnitario??x.valor_unitario)||0)))||0}
function statusClass(s){s=String(s||"").toUpperCase();if(s.includes("PAGO")||s.includes("APROVADA"))return "ok";if(s.includes("REPROV"))return "no";return "wait"}
function render(){
  const p=previousMap(),items=contractItems(selected),contractValue=money(selected.form?.valor??selected.valor);
  const measured=measurements.filter(m=>!["REPROVADA_DIRETOR","CANCELADA"].includes(String(m.status||"").toUpperCase())).reduce((a,m)=>a+Number(m.valor_total||0),0);
  $("kContrato").textContent=brl(contractValue);$("kMedido").textContent=brl(measured);$("kAtual").textContent=brl(0);$("kSaldo").textContent=brl(contractValue-measured);
  const obra=selected.form?.obra?.name||selected.form?.obra?.nome||"—",emp=selected.form?.contratada?.nome||selected.form?.contratado?.nome||"—",code=selected.form?.codigo||selected.id||"—";
  $("work").innerHTML=`<div class="meta"><div><small>OBRA</small><b>${esc(obra)}</b></div><div><small>EMPREITEIRO</small><b>${esc(emp)}</b></div><div><small>CONTRATO</small><b>${esc(code)}</b></div><div><small>MEDIÇÕES</small><b>${measurements.length}</b></div></div>
  <div class="table"><table><thead><tr><th>Item</th><th>Descrição</th><th>Valor item</th><th>% anterior</th><th>% desta medição</th><th>% acumulado</th><th>Valor desta medição</th><th>Saldo após</th></tr></thead><tbody>
  ${items.map((x,i)=>{const id=String(x.item||i+1),prev=p[id]||0,v=itemValue(x);return `<tr><td>${esc(id)}</td><td class="desc">${esc(x.descricao||"")}</td><td>${brl(v)}</td><td>${prev.toFixed(2)}%</td><td><input class="pct" data-i="${i}" type="number" min="0" max="${Math.max(0,100-prev)}" step="0.01" value="0"></td><td class="acc">${prev.toFixed(2)}%</td><td class="now">${brl(0)}</td><td class="balance">${brl(v*(1-prev/100))}</td></tr>`}).join("")}
  </tbody></table></div>
  <div class="actions"><button class="btn primary" id="send">ENVIAR PARA APROVAÇÃO →</button></div>
  <section class="history"><h3>Histórico de medições</h3>${measurements.length?measurements.slice().reverse().map(m=>`<div class="hrow"><span>${esc(new Date(m.criado_em||m.criadoEm||Date.now()).toLocaleString("pt-BR"))}</span><span class="status ${statusClass(m.status)}">${esc(m.status||"—")}</span><b>${brl(m.valor_total||0)}</b></div>`).join(""):'<div class="hrow"><span>—</span><span>Nenhuma medição anterior</span><b>—</b></div>'}</section>`;
  document.querySelectorAll("input.pct").forEach(x=>x.oninput=calculate);
  $("send").onclick=send;
  calculate();
}
function calculate(){
  if(!selected)return;
  const p=previousMap(),items=contractItems(selected),contractValue=money(selected.form?.valor??selected.valor);
  const already=measurements.filter(m=>!["REPROVADA_DIRETOR","CANCELADA"].includes(String(m.status||"").toUpperCase())).reduce((a,m)=>a+Number(m.valor_total||0),0);
  let current=0;
  document.querySelectorAll("input.pct").forEach(inp=>{const i=Number(inp.dataset.i),x=items[i],id=String(x.item||i+1),prev=p[id]||0,max=Math.max(0,100-prev),pct=Math.max(0,Math.min(max,Number(inp.value)||0)),v=itemValue(x),row=inp.closest("tr"),now=v*pct/100;current+=now;row.querySelector(".acc").textContent=(prev+pct).toFixed(2)+"%";row.querySelector(".now").textContent=brl(now);row.querySelector(".balance").textContent=brl(v*(1-(prev+pct)/100))});
  $("kAtual").textContent=brl(current);$("kSaldo").textContent=brl(contractValue-already-current);
}
async function send(){
  const p=previousMap(),items=contractItems(selected);let rows=[],total=0;
  document.querySelectorAll("input.pct").forEach(inp=>{const i=Number(inp.dataset.i),x=items[i],id=String(x.item||i+1),prev=p[id]||0,pct=Number(inp.value)||0,v=itemValue(x);if(pct>0){const val=v*pct/100;total+=val;rows.push({item:id,descricao:x.descricao||"",percentual_anterior:prev,percentual_medicao:pct,percentual_acumulado:prev+pct,valor_item:v,valor_medicao:val})}});
  if(!rows.length)return toast("Informe um percentual em pelo menos um item.",true);
  let u={};try{u=JSON.parse(localStorage.getItem("ERPIMPAR_USER")||sessionStorage.getItem("ERPIMPAR_USER")||"{}")}catch{}
  $("send").disabled=true;
  try{
    const j=await post(MED_API,{action:"create",contract_id:selected.id||selected.form?.codigo,contract_code:selected.form?.codigo||"",obra:selected.form?.obra||{},empreiteiro:selected.form?.contratada||selected.form?.contratado||{},valor_contrato:money(selected.form?.valor??selected.valor),valor_total:total,itens:rows,solicitante:{nome:u.nome||"",email:u.email||""}});
    toast(j.email_status==="enviado"?"Medição salva e e-mail de aprovação enviado.":"Medição salva. E-mail ficou pendente para reenvio.");
    await openContract(contracts.indexOf(selected));
  }catch(e){toast(e.message,true)}
  finally{$("send")&&($("send").disabled=false)}
}
loadContracts().catch(e=>toast(e.message,true));
</script>
</body></html>
