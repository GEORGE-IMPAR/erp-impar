<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Limpar cache George</title><style>body{font-family:system-ui;padding:25px}button{padding:15px;font-size:18px}</style><h2>George — Limpar versão antiga</h2><button id="b">LIMPAR CACHE E REABRIR</button><pre id="p"></pre><script>
document.getElementById('b').onclick=async()=>{
  const regs=await navigator.serviceWorker?.getRegistrations?.()||[];
  for(const r of regs){if(r.scope.includes('/george-reuniao/'))await r.unregister()}
  const keys=await caches.keys();for(const k of keys)if(k.toLowerCase().includes('george'))await caches.delete(k);
  document.getElementById('p').textContent='Cache limpo. Reabrindo...';
  setTimeout(()=>location.href='./?v=0401',800);
};
</script>
