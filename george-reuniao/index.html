<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c3447">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/styles.css?v=0.8">
<title>George — ERP ÍMPAR</title>
</head>
<body>
<div class="app">

<header class="topbar">
  <div class="brand">
    <div class="brand-logo"><img src="assets/logo_george.png" alt="ERP ÍMPAR"></div>
    <div class="brand-copy">
      <strong>ERP ÍMPAR</strong>
      <span>GEORGE • INTELIGÊNCIA OPERACIONAL</span>
    </div>
  </div>
  <div class="online"><i class="online-dot"></i><span id="onlineText">online</span></div>
</header>

<main class="chat" id="chat">
  <div class="today">Hoje</div>

  <div class="msg george">
    <div class="msg-avatar"><img src="assets/logo_george.png" alt="George"></div>
    <div class="bubble">
      <div class="who">GEORGE</div>
      <div>Oi! Eu sou o George. Como posso te ajudar hoje?</div>
      <div class="time" id="firstTime">—</div>
    </div>
  </div>

  <div id="typingAnchor"></div>
</main>

<footer class="footer">
  <div id="modeStatus" class="mode-status show audio">
    <span class="status-dot"></span>
    <span id="modeStatusText">Áudio selecionado • ativando microfone...</span>
  </div>

  <div class="composer-row">
    <div class="input-shell">
      <textarea id="manual" rows="1" placeholder="Fale ou digite para o George"></textarea>
    </div>
    <button class="send" id="btnSend" type="button" aria-label="Enviar">
      <svg viewBox="0 0 24 24"><path d="M4 12 20 4l-5.6 16-3.2-6.8L4 12Z"/><path d="m11.2 13.2 4.5-4.4"/></svg>
    </button>
  </div>

  <div class="actions">
    <button class="action" id="btnMeeting" type="button" data-mode="meeting">
      <svg viewBox="0 0 24 24">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <div class="label">Reunião</div>
    </button>

    <button class="action kickoff" id="btnKickoff" type="button" data-mode="kickoff">
      <svg viewBox="0 0 24 24">
        <path d="M3 12v3"/><path d="M7 8v8"/><path d="M11 5v14"/><path d="M15 8v8"/><path d="M19 10v4"/>
      </svg>
      <div class="label">Kickoff</div>
      <div class="sub">SÓ OUVIR</div>
    </button>

    <button class="action" id="btnAttach" type="button" data-mode="attach">
      <svg viewBox="0 0 24 24">
        <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
      </svg>
      <div class="label">Anexar</div>
    </button>

    <button class="action active" id="btnAudio" type="button" data-mode="audio">
      <svg viewBox="0 0 24 24">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0"/>
        <path d="M12 17v5"/><path d="M8 22h8"/>
      </svg>
      <div class="label">Áudio</div>
    </button>

    <button class="action" id="btnFilm" type="button" data-mode="film">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="5" width="14" height="14" rx="2"/>
        <path d="m16 10 6-3v10l-6-3z"/>
      </svg>
      <div class="label">Filmar</div>
    </button>
  </div>
</footer>

<input id="filePicker" type="file" hidden
       accept=".txt,.md,.csv,.json,text/*,audio/*">

<div id="cameraModal" class="camera-modal hidden">
  <div class="camera-card">
    <div class="camera-head">
      <div>
        <strong>Filmar</strong>
        <span>Registro visual para uso operacional / RDO</span>
      </div>
      <button id="btnCloseCamera" class="camera-close">×</button>
    </div>
    <video id="cameraVideo" playsinline muted></video>
    <div class="camera-info" id="cameraInfo">Câmera pronta.</div>
    <div class="camera-actions">
      <button id="btnStartFilm" class="cam-btn primary">● Gravar</button>
      <button id="btnStopFilm" class="cam-btn danger" disabled>■ Parar</button>
    </div>
  </div>
</div>

</div>

<script src="config.js?v=0.8"></script>
<script src="assets/attachment-panel-v081.js?v=0.8.1"></script>
<script src="assets/app.js?v=0.8.1-anexos"></script>
</body>
</html>
