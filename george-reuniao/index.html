<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f7f8">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/styles.css">
<title>George</title>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="orb"></div>
      <div class="brandcopy">
        <strong>GEORGE</strong>
        <span>ASSISTENTE EXECUTIVO • ERP ÍMPAR</span>
      </div>
    </div>
    <button id="btnVoice" class="voice-pill off">🎙 <b>VOZ</b><i></i></button>
  </header>

  <main id="chat" class="chat">
    <div class="msg george">
      <div class="bubble">
        <div class="who">GEORGE</div>
        <div>Bom dia. George à disposição. Em que posso ajudar?</div>
        <div class="tip"><b>•</b> No modo reunião eu acompanho a conversa e só respondo quando me chamarem.</div>
      </div>
    </div>
    <div id="typingAnchor"></div>
  </main>

  <footer class="composer-wrap">
    <div id="meetingStrip" class="meeting-strip">
      <span id="meetingDot"></span>
      <span id="meetingStatus">Modo voz desligado</span>
      <button id="btnFinish" class="finish hidden">Encerrar + ata</button>
    </div>
    <div class="composer">
      <button id="btnMic" class="mic">🎙</button>
      <textarea id="manual" rows="1" placeholder="Fale ou digite para o George"></textarea>
      <button id="btnSend" class="send">↑</button>
    </div>
  </footer>

  <div id="backdrop" class="backdrop hidden"></div>
  <section id="sheet" class="sheet hidden">
    <div class="handle"></div>
    <button id="btnOpening">▶ Apresentar a visão ao Rafael</button>
    <button id="btnPause">⏸ Pausar escuta</button>
    <button id="btnResume">🎙 Retomar escuta</button>
    <button id="btnFinishSheet" class="danger">■ Encerrar reunião + gerar ata</button>
    <button id="btnCloseSheet" class="cancel">Cancelar</button>
  </section>
</div>

<script src="config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
