<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f7f8">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/styles.css">
<title>George</title>

<style>
/* ============================================================
   GEORGE — IDENTIDADE VISUAL V0.1
   Mantém toda a interface e lógica atuais.
   Apenas acrescenta presença visual do George.
============================================================ */

.george-presence{
  display:flex;
  align-items:center;
  gap:14px;
  margin:10px 14px 4px;
  padding:12px 14px;
  border-radius:22px;
  background:
    linear-gradient(135deg,rgba(8,31,48,.96),rgba(15,57,74,.90));
  border:1px solid rgba(82,201,229,.20);
  box-shadow:
    0 18px 42px rgba(4,24,35,.13),
    inset 0 1px 0 rgba(255,255,255,.35);
  overflow:hidden;
  position:relative;
}

.george-presence::after{
  content:"";
  position:absolute;
  inset:auto -45px -65px auto;
  width:150px;
  height:150px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(38,211,176,.13),transparent 70%);
  pointer-events:none;
}

.george-avatar-wrap{
  position:relative;
  flex:0 0 auto;
  width:112px;
  height:112px;
  border-radius:50%;
  display:grid;
  place-items:center;
}

.george-avatar-ring,
.george-avatar-ring::before,
.george-avatar-ring::after{
  position:absolute;
  inset:0;
  border-radius:50%;
  content:"";
  pointer-events:none;
}

.george-avatar-ring{
  background:
    linear-gradient(135deg,#37c9e9,#23d3aa 46%,#6f58ff);
  padding:3px;
  box-shadow:
    0 0 0 5px rgba(41,194,223,.08),
    0 10px 30px rgba(17,106,131,.20);
}

.george-avatar-ring::before{
  inset:-9px;
  border:1px solid rgba(49,199,230,.16);
  opacity:.7;
}

.george-avatar-ring::after{
  inset:-18px;
  border:1px solid rgba(36,211,172,.09);
  opacity:.45;
}

.george-avatar{
  position:relative;
  z-index:2;
  width:106px;
  height:106px;
  object-fit:cover;
  border-radius:50%;
  display:block;
  background:#102e3e;
  transition:
    transform .22s ease,
    filter .22s ease;
}

.george-face-status{
  min-width:0;
  flex:1;
  position:relative;
  z-index:2;
}

.george-face-status strong{
  display:block;
  color:#153f50;
  font-size:20px;
  line-height:1.05;
  letter-spacing:-.02em;
}

.george-face-status span{
  display:block;
  margin-top:5px;
  color:#6c8792;
  font-size:13px;
  font-weight:700;
}

.george-face-status .hello{
  margin-top:9px;
  color:#214b5b;
  font-size:14px;
  line-height:1.34;
  font-weight:650;
}

.george-state-dot{
  display:inline-block;
  width:8px;
  height:8px;
  margin-right:7px;
  border-radius:50%;
  background:#8aa2ac;
  vertical-align:1px;
  box-shadow:0 0 0 4px rgba(138,162,172,.10);
}

/* FALANDO */
.george-presence.talking .george-avatar{
  animation:georgeTalk .62s ease-in-out infinite alternate;
  filter:saturate(1.05) brightness(1.02);
}

.george-presence.talking .george-avatar-ring{
  animation:georgeGlow 1s ease-in-out infinite;
}

.george-presence.talking .george-avatar-ring::before{
  animation:georgeWave 1.15s ease-out infinite;
}

.george-presence.talking .george-avatar-ring::after{
  animation:georgeWave 1.15s .28s ease-out infinite;
}

.george-presence.talking .george-state-dot{
  background:#22c996;
  box-shadow:0 0 0 5px rgba(34,201,150,.13);
}

/* ESCUTANDO */
.george-presence.listening .george-avatar-ring{
  box-shadow:
    0 0 0 5px rgba(42,183,220,.10),
    0 0 24px rgba(42,183,220,.28);
}

.george-presence.listening .george-state-dot{
  background:#35bde7;
  box-shadow:0 0 0 5px rgba(53,189,231,.13);
}

/* ENTENDENDO */
.george-presence.thinking .george-avatar{
  animation:georgeThink 1.3s ease-in-out infinite;
}

.george-presence.thinking .george-state-dot{
  background:#806cf7;
  box-shadow:0 0 0 5px rgba(128,108,247,.13);
}

@keyframes georgeTalk{
  0%{transform:translateY(0) scale(1)}
  100%{transform:translateY(-2px) scale(1.018)}
}

@keyframes georgeThink{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.012)}
}

@keyframes georgeGlow{
  0%,100%{
    box-shadow:
      0 0 0 5px rgba(41,194,223,.08),
      0 10px 30px rgba(17,106,131,.20)
  }
  50%{
    box-shadow:
      0 0 0 7px rgba(36,211,172,.12),
      0 0 34px rgba(36,211,172,.32)
  }
}

@keyframes georgeWave{
  0%{transform:scale(.96);opacity:.55}
  100%{transform:scale(1.25);opacity:0}
}

@media(max-width:560px){
  .george-presence{
    margin:8px 10px 2px;
    padding:10px 11px;
    gap:11px;
    border-radius:19px;
  }

  .george-avatar-wrap{
    width:88px;
    height:88px;
  }

  .george-avatar{
    width:82px;
    height:82px;
  }

  .george-face-status strong{
    font-size:18px;
  }

  .george-face-status span{
    font-size:12px;
  }

  .george-face-status .hello{
    font-size:13px;
  }
}

@media(max-height:700px) and (max-width:560px){
  .george-presence{
    padding:7px 9px;
  }

  .george-avatar-wrap{
    width:72px;
    height:72px;
  }

  .george-avatar{
    width:66px;
    height:66px;
  }

  .george-face-status .hello{
    display:none;
  }
}
</style>
</head>

<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="orb"></div>
      <div class="brandcopy">
        <strong>GEORGE</strong>
        <span>ASSISTENTE EXECUTIVO • ERP ÍMPAR</span>
      </div>
    </div>
    <button id="btnVoice" class="voice-pill off">🎙 <b>VOZ</b><i></i></button>
  </header>

  <!-- ÚNICA ADIÇÃO VISUAL -->
  <section id="georgePresence" class="george-presence" aria-label="George">
    <div class="george-avatar-wrap">
      <div class="george-avatar-ring"></div>
      <img
        id="georgeAvatar"
        class="george-avatar"
        src="assets/george_avatar_v01.png"
        alt="George, assistente do ERP ÍMPAR"
      >
    </div>

    <div class="george-face-status">
      <strong>George</strong>
      <span>
        <i class="george-state-dot"></i>
        <b id="georgeVisualState">À disposição</b>
      </span>
      <div class="hello">
        Oi! Eu sou o George.<br>
        Como posso te ajudar hoje?
      </div>
    </div>
  </section>

  <main id="chat" class="chat">
    <div class="msg george">
      <div class="bubble">
        <div class="who">GEORGE</div>
        <div>Oi! Eu sou o George. Como posso te ajudar hoje?</div>
      </div>
    </div>
    <div id="typingAnchor"></div>
  </main>

  <footer class="composer-wrap">
    <div id="meetingStrip" class="meeting-strip">
      <span id="meetingDot"></span>
      <span id="meetingStatus">Modo voz desligado</span>
      <button id="btnFinish" class="finish hidden">Encerrar + ata</button>
    </div>

    <div class="composer">
      <button id="btnMic" class="mic">🎙</button>
      <textarea
        id="manual"
        rows="1"
        placeholder="Fale ou digite para o George"
      ></textarea>
      <button id="btnSend" class="send">↑</button>
    </div>
  </footer>

  <div id="backdrop" class="backdrop hidden"></div>

  <section id="sheet" class="sheet hidden">
    <div class="handle"></div>
    <button id="btnOpening">▶ Apresentar a visão ao Rafael</button>
    <button id="btnPause">⏸ Pausar escuta</button>
    <button id="btnResume">🎙 Retomar escuta</button>
    <button id="btnFinishSheet" class="danger">■ Encerrar reunião + gerar ata</button>
    <button id="btnCloseSheet" class="cancel">Cancelar</button>
  </section>

</div>

<script src="config.js"></script>
<script src="assets/app.js"></script>

<script>
/* ============================================================
   GEORGE — ANIMAÇÃO VISUAL
   Não altera o motor de voz nem a inteligência.
   Apenas observa o status que o app atual já produz.
============================================================ */
(() => {
  const presence = document.getElementById("georgePresence");
  const visualState = document.getElementById("georgeVisualState");
  const status = document.getElementById("meetingStatus");

  if (!presence || !visualState || !status) return;

  const clearStates = () => {
    presence.classList.remove("talking","listening","thinking");
  };

  const syncVisualState = () => {
    const txt = String(status.textContent || "").toLowerCase();

    clearStates();

    if (txt.includes("george está falando")) {
      presence.classList.add("talking");
      visualState.textContent = "Falando com você";
      return;
    }

    if (txt.includes("escutando")) {
      presence.classList.add("listening");
      visualState.textContent = "Estou ouvindo";
      return;
    }

    if (txt.includes("entendendo")) {
      presence.classList.add("thinking");
      visualState.textContent = "Entendendo";
      return;
    }

    if (txt.includes("reunião ativo") || txt.includes("modo reunião ativo")) {
      presence.classList.add("listening");
      visualState.textContent = "Estou ouvindo";
      return;
    }

    if (txt.includes("microfone pausado")) {
      visualState.textContent = "Microfone pausado";
      return;
    }

    if (txt.includes("desligado")) {
      visualState.textContent = "À disposição";
      return;
    }

    visualState.textContent = "À disposição";
  };

  new MutationObserver(syncVisualState).observe(
    status,
    {childList:true,subtree:true,characterData:true}
  );

  syncVisualState();
})();
</script>

</body>
</html>
