<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f7f8"><meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/styles.css"><title>George — Agenda V2</title>
<style>
.topbar{min-height:64px!important;padding:8px 12px!important}.topbar .brandcopy strong{font-size:17px!important}.topbar .brandcopy span{font-size:9px!important}.chat{padding:12px 9px 24px!important}.msg{display:flex!important;align-items:flex-end!important;gap:7px!important;margin:9px 0!important}.msg.george{justify-content:flex-start!important;flex-direction:row!important}.msg.me{justify-content:flex-start!important;flex-direction:row-reverse!important}.msg-avatar{width:34px;height:34px;min-width:34px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:10px;font-weight:900;border:2px solid #fff;box-shadow:0 4px 12px rgba(18,63,78,.14)}.msg-avatar.george{background:#173b4b}.msg-avatar.me{background:linear-gradient(135deg,#2a6fd3,#5d55e9);color:#fff}.msg-avatar img{width:100%;height:100%;object-fit:cover}.msg .bubble{max-width:82%!important;margin:0!important;border-radius:16px!important;padding:10px 12px!important}.msg.george .bubble{border-bottom-left-radius:5px!important}.msg.me .bubble{border-bottom-right-radius:5px!important}.msg-avatar.george.speaking{animation:pulse .6s ease-in-out infinite alternate;box-shadow:0 0 0 4px rgba(39,199,224,.12),0 0 18px rgba(39,199,224,.28)}@keyframes pulse{to{transform:scale(1.08)}}
</style></head><body><div class="app">
<header class="topbar"><div class="brand"><div class="orb"></div><div class="brandcopy"><strong>ERP ÍMPAR</strong><span>GEORGE • ASSISTENTE</span></div></div><button id="btnVoice" class="voice-pill off">🎙 <b>VOZ</b><i></i></button></header>
<main id="chat" class="chat"><div class="msg george"><div class="bubble"><div class="who">GEORGE</div><div>Oi! Eu sou o George. Como posso te ajudar hoje?</div></div></div><div id="typingAnchor"></div></main>
<footer class="composer-wrap"><div id="meetingStrip" class="meeting-strip"><span id="meetingDot"></span><span id="meetingStatus">Modo voz desligado</span><button id="btnFinish" class="finish hidden">Encerrar + ata</button></div><div class="composer"><button id="btnMic" class="mic">🎙</button><textarea id="manual" rows="1" placeholder="Fale ou digite para o George"></textarea><button id="btnSend" class="send">↑</button></div></footer>
<div id="backdrop" class="backdrop hidden"></div><section id="sheet" class="sheet hidden"><div class="handle"></div><button id="btnOpening">▶ Apresentar a visão ao Rafael</button><button id="btnPause">⏸ Pausar escuta</button><button id="btnResume">🎙 Retomar escuta</button><button id="btnFinishSheet" class="danger">■ Encerrar reunião + gerar ata</button><button id="btnCloseSheet" class="cancel">Cancelar</button></section>
</div><script src="config.js"></script><script src="assets/app.js"></script><script src="assets/george_agenda_tools_v01.js"></script>
<script>(()=>{const KEY='ERPIMPAR_USER';const AV='assets/george_avatar_v01.png';function u(){try{return JSON.parse(localStorage.getItem(KEY)||sessionStorage.getItem(KEY)||'null')||{}}catch(e){return{}}}function ini(){const n=String(u().nome||u().Nome||'GE').trim().split(/\s+/)[0]||'GE';return n.slice(0,2).toUpperCase()}function photo(){const r=String(u().foto||u().Foto||'').trim();if(!r)return'';return /^https?:\/\//i.test(r)?r:(r.startsWith('/')?'https://www.erpimpar.com.br'+r:'https://www.erpimpar.com.br/'+r)}function avGeorge(){const a=document.createElement('div');a.className='msg-avatar george';const i=document.createElement('img');i.src=AV;i.alt='George';a.appendChild(i);return a}function avMe(){const a=document.createElement('div');a.className='msg-avatar me';const p=photo();if(p){const i=document.createElement('img');i.src=p;i.onerror=()=>{a.innerHTML='';a.textContent=ini()};a.appendChild(i)}else a.textContent=ini();return a}function deco(m){if(!m||m.dataset.av==='1')return;const b=m.querySelector('.bubble');if(!b)return;m.insertBefore(m.classList.contains('me')?avMe():avGeorge(),b);m.dataset.av='1'}function all(){document.querySelectorAll('#chat .msg').forEach(deco)}function speak(){document.querySelectorAll('.msg-avatar.george.speaking').forEach(x=>x.classList.remove('speaking'));const t=String(document.getElementById('meetingStatus')?.textContent||'').toLowerCase();if(t.includes('george está falando')){const a=document.querySelectorAll('#chat .msg.george .msg-avatar.george');if(a.length)a[a.length-1].classList.add('speaking')}}const c=document.getElementById('chat');if(c)new MutationObserver(()=>{all();speak()}).observe(c,{childList:true,subtree:true});const s=document.getElementById('meetingStatus');if(s)new MutationObserver(speak).observe(s,{childList:true,subtree:true,characterData:true});all();speak()})();</script>
</body></html>
