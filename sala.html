<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f74"><title>Central de Obras George V2 | RDO</title>
<style>
:root{--azul:#123f74;--azul2:#075f67;--verde:#22c55e;--verde2:#16a34a;--bg:#eef5fb;--card:#fff;--text:#102033;--muted:#607086;--borda:rgba(15,47,87,.14);--shadow:0 16px 38px rgba(15,47,87,.12)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(145deg,#eaf4fb,#f7fbff);color:var(--text)}.topbar{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;padding:12px 14px}.topbar-inner{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid rgba(255,255,255,.14);border-radius:0 0 18px 18px;padding:10px 14px}.brand{display:flex;align-items:center;gap:12px}.orb{width:44px;height:44px;border-radius:14px;background:conic-gradient(from 210deg,#22c55e,#06b6d4,#3b82f6,#a855f7,#f97316,#22c55e)}.eyebrow{font-size:9px;letter-spacing:.2em;color:#b8ff4f;font-weight:1000}.brand h1{font-size:18px;margin:2px 0}.brand p{font-size:11px;margin:0;opacity:.8}.back{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:9px 12px;font-weight:900;cursor:pointer}
main{max-width:980px;margin:auto;padding:18px 14px 70px}.review{display:inline-flex;background:#fff7da;color:#8a5b00;border:1px solid #f3d46d;border-radius:999px;padding:7px 11px;font-size:10px;font-weight:900;margin-bottom:12px}.summary{background:#fff;border:1px solid var(--borda);border-radius:20px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}.summary h2{margin:0 0 10px;font-size:20px}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mini{background:#f6f9fc;border:1px solid var(--borda);border-radius:13px;padding:9px}.mini span{display:block;font-size:10px;color:var(--muted)}.mini b{font-size:14px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.tab{border:1px solid var(--borda);background:#fff;color:var(--azul);border-radius:14px;padding:12px;font-weight:1000;cursor:pointer}.tab.on{background:linear-gradient(135deg,var(--verde),var(--verde2));color:#fff;border-color:transparent}.panel{display:none}.panel.on{display:block}.card{background:#fff;border:1px solid var(--borda);border-radius:20px;padding:14px;box-shadow:var(--shadow)}.item{background:#f8fbfe;border:1px solid var(--borda);border-radius:16px;padding:12px;margin-bottom:10px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chip{border-radius:999px;padding:4px 8px;background:#edf4ff;color:#16437a;font-size:9px;font-weight:900}.item h3{font-size:13px;margin:0 0 5px}.item p{font-size:13px;line-height:1.45;margin:0;color:#344357}.item small{display:block;color:var(--muted);font-size:10px;margin-top:7px}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photo{background:#f8fbfe;border:1px solid var(--borda);border-radius:16px;padding:9px}.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#dde8ef}.photo b{display:block;font-size:12px;margin-top:8px}.photo small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.empty{text-align:center;padding:22px;color:var(--muted)}@media(max-width:650px){.mini-grid{grid-template-columns:1fr 1fr}.photos{grid-template-columns:1fr}.topbar-inner{align-items:flex-start}.brand p{display:none}}
</style></head><body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><div class="orb"></div><div><div class="eyebrow">PLATAFORMA ERP ÍMPAR</div><h1>Central de Obras George V2</h1><p>RDO • Mensagens e fotos</p></div></div><button class="back" onclick="location.href='index.html'">← Voltar</button></div></header>
<main><div class="review">● AMBIENTE DE DEMONSTRAÇÃO • APP REVIEW</div><section class="summary"><h2 id="obraTitulo">RDO</h2><div class="mini-grid"><div class="mini"><span>Coordenador</span><b id="coord">COORDENADOR TESTE</b></div><div class="mini"><span>Status</span><b id="status">EM ANDAMENTO</b></div><div class="mini"><span>Origem</span><b>WhatsApp Business</b></div></div></section><div class="tabs"><button class="tab on" data-tab="mensagens">Mensagens</button><button class="tab" data-tab="fotos">Fotos</button></div><section id="mensagens" class="panel on"><div class="card"><div id="listaMensagens"></div></div></section><section id="fotos" class="panel"><div class="card"><div id="listaFotos" class="photos"></div></div></section></main>
<script src="config.js"></script><script>
const obra=new URLSearchParams(location.search).get('obra')||'OBRA DEMONSTRAÇÃO META 01';document.getElementById('obraTitulo').textContent='RDO • '+obra;
const fallback=[
 {tipo:'mensagem',autor:'USUÁRIO DE CAMPO • TESTE',origem:'WhatsApp',texto:'Iniciamos a montagem da rede frigorígena no pavimento térreo. Serviço seguindo o planejamento.',data:'2026-08-30T13:20:00-03:00'},
 {tipo:'mensagem',autor:'COORDENADOR TESTE',origem:'WhatsApp',texto:'Recebido. Registrar no RDO e manter acompanhamento da execução.',data:'2026-08-30T13:24:00-03:00'},
 {tipo:'foto',autor:'USUÁRIO DE CAMPO • TESTE',origem:'WhatsApp',texto:'Foto de demonstração recebida via WhatsApp e vinculada ao RDO.',arquivo:'assets/foto-demonstracao.svg',data:'2026-08-30T13:27:00-03:00'}
];
const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]));
function render(items){const msgs=items.filter(x=>x.tipo==='mensagem');const fotos=items.filter(x=>x.tipo==='foto');document.getElementById('listaMensagens').innerHTML=msgs.length?msgs.map(i=>`<div class="item"><div class="chips"><span class="chip">💬 MENSAGEM</span><span class="chip">${esc(i.origem||'WhatsApp')}</span></div><h3>${esc(i.autor)}</h3><p>${esc(i.texto)}</p><small>${new Date(i.data).toLocaleString('pt-BR')}</small></div>`).join(''):'<div class="empty">Nenhuma mensagem.</div>';document.getElementById('listaFotos').innerHTML=fotos.length?fotos.map(i=>`<div class="photo"><img src="${esc(i.arquivo||'assets/foto-demonstracao.svg')}" alt="Foto de demonstração"><b>${esc(i.texto||'Foto recebida via WhatsApp')}</b><small>${esc(i.autor)} • ${new Date(i.data).toLocaleString('pt-BR')}</small></div>`).join(''):'<div class="empty">Nenhuma foto.</div>'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id===b.dataset.tab))});
(async()=>{try{const u=window.CENTRAL_OBRAS_REVIEW.apiBase+'?action=timeline&obra='+encodeURIComponent(obra);const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();render(j.items||j.data||fallback);if(j.obra){document.getElementById('coord').textContent=j.obra.coordenador||'COORDENADOR TESTE';document.getElementById('status').textContent=(j.obra.status||'EM ANDAMENTO').toUpperCase()}}catch(e){render(fallback)}})();
</script></body></html>
