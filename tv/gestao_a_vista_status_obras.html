<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>ERP ÍMPAR • Status das Obras TV</title><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#eef6ff;background:linear-gradient(120deg,#0b1e4a,#0e3b6e,#0f766e);padding:12px}.head{height:84px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:12px}.orb{width:54px;height:54px;border-radius:18px;background:conic-gradient(from 210deg,#22d3ee,#7c3aed,#fb7185,#facc15,#22c55e,#22d3ee)}h1{font-size:30px;line-height:1;font-weight:1000}.sub{font-weight:850;color:#cbd5e1}.pill{background:rgba(2,8,23,.55);border:1px solid rgba(34,197,94,.35);border-radius:999px;padding:10px 16px;font-weight:950;color:#bbf7d0}.grid{height:calc(100vh - 102px);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:10px}.card{position:relative;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(2,8,23,.62);box-shadow:inset 4px 0 0 #22c55e;padding:18px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.card.yellow{box-shadow:inset 4px 0 0 #facc15}.card.red{box-shadow:inset 4px 0 0 #ef4444}.title{font-size:22px;font-weight:1000;text-transform:uppercase;line-height:1.05}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:rgba(2,8,23,.42);border:1px solid rgba(255,255,255,.10);border-radius:10px;padding:8px}.box span{display:block;color:#a9bad0;font-size:10px;text-transform:uppercase;font-weight:950}.box b{font-size:13px}.status{font-size:28px;font-weight:1000;color:#22c55e;margin-top:auto}.txt{font-size:20px;line-height:1.22;font-weight:900;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.dot{position:absolute;top:18px;right:18px;width:22px;height:22px;border-radius:50%;background:#22c55e;box-shadow:0 0 22px #22c55e}.yellow .dot{background:#facc15;box-shadow:0 0 22px #facc15}.red .dot{background:#ef4444;box-shadow:0 0 22px #ef4444}.foot{display:flex;justify-content:space-between;color:#78f0a5;font-size:11px;font-weight:900;margin-top:auto}
/* PREMIUM TV — efeitos visuais */
body{animation:tvEnter .8s cubic-bezier(.16,1,.3,1) both;}
@keyframes tvEnter{from{opacity:0;transform:translateY(24px) scale(.985);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.card,.kpi,.obra-card,.status-card,.person-card,[class*="card"],[class*="Card"]{transition:transform .3s ease, box-shadow .3s ease!important;}
.card:hover,.kpi:hover,.obra-card:hover,.status-card:hover,.person-card:hover{transform:translateY(-3px) scale(1.01)!important;}
.warn,.warning,.yellow,[class*="warn"],[class*="yellow"]{animation:tvPulseYellow 2.4s ease-in-out infinite!important;}
.bad,.red,.danger,.atrasado,.pendente,[class*="bad"],[class*="red"],[class*="late"]{animation:tvPulseRed 2.2s ease-in-out infinite!important;}
@keyframes tvPulseRed{0%,100%{box-shadow:0 12px 28px rgba(0,0,0,.22),0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 18px 44px rgba(0,0,0,.32),0 0 24px rgba(239,68,68,.34)}}
@keyframes tvPulseYellow{0%,100%{box-shadow:0 12px 28px rgba(0,0,0,.22),0 0 0 rgba(250,204,21,0)}50%{box-shadow:0 18px 44px rgba(0,0,0,.32),0 0 24px rgba(250,204,21,.30)}}
</style></head><body><section class="head"><div class="brand"><div class="orb"></div><div><h1>ERP ÍMPAR<br><span style="font-size:20px">Gestão à Vista</span></h1><div class="sub">Status das obras • fonte TV oficial</div></div></div><div class="pill" id="fuel">⛽ Combustível mês: —</div></section><main class="grid" id="grid"></main><script>
const API='https://api.erpimpar.com.br/';
function n(v){return String(v??'').trim()} function money(v){return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function val(x){if(typeof x==='number')return x;let s=String(x??'').replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');let y=Number(s);return Number.isFinite(y)?y:0}
function month(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
async function loadFuel(){try{let r=await fetch(API+'rh/combustivel/data/combustivel.json?t='+Date.now(),{cache:'no-store'});let j=await r.json();let arr=[];for(const k of ['lancamentos','data','dados','registros','items']) if(Array.isArray(j?.[k])) arr=j[k]; if(Array.isArray(j)) arr=j; const m=month();let total=arr.filter(x=>String(x.data||x.date||x.dia||'').slice(0,7)===m).reduce((a,x)=>a+val(x.valor??x.value??x.total),0);document.getElementById('fuel').textContent='⛽ Combustível mês: '+money(total)}catch(e){document.getElementById('fuel').textContent='⛽ Combustível mês: indisponível'}}
function age(d){let dt=new Date(d);if(isNaN(dt))return 999;return Math.floor((Date.now()-dt.getTime())/86400000)}
async function load(){await loadFuel();let lista=[];try{let r=await fetch(API+'tv/listar.php?t='+Date.now(),{cache:'no-store'});let j=await r.json();lista=j?.data?.projetos||j?.projetos||j?.data||[];}catch(e){}lista=Array.isArray(lista)?lista:[];lista.sort((a,b)=>age(a.data_atualizacao||a.atualizado_em)-age(b.data_atualizacao||b.atualizado_em));lista=lista.slice(0,6);grid.innerHTML=lista.map(p=>{let dias=age(p.data_atualizacao||p.atualizado_em);let cls=dias>7?'red':(String(p.farol||p.status||'').toLowerCase().includes('amarel')?'yellow':'');return `<article class="card ${cls}"><div class="dot"></div><div class="title">${n(p.nome||p.obra)}</div><div class="meta"><div class="box"><span>Coordenador</span><b>${n(p.coordenador||'—')}</b></div><div class="box"><span>Execução</span><b>${n(p.execucao||p.tipo_execucao||'—')}</b></div></div><div class="status">📊 STATUS ATUAL</div><div class="txt">${n(p.status||p.resumo||p.descricao||'Sem status informado.')}</div><div class="foot"><span>há ${dias===999?'—':dias} dia(s)</span><span>${n(p.usuario_atualizacao||p.usuario||'')}</span></div></article>`}).join('')||'<div class="pill">Nenhum projeto encontrado.</div>';}
load();setInterval(load,60000);try{window.parent.postMessage({type:'ERP_IMPAR_TV_BADGE',text:'📺 Gestão à Vista • Status das Obras'},'*')}catch(e){}
</script></body></html>
