<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ERP ÍMPAR • TV Gestão Viva</title>
<style>
:root{
  --bg:#031416; --deep:#061b22; --card:rgba(2,18,26,.72); --line:rgba(134,255,189,.20);
  --green:#62ff91; --lime:#a7ff39; --cyan:#39d8ff; --yellow:#ffd84d; --red:#ff5263;
  --txt:#f4fbff; --muted:rgba(244,251,255,.74); --shadow:0 28px 80px rgba(0,0,0,.42);
}
*{box-sizing:border-box;margin:0;padding:0} html,body{width:100%;height:100%;overflow:hidden;background:#02080c;color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{background:radial-gradient(circle at 78% 22%,rgba(98,255,145,.20),transparent 28%),radial-gradient(circle at 12% 80%,rgba(57,216,255,.12),transparent 32%),linear-gradient(125deg,#020912,#052e34 55%,#063f32)}
.stage{position:fixed;inset:0;overflow:hidden}.slide{position:absolute;inset:0;padding:42px 54px;display:grid;opacity:0;pointer-events:none;transform:scale(1.04);filter:blur(12px);transition:opacity .9s ease,transform .9s cubic-bezier(.16,1,.3,1),filter .9s ease}.slide.active{opacity:1;pointer-events:auto;transform:scale(1);filter:blur(0)}
.slide.from-right{transform:translateX(80px) scale(.99)}.slide.from-left{transform:translateX(-80px) scale(.99)}.slide.from-top{transform:translateY(-80px) scale(.99)}.slide.zoom{transform:scale(.92)}.slide.active.from-right,.slide.active.from-left,.slide.active.from-top,.slide.active.zoom{transform:translate(0,0) scale(1)}
.grid-bg{position:absolute;inset:0;opacity:.20;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(circle at 55% 45%,#000 0 45%,transparent 78%)}
.orb{width:76px;height:76px;border-radius:24px;background:conic-gradient(from 210deg,#22c55e,#06b6d4,#3b82f6,#a855f7,#fb923c,#22c55e);box-shadow:0 0 38px rgba(98,255,145,.30),inset 0 0 18px rgba(255,255,255,.22);position:relative;overflow:hidden;animation:float 5s ease-in-out infinite}.orb:after{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.7),transparent 40%)}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,216,77,.25),0 24px 70px rgba(0,0,0,.38)}50%{box-shadow:0 0 0 12px rgba(255,216,77,0),0 24px 70px rgba(0,0,0,.38)}}
@keyframes grow{from{width:0}to{width:var(--w)}}
.header{position:relative;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:30px}.brand{display:flex;gap:18px;align-items:center}.kicker{font-size:13px;letter-spacing:.34em;color:var(--green);font-weight:1000;text-transform:uppercase}.title{font-size:52px;line-height:.96;font-weight:1000;letter-spacing:-.05em;text-shadow:0 10px 32px rgba(0,0,0,.45)}.subtitle{font-size:18px;margin-top:10px;color:var(--muted);font-weight:850}.clock{text-align:right;font-weight:1000}.clock .date{font-size:18px;color:var(--lime)}.clock .time{font-size:46px;line-height:1;margin-top:6px}.content{position:relative;z-index:2;align-self:center}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:54px;align-items:center}.headline{font-size:76px;line-height:.94;font-weight:1000;letter-spacing:-.06em;max-width:820px}.headline span{color:var(--green)}.copy{font-size:22px;line-height:1.45;color:var(--muted);margin-top:24px;max-width:750px;font-weight:700}.pill-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}.pill{border:1px solid rgba(134,255,189,.24);background:rgba(5,30,38,.72);border-radius:999px;padding:12px 18px;font-size:14px;font-weight:950;color:#eafff1;box-shadow:inset 0 0 20px rgba(98,255,145,.04)}
.glass{border:1px solid var(--line);background:linear-gradient(135deg,rgba(4,24,34,.84),rgba(10,74,63,.46));border-radius:32px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}.visual-card{min-height:470px;padding:24px;display:grid;place-items:center;position:relative;overflow:hidden}.visual-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 30%,rgba(98,255,145,.28),transparent 25%)}
.phone-img{height:72vh;max-height:760px;border-radius:16px;object-fit:cover;box-shadow:0 32px 80px rgba(0,0,0,.55);animation:phoneIn 1.2s cubic-bezier(.16,1,.3,1) both}.active .phone-img{animation:phoneIn 1.2s cubic-bezier(.16,1,.3,1) both}@keyframes phoneIn{0%{transform:translateX(120px) rotate(3deg) scale(.95);opacity:0;filter:blur(8px)}100%{transform:translateX(0) rotate(0) scale(1);opacity:1;filter:blur(0)}}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:30px}.metric{padding:24px;border-radius:26px;background:rgba(2,16,25,.70);border:1px solid rgba(255,255,255,.10);box-shadow:0 20px 55px rgba(0,0,0,.24)}.metric small{display:block;font-size:13px;color:#b9c9d6;letter-spacing:.14em;text-transform:uppercase;font-weight:1000}.metric b{display:block;font-size:50px;line-height:1;margin-top:14px}.metric.green b{color:var(--green)}.metric.yellow{border-color:rgba(255,216,77,.26);animation:pulse 2.8s ease-in-out infinite}.metric.yellow b{color:var(--yellow)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.data-card{min-height:240px;padding:24px;border-radius:28px;background:linear-gradient(135deg,rgba(3,17,28,.86),rgba(6,67,62,.58));border:1px solid rgba(255,255,255,.10);box-shadow:0 22px 70px rgba(0,0,0,.30);position:relative;overflow:hidden}.data-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--green)}.data-card.warn:before{background:var(--yellow)}.data-card.danger:before{background:var(--red)}.tag{display:inline-flex;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:1000;color:#eafff1;background:rgba(1,8,14,.38)}.data-card h3{font-size:28px;line-height:1.08;margin:22px 0 12px;text-transform:uppercase}.data-card p{font-size:17px;line-height:1.35;color:var(--muted);font-weight:800}.progress{height:12px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden;margin-top:18px}.progress span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--lime));--w:70%;animation:grow 1.4s ease both}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px}.coord{padding:28px;border-radius:34px;background:linear-gradient(145deg,rgba(5,23,35,.86),rgba(4,65,56,.58));border:1px solid rgba(98,255,145,.20);box-shadow:var(--shadow)}.avatar{width:92px;height:92px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:28px;font-weight:1000;background:rgba(255,255,255,.08)}.coord h3{font-size:38px;margin-top:18px}.score{font-size:72px;color:var(--green);font-weight:1000;line-height:1;margin:18px 0}.mini-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.mini-kpis span{padding:10px 6px;border-radius:999px;background:rgba(98,255,145,.11);border:1px solid rgba(98,255,145,.24);text-align:center;font-size:12px;font-weight:1000}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:30px}.person{min-height:230px;padding:24px;border-radius:30px;background:linear-gradient(140deg,rgba(3,18,28,.86),rgba(5,55,54,.56));border:1px solid rgba(57,216,255,.22);box-shadow:var(--shadow)}.person h3{font-size:34px}.person .place{font-size:22px;margin-top:22px;color:#fff;font-weight:1000}.person .act{font-size:16px;color:var(--muted);margin-top:8px;font-weight:800}.person .badge{margin-top:18px;display:inline-flex;background:rgba(98,255,145,.12);color:#baffca;border:1px solid rgba(98,255,145,.26);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:1000}
.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:36px}.day{padding:20px;border-radius:26px;background:rgba(2,18,29,.70);border:1px solid rgba(255,255,255,.10);min-height:330px}.day h3{font-size:24px;color:var(--lime);margin-bottom:18px}.alloc{padding:14px;border-radius:18px;background:rgba(98,255,145,.10);border:1px solid rgba(98,255,145,.23);margin-bottom:12px}.alloc b{display:block;font-size:16px}.alloc span{display:block;font-size:14px;color:var(--muted);margin-top:6px}.footer{position:absolute;left:54px;right:54px;bottom:32px;z-index:4;display:flex;align-items:center;justify-content:space-between;color:rgba(244,251,255,.76);font-weight:900}.dots{display:flex;gap:10px}.dots i{display:block;width:46px;height:5px;border-radius:99px;background:rgba(255,255,255,.35)}.dots i.on{background:var(--green);box-shadow:0 0 18px rgba(98,255,145,.45)}
.big-watermark{position:absolute;right:-80px;bottom:-80px;font-size:240px;font-weight:1000;line-height:.8;color:rgba(255,255,255,.035);letter-spacing:-.08em}.feature-list{display:grid;gap:12px;margin-top:28px}.feature-list div{padding:15px 18px;border-radius:16px;border:1px solid rgba(255,255,255,.10);background:rgba(2,17,25,.58);font-weight:950;font-size:17px}.split{display:grid;grid-template-columns:1fr .72fr;gap:36px;align-items:center}.tech-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:36px}.tech{padding:22px;border-radius:22px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.06);text-align:center}.tech b{font-size:44px;display:block}.tech span{font-size:14px;color:var(--muted);font-weight:900}.hidden{display:none!important}
@media(max-width:1100px){.headline{font-size:54px}.title{font-size:40px}.hero,.split{grid-template-columns:1fr}.cards,.kpi-grid,.people,.metrics{grid-template-columns:1fr 1fr}.timeline{grid-template-columns:1fr 1fr}.phone-img{height:55vh}}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const API='https://api.erpimpar.com.br/tv/tv_dados_brutos.php';
const marketingImgs=['01_material.png','02_inventario.png','03_planejamento.png','04_gestao.png','05_contratos.png','06_kpi.png'];
const slidesMeta=[
 ['abertura','from-right'],['status','from-left'],['material','zoom'],['farol','from-top'],['kpi','from-right'],['tech','from-left'],['onde','zoom'],['agenda','from-top'],['contratos','from-right'],['fechamento','zoom']
];
let dados={},idx=0,timer=null;
function fmtPct(v){v=Number(v||0);return (Math.round(v*10)/10).toLocaleString('pt-BR')+'%'}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function nowDate(){return new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
function nowTime(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function header(k,t,sub){return `<div class="grid-bg"></div><div class="header"><div class="brand"><div class="orb"></div><div><div class="kicker">${k}</div><div class="title">${t}</div><div class="subtitle">${sub}</div></div></div><div class="clock"><div class="date" id="d_${Math.random()}">${nowDate()}</div><div class="time clockLive">${nowTime()}</div></div></div>`}
function footer(n,total){return `<div class="footer"><div>ERP ÍMPAR • Gestão inteligente em tempo real</div><div class="dots">${Array.from({length:total},(_,i)=>`<i class="${i===n?'on':''}"></i>`).join('')}</div><div>${n+1}/${total}</div></div>`}
function ativos(){return dados?.farol?.items||dados?.farol?.data||dados?.farol||[]}
function tvItems(){return dados?.ultimo_status_atual_tv_obras_ativas?.items||dados?.tv_status?.items||[]}
function kpis(){return dados?.kpis_coordenadores?.coordenadores||dados?.kpis_coordenadores?.resumo_coordenadores||dados?.kpis_coordenadores?.items||[]}
function atividade(){return dados?.atividade_dia?.atividades||dados?.atividade_dia?.data?.atividades||[]}
function agenda(){return dados?.agenda_semanal?.atividades||dados?.agenda_semanal?.data?.atividades||dados?.agenda_semanal?.alocacoes||[]}
function slideAbertura(n,total){return `<section class="slide from-right">${header('ERP ÍMPAR','Centro Integrado de Gestão','Do orçamento à entrega, tudo conectado.')}<div class="content hero"><div><div class="headline">Uma plataforma viva para <span>controlar obras em tempo real.</span></div><p class="copy">Cronograma, agenda, atividade diária, gestão à vista, KPIs, materiais, documentos e RDO conectados numa única operação.</p><div class="metrics"><div class="metric green"><small>Obras ativas</small><b>${ativos().length||0}</b></div><div class="metric"><small>Frentes na TV</small><b>${tvItems().length||0}</b></div><div class="metric"><small>Rotinas integradas</small><b>12</b></div><div class="metric yellow"><small>Base técnica</small><b>388K</b></div></div></div><div class="visual-card glass"><div class="big-watermark">ERP</div><div class="headline" style="font-size:62px;text-align:center">Operação<br><span>conectada</span></div></div></div>${footer(n,total)}</section>`}
function slideStatus(n,total){const list=(tvItems().length?tvItems():ativos()).slice(0,6);return `<section class="slide from-left">${header('Gestão à Vista','Status das Obras','Último status digitado pelos coordenadores • dados reais da TV')}<div class="content"><div class="metrics"><div class="metric green"><small>Obras ativas</small><b>${ativos().length||0}</b></div><div class="metric"><small>Status localizados</small><b>${tvItems().length||0}</b></div><div class="metric yellow"><small>Acompanhar</small><b>${Math.max((ativos().length||0)-(tvItems().length||0),0)}</b></div><div class="metric"><small>Fonte</small><b>TV</b></div></div><div class="cards">${list.map(x=>`<div class="data-card ${String(x.farol||x.status||'').toLowerCase().includes('vermel')?'danger':String(x.farol||x.status||'').toLowerCase().includes('amarel')?'warn':''}"><span class="tag">${esc(x.coordenador||x.responsavel||'Coordenação')}</span><h3>${esc(x.nome||x.obra||'Obra')}</h3><p>${esc(x.status_atual||x.status||x.ultimo_status||x.resumo||'Sem status informado na TV.')}</p><div class="progress"><span style="--w:${Math.min(100,Number(x.percentual_realizado||x.real||0))||45}%"></span></div></div>`).join('')}</div></div>${footer(n,total)}</section>`}
function slideMarketing(n,total,img,tit,sub,items){return `<section class="slide zoom">${header('ERP ÍMPAR',tit,sub)}<div class="content split"><div><div class="headline" style="font-size:64px">${tit}<br><span>em evolução.</span></div><div class="feature-list">${items.map(i=>`<div>${i}</div>`).join('')}</div></div><div style="display:grid;place-items:center"><img class="phone-img" src="assets/${img}"/></div></div>${footer(n,total)}</section>`}
function slideFarol(n,total){const list=ativos().slice(0,6);return `<section class="slide from-top">${header('Farol Operacional','Cronogramas e avanço físico','Percentuais, status e sinalização visual das obras ativas')}<div class="content"><div class="cards">${list.map(x=>{let real=Number(x.real??x.percentual_realizado??x.realizado??0),prev=Number(x.previsto??x.percentual_previsto??0);return `<div class="data-card ${real+2<prev?'danger':real<prev?'warn':''}"><span class="tag">OBRA ${esc(x.id||'')}</span><h3>${esc(x.nome||x.obra||'Obra')}</h3><p>Previsto ${fmtPct(prev)} • Realizado ${fmtPct(real)}</p><div class="progress"><span style="--w:${Math.max(4,Math.min(100,real))}%"></span></div><p style="margin-top:12px">${esc(x.status||x.status_cronograma||'Em acompanhamento')}</p></div>`}).join('')}</div></div>${footer(n,total)}</section>`}
function slideKpi(n,total){let list=kpis(); if(!Array.isArray(list)||!list.length) list=[{nome:'Pablo',score:90},{nome:'Fabio',score:90},{nome:'Nicolas',score:82}]; return `<section class="slide from-right">${header('Performance','KPIs dos Coordenadores','Score ponderado com leitura executiva para TV')}<div class="content"><div class="kpi-grid">${list.slice(0,3).map(c=>{let nome=c.nome||c.coordenador||'Coord.';let score=Number(c.score||c.geral||c.percentual||c.kpi_geral||100);return `<div class="coord"><div class="avatar">${nome.split(' ').map(p=>p[0]).join('').slice(0,2)}</div><h3>${esc(nome)}</h3><div class="score">${Math.round(score)}%</div><div class="progress"><span style="--w:${Math.min(100,score)}%"></span></div><div class="mini-kpis"><span>QPI 1</span><span>QPI 2</span><span>QPI 3</span><span>QPI 4</span><span>QPI 5</span></div></div>`}).join('')}</div><div class="cards">${(dados?.kpis_coordenadores?.pendencias||dados?.kpis_coordenadores?.pendencias_criticas||[]).slice(0,3).map(p=>`<div class="data-card warn"><span class="tag">Pendência</span><h3>${esc(p.obra||p.nome||'Atenção')}</h3><p>${esc(p.descricao||p.motivo||p.status||'Item impactando KPI')}</p></div>`).join('')}</div></div>${footer(n,total)}</section>`}
function slideTech(n,total){return `<section class="slide from-left">${header('Ativo Tecnológico','ERP ÍMPAR em números','Base técnica consolidada do dossiê executivo')}<div class="content"><div class="headline" style="font-size:62px">Não é uma tela isolada.<br><span>É uma plataforma operacional.</span></div><div class="tech-grid"><div class="tech"><b>1.452</b><span>arquivos analisados</span></div><div class="tech"><b>388K</b><span>linhas de código</span></div><div class="tech"><b>459</b><span>PHP no backend</span></div><div class="tech"><b>151</b><span>JSONs de dados</span></div></div><p class="copy">Materiais, documentos, cronograma, atividades, KPIs, TV e governança conectados como ativo tecnológico proprietário.</p></div>${footer(n,total)}</section>`}
function slideOnde(n,total){let list=atividade().slice(0,8);return `<section class="slide zoom">${header('Operação do Dia','Quem está onde?','Execução diária transformada em visão operacional')}<div class="content"><div class="people">${list.length?list.map(a=>`<div class="person"><h3>${esc(a.colaborador||a.nome||'Equipe')}</h3><div class="place">📍 ${esc(a.obra||a.planejado?.obra||'Obra não informada')}</div><div class="act">${esc(a.atividade||a.planejado?.atividade||'Atividade não informada')}</div><div class="badge">${a.viagem?'✈️ Viagem':'🏗️ Em campo'}</div></div>`).join(''):'<div class="person"><h3>Atividade do dia</h3><div class="place">Aguardando dados</div><div class="act">O JSON bruto será exibido aqui quando houver planejamento do dia.</div><div class="badge">ERP ÍMPAR</div></div>'}</div></div>${footer(n,total)}</section>`}
function slideAgenda(n,total){let list=agenda().slice(0,12);return `<section class="slide from-top">${header('Planejamento','Agenda Semanal','Alocação por colaborador, obra e atividade')}<div class="content"><div class="timeline">${['Segunda','Terça','Quarta','Quinta','Sexta'].map((d,i)=>`<div class="day"><h3>${d}</h3>${list.filter((_,ix)=>ix%5===i).slice(0,4).map(a=>`<div class="alloc"><b>${esc(a.colaborador||a.nome||'Equipe')}</b><span>${esc(a.obra||a.atividade||'Planejamento')}</span></div>`).join('')||'<div class="alloc"><b>Planejamento</b><span>Dados da agenda semanal</span></div>'}</div>`).join('')}</div></div>${footer(n,total)}</section>`}
function render(){const total=slidesMeta.length;const slides=[slideAbertura(0,total),slideStatus(1,total),slideMarketing(2,total,'01_material.png','Solicitação de Materiais','Da obra para compras, com rastreabilidade',['📦 Solicitação 2.0 por centro de custo e obra','🛒 Compras com cotação e aprovação rastreável','📊 Curva ABC e histórico de preços']),slideFarol(3,total),slideKpi(4,total),slideTech(5,total),slideOnde(6,total),slideAgenda(7,total),slideMarketing(8,total,'05_contratos.png','Contratos e OS','Documentos digitais, seguros e rastreáveis',['📄 Contratos e OS gerados por template','☁️ Integração com Word Online e Office 365','🔐 Rastreabilidade documental e metadados']),slideMarketing(9,total,'06_kpi.png','Gestão Inteligente','Indicadores, decisões e próximos passos',['🤖 SIM • Sistema Inteligente Modular','📺 TV corporativa em tempo real','🏆 ERP ÍMPAR como ativo tecnológico'])];stage.innerHTML=slides.join('');show(0)}
function show(i){clearTimeout(timer);const all=[...document.querySelectorAll('.slide')];all.forEach(s=>s.classList.remove('active'));idx=(i+all.length)%all.length;all[idx].classList.add('active');timer=setTimeout(()=>show(idx+1), idx===0?13000:16000)}
setInterval(()=>document.querySelectorAll('.clockLive').forEach(e=>e.textContent=nowTime()),1000);
async function boot(){try{const r=await fetch(API+'?raw=1&t='+Date.now(),{cache:'no-store'});dados=await r.json()}catch(e){dados={}}render()}
boot();
</script>
</body>
</html>
