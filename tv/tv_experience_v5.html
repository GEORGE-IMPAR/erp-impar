<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ERP ÍMPAR • TV Experience V5</title>
<style>
/* ============================================================
   ERP ÍMPAR — TV EXPERIENCE V5
   Base: tv_v3_preview.html (letras grandes, cards grandes)
   Turbinado: contadores girando + fotos vivas + telas novas +
              vídeos com momento certo + movimento contínuo
   ============================================================ */

:root{
  --bg:#030b16;
  --deep:#061b24;
  --green:#5cff8d;
  --green-2:#22c55e;
  --lime:#a7ff3c;
  --cyan:#39d7ff;
  --blue:#3b82f6;
  --yellow:#ffd35a;
  --red:#ff5a5a;
  --purple:#a855f7;
  --text:#f4fbff;
  --muted:#bad2df;
  --card:rgba(3,18,30,.62);
  --line:rgba(255,255,255,.13);
  --line-2:rgba(92,255,141,.28);
  --glow:0 0 42px rgba(92,255,141,.35);
  --glow-cyan:0 0 42px rgba(57,215,255,.30);
  --shadow:0 24px 80px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 80% 20%,rgba(34,197,94,.24),transparent 34%),
    radial-gradient(circle at 10% 80%,rgba(57,215,255,.15),transparent 32%),
    linear-gradient(135deg,#020617,#073b3a 72%,#064e3b);
  -webkit-font-smoothing:antialiased;
}

/* ============ FUNDO ANIMADO EM CAMADAS ============ */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}

/* Slideshow de fotos de fundo (rotativo, discreto) */
.bg-slideshow{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  overflow:hidden;
}
.bg-slide{
  position:absolute;inset:0;opacity:0;
  background-size:cover;background-position:center;
  filter:blur(18px) brightness(.18) saturate(.7);
  transform:scale(1.15);
  transition:opacity 3s ease-in-out,transform 22s linear;
}
.bg-slide.active{
  opacity:.28;
  transform:scale(1.24);
}

/* Grid + scanline */
.grid-bg{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.14;
  background-image:
    linear-gradient(rgba(92,255,141,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(57,215,255,.035) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle at center,#000,transparent 88%);
  animation:gridShift 24s linear infinite;
}
@keyframes gridShift{to{background-position:64px 64px,64px 64px}}
.noise{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.08;
  background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:3px 3px;
}
.scanline{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,transparent 0%,rgba(92,255,141,.03) 50%,transparent 100%);
  background-size:100% 8px;opacity:.4;
  animation:scan 8s linear infinite;
}
@keyframes scan{to{background-position:0 8px}}

/* Vinheta */
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.5) 100%);
}

/* ============ STAGE / CENAS ============ */
.stage{position:relative;z-index:2;width:100vw;height:100vh}
.scene{
  position:absolute;inset:0;padding:5.2vh 4.8vw;
  opacity:0;transform:scale(1.06) translateY(28px);filter:blur(18px);
  transition:opacity 1.3s cubic-bezier(.16,1,.3,1),
             transform 1.3s cubic-bezier(.16,1,.3,1),
             filter 1.3s cubic-bezier(.16,1,.3,1);
  pointer-events:none;
  display:flex;flex-direction:column;
}
.scene.active{opacity:1;transform:scale(1) translateY(0);filter:blur(0);pointer-events:auto}
.scene.exit-up{transform:scale(.96) translateY(-54px);opacity:0;filter:blur(12px)}

/* ============ HEADER ============ */
.top{display:flex;align-items:center;justify-content:space-between;gap:26px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:22px}
.orb{
  width:82px;height:82px;border-radius:26px;
  background:conic-gradient(from 210deg,#22c55e,#22d3ee,#3b82f6,#a855f7,#f97316,#facc15,#22c55e);
  box-shadow:0 22px 65px rgba(0,0,0,.35),0 0 36px rgba(92,255,141,.28);
  position:relative;
  animation:float 5.5s ease-in-out infinite,spin 22s linear infinite;
}
.orb:after{
  content:"";position:absolute;inset:10px;border-radius:22px;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.75),transparent 38%);
}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.kicker{font-weight:1000;letter-spacing:.35em;color:var(--green);font-size:15px;text-transform:uppercase}
.title{
  font-size:clamp(42px,4.5vw,72px);line-height:.88;font-weight:1000;letter-spacing:-.05em;
  text-shadow:0 12px 42px rgba(0,0,0,.5);margin-top:2px;
}
.subtitle{font-size:clamp(15px,1.2vw,22px);font-weight:900;color:#d7eef6;opacity:.92;margin-top:4px}
.clock{text-align:right;display:flex;flex-direction:column;gap:2px}
.date{font-weight:1000;color:var(--lime);font-size:19px;letter-spacing:.03em}
.time{
  font-weight:1000;font-size:clamp(40px,4.2vw,58px);line-height:1;
  text-shadow:0 12px 34px rgba(0,0,0,.4);
  font-variant-numeric:tabular-nums;color:#fff;
}

/* ============ BODY ============ */
.body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;margin-top:2.5vh}

/* ============ FOOTER ============ */
.footer{
  position:absolute;left:4.8vw;right:4.8vw;bottom:4vh;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  color:#c9dce6;font-weight:900;font-size:14px;
}
.progress{display:flex;gap:8px;flex:1;justify-content:center}
.dot{width:44px;height:5px;border-radius:999px;background:rgba(255,255,255,.18);transition:all .5s ease}
.dot.on{background:linear-gradient(90deg,var(--green),var(--cyan));box-shadow:0 0 18px rgba(92,255,141,.55);width:64px}
.footer .live{
  display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
  background:rgba(92,255,141,.12);border:1px solid rgba(92,255,141,.38);color:var(--green);font-size:12px;
}
.footer .live:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

/* ============ HERO ============ */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:5vw;align-items:center;flex:1}
.headline{font-size:clamp(58px,7vw,128px);font-weight:1000;letter-spacing:-.07em;line-height:.86}
.headline span{color:var(--green);display:block;text-shadow:0 0 50px rgba(92,255,141,.45)}
.lead{font-size:clamp(18px,1.55vw,28px);color:#d4e7ef;font-weight:700;line-height:1.45;max-width:780px;margin-top:28px}
.cta-line{display:flex;gap:16px;margin-top:34px;flex-wrap:wrap}
.pill{
  border:1px solid rgba(92,255,141,.35);
  background:rgba(5,30,36,.6);
  border-radius:999px;padding:13px 20px;font-weight:1000;color:#dfffea;
  font-size:15px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 0 24px rgba(92,255,141,.1);
}

/* Network do hero */
.network{
  height:64vh;border-radius:42px;
  border:1px solid rgba(92,255,141,.28);
  background:
    radial-gradient(circle at 50% 50%,rgba(92,255,141,.08),transparent 65%),
    linear-gradient(145deg,rgba(2,8,23,.4),rgba(5,84,72,.35));
  box-shadow:var(--glow),inset 0 0 80px rgba(57,215,255,.06);
  position:relative;overflow:hidden;
}
.node{
  position:absolute;width:130px;height:130px;border-radius:32px;
  background:rgba(2,16,28,.85);border:1px solid rgba(92,255,141,.34);
  display:grid;place-items:center;text-align:center;font-size:14px;font-weight:1000;color:#e2f4fb;
  box-shadow:0 20px 50px rgba(0,0,0,.32),0 0 32px rgba(92,255,141,.14);
  animation:pulse 3.2s ease-in-out infinite;padding:10px;line-height:1.2;
}
.node b{font-size:32px;display:block;color:var(--green);margin-bottom:6px;line-height:1;text-shadow:0 0 20px rgba(92,255,141,.4)}
.node.pos-tl{left:6%;top:8%}
.node.pos-tc{left:calc(50% - 65px);top:5%;animation-delay:.2s}
.node.pos-tr{right:6%;top:8%;animation-delay:.4s}
.node.pos-bl{left:6%;bottom:8%;animation-delay:.6s}
.node.pos-bc{left:calc(50% - 65px);bottom:5%;animation-delay:.8s}
.node.pos-br{right:6%;bottom:8%;animation-delay:1s}
.beam{
  position:absolute;height:2px;
  background:linear-gradient(90deg,transparent,var(--green),transparent);
  transform-origin:left center;opacity:.85;
  animation:draw 3.8s ease-in-out infinite;
}
.b1{width:28%;left:16%;top:22%;transform:rotate(-4deg)}
.b2{width:28%;left:56%;top:22%;transform:rotate(4deg);animation-delay:.5s}
.b3{width:28%;left:16%;bottom:26%;transform:rotate(4deg);animation-delay:1s}
.b4{width:28%;left:56%;bottom:26%;transform:rotate(-4deg);animation-delay:1.5s}
.b5{width:22%;left:39%;top:46%;animation-delay:.75s}
.b6{width:22%;left:39%;bottom:46%;animation-delay:1.25s}

/* Partícula orbitando um node */
.orbit-dot{
  position:absolute;width:8px;height:8px;border-radius:50%;
  background:var(--green);box-shadow:0 0 12px var(--green);
  animation:orbitDot 4s linear infinite;
}

/* ============ MÉTRICAS ============ */
.data-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:34px}
.metric{
  padding:28px;border-radius:28px;
  border:1px solid var(--line);
  background:linear-gradient(145deg,rgba(2,13,24,.78),rgba(4,42,47,.42));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 20px 60px rgba(0,0,0,.28);
  position:relative;overflow:hidden;
}
.metric:before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--green),transparent);
  opacity:.7;
}
.metric small{
  display:block;letter-spacing:.18em;text-transform:uppercase;
  color:#b8ccdb;font-weight:1000;font-size:12px;
}
.metric strong{
  display:block;font-size:clamp(48px,5vw,88px);line-height:1;
  margin-top:12px;color:#fff;font-variant-numeric:tabular-nums;font-weight:1000;
}
.metric.warn strong{color:var(--yellow)}
.metric.good strong{color:var(--green);text-shadow:0 0 28px rgba(92,255,141,.35)}
.metric.danger strong{color:var(--red);text-shadow:0 0 28px rgba(255,90,90,.3)}
.metric .hint{display:block;color:#8aa5b4;font-size:13px;margin-top:8px;font-weight:700}

/* ============ CARDS DE OBRA ============ */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:34px}
.work-card{
  min-height:260px;padding:28px;border-radius:32px;
  background:linear-gradient(145deg,rgba(4,20,34,.85),rgba(5,77,66,.5));
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 22px 64px rgba(0,0,0,.32),inset 0 0 0 1px rgba(92,255,141,.06);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.work-card:before{
  content:"";position:absolute;inset:-40%;
  background:radial-gradient(circle,rgba(92,255,141,.17),transparent 35%);
  transform:translate(-35%,-35%);animation:orbit 9s linear infinite;
}
.work-card h3{position:relative;font-size:34px;margin:0 0 14px;font-weight:1000;line-height:1;text-shadow:0 4px 12px rgba(0,0,0,.5)}
.work-card p{position:relative;color:#dcebf2;font-size:18px;font-weight:800;line-height:1.35}
.tag{
  position:relative;display:inline-flex;align-self:flex-start;
  margin-bottom:18px;border-radius:999px;padding:9px 14px;
  background:rgba(92,255,141,.14);border:1px solid rgba(92,255,141,.32);
  font-size:12px;font-weight:1000;color:var(--lime);
  letter-spacing:.06em;text-transform:uppercase;
}
.tag.verde{background:rgba(92,255,141,.16);border-color:rgba(92,255,141,.44);color:var(--green)}
.tag.amarelo{background:rgba(255,211,90,.14);border-color:rgba(255,211,90,.4);color:var(--yellow)}
.tag.vermelho{background:rgba(255,90,90,.14);border-color:rgba(255,90,90,.4);color:var(--red)}

/* Barra de progresso animada */
.bar{
  height:14px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;
  margin-top:14px;position:relative;
}
.bar i{
  display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--green),var(--lime));
  transition:width 1.8s cubic-bezier(.16,1,.3,1);
  box-shadow:0 0 14px rgba(92,255,141,.6);
  position:relative;
}
.bar i:after{
  content:"";position:absolute;top:0;right:0;width:20px;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.8));
  animation:barGlow 2s ease-in-out infinite;
}
@keyframes barGlow{50%{transform:translateX(-8px);opacity:.6}}
.active .bar i{width:var(--w)}
.bar.warn i{background:linear-gradient(90deg,var(--yellow),#ffb84a);box-shadow:0 0 14px rgba(255,211,90,.55)}
.bar.danger i{background:linear-gradient(90deg,var(--red),#ff8080);box-shadow:0 0 14px rgba(255,90,90,.55)}

.stats-line{
  display:flex;gap:14px;margin-top:auto;padding-top:14px;
  border-top:1px solid rgba(255,255,255,.07);
  font-size:12px;color:#a8bfcc;font-weight:800;letter-spacing:.03em;
}
.stats-line span b{color:#fff;font-weight:1000;font-size:20px;display:block;margin-bottom:2px}

/* ============ PRODUCT (marketing) ============ */
.split{display:grid;grid-template-columns:.92fr 1.08fr;gap:36px;flex:1;align-items:center;min-height:0}
.split-txt{display:flex;flex-direction:column;justify-content:center}
.split-txt .headline-md{
  font-size:clamp(48px,5vw,92px);font-weight:1000;letter-spacing:-.045em;line-height:.9;margin:0 0 24px;
  text-shadow:0 6px 24px rgba(0,0,0,.4);
}
.split-txt .headline-md span{color:var(--green);display:block;text-shadow:0 0 40px rgba(92,255,141,.35)}
.split-txt .lead-p{font-size:clamp(17px,1.4vw,24px);color:#d4e7ef;font-weight:700;line-height:1.45;max-width:560px;margin:0 0 26px}
.feature-list{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.feature{
  display:flex;align-items:center;gap:16px;padding:16px 20px;
  border-radius:18px;background:rgba(2,15,28,.62);border:1px solid rgba(92,255,141,.2);
  font-weight:800;color:#e2f4fb;font-size:17px;
  transition:all .4s ease;
}
.feature .ico{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(92,255,141,.22),rgba(57,215,255,.12));
  border:1px solid rgba(92,255,141,.32);flex-shrink:0;font-size:22px;
}

/* Device mockup (moldura de celular pros vídeos) */
.device{
  position:relative;width:min(360px,88%);aspect-ratio:392/850;margin:0 auto;
  border-radius:46px;
  background:linear-gradient(135deg,#0a1526,#050f1c);
  padding:14px;
  box-shadow:
    0 40px 120px rgba(0,0,0,.6),
    0 0 70px rgba(92,255,141,.22),
    inset 0 0 0 1.5px rgba(92,255,141,.28),
    inset 0 0 0 3px rgba(0,0,0,.5);
}
.device:before{
  content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:120px;height:22px;background:#000;border-radius:14px;z-index:3;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
}
.device-screen{
  width:100%;height:100%;border-radius:34px;overflow:hidden;
  background:#000;position:relative;
}
.device-screen video,.device-screen img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.device-glow{
  position:absolute;inset:-40px;border-radius:60px;pointer-events:none;
  background:radial-gradient(circle,rgba(92,255,141,.28),transparent 65%);
  z-index:-1;animation:deviceGlow 4s ease-in-out infinite;
}
@keyframes deviceGlow{50%{transform:scale(1.12);opacity:.7}}

/* Imagem estática de tela desktop (screenshot) */
.desktop-mock{
  position:relative;width:min(96%,780px);margin:0 auto;
  border-radius:22px;overflow:hidden;
  border:1px solid rgba(92,255,141,.28);
  box-shadow:0 30px 100px rgba(0,0,0,.5),0 0 60px rgba(92,255,141,.18);
  background:#000;
}
.desktop-mock img{width:100%;display:block}
.desktop-mock:before{
  content:"";position:absolute;top:0;left:0;right:0;height:26px;
  background:linear-gradient(180deg,rgba(2,10,20,.9),rgba(2,10,20,.4));
  z-index:1;
}

/* ============ TIMELINE (agenda / atividade) ============ */
.timeline{display:grid;gap:14px;max-height:70vh;overflow:hidden;align-content:center}
.line-item{
  display:grid;grid-template-columns:170px 1fr auto;gap:22px;align-items:center;
  padding:18px 22px;border-radius:22px;
  background:linear-gradient(90deg,rgba(2,14,26,.75),rgba(2,14,26,.5));
  border:1px solid rgba(255,255,255,.09);
  transition:all .4s ease;
}
.line-item .who{display:flex;align-items:center;gap:14px}
.line-item .avatar-mini{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,#0f766e,#22c55e);
  display:grid;place-items:center;font-weight:1000;font-size:15px;color:#fff;
  border:2px solid rgba(255,255,255,.5);flex-shrink:0;
  box-shadow:0 6px 18px rgba(0,0,0,.3);
}
.line-item b{font-size:16px;color:#fff;font-weight:900;line-height:1.15}
.line-item .info strong{font-size:20px;color:var(--green);font-weight:1000;display:block;line-height:1.2}
.line-item .info span{display:block;color:#c5d8e2;font-weight:700;margin-top:4px;font-size:14px}
.line-item .badge{
  padding:7px 12px;border-radius:10px;background:rgba(92,255,141,.14);
  border:1px solid rgba(92,255,141,.32);font-size:12px;font-weight:1000;color:var(--green);
  white-space:nowrap;letter-spacing:.03em;
}
.line-item .badge.placa{background:rgba(57,215,255,.12);border-color:rgba(57,215,255,.35);color:var(--cyan)}

/* ============ KPI CARDS (estilo V3, grande) ============ */
.kpi-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:44px}
.kpi-card{
  padding:32px;border-radius:34px;
  background:linear-gradient(145deg,rgba(2,15,28,.82),rgba(5,83,70,.48));
  border:1px solid rgba(92,255,141,.32);
  box-shadow:0 24px 80px rgba(0,0,0,.36),inset 0 0 0 1px rgba(255,255,255,.03);
  position:relative;overflow:hidden;
}
.kpi-card:before{
  content:"";position:absolute;top:-30%;right:-30%;width:80%;height:80%;
  background:radial-gradient(circle,rgba(92,255,141,.18),transparent 65%);
  animation:kpiGlow 5s ease-in-out infinite;
}
@keyframes kpiGlow{50%{transform:scale(1.1) rotate(15deg);opacity:.75}}
.kpi-head{display:flex;align-items:center;gap:18px;position:relative}
.avatar{
  width:76px;height:76px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#0f766e,#22c55e);
  font-size:26px;font-weight:1000;color:#fff;
  border:2px solid rgba(255,255,255,.55);
  box-shadow:0 10px 28px rgba(0,0,0,.4),0 0 24px rgba(92,255,141,.3);
  flex-shrink:0;
}
.kpi-card h3{font-size:clamp(26px,2.2vw,36px);margin:0;font-weight:1000;line-height:1.1}
.kpi-card .status-mini{
  font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin-top:5px;
  display:inline-flex;padding:4px 10px;border-radius:8px;
}
.kpi-card .status-mini.excelente{background:rgba(92,255,141,.14);color:var(--green);border:1px solid rgba(92,255,141,.35)}
.kpi-card .status-mini.bom{background:rgba(57,215,255,.12);color:var(--cyan);border:1px solid rgba(57,215,255,.35)}
.kpi-card .status-mini.atencao{background:rgba(255,211,90,.14);color:var(--yellow);border:1px solid rgba(255,211,90,.4)}
.score{
  font-size:clamp(72px,7vw,110px);font-weight:1000;line-height:1;
  margin:28px 0 14px;color:var(--green);
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 40px rgba(92,255,141,.5);
  position:relative;
  letter-spacing:-.03em;
}
.mini-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px;position:relative}
.mini-kpis span{
  border-radius:12px;text-align:center;padding:10px 4px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  font-weight:1000;font-size:11px;color:#daf7e6;letter-spacing:.05em;
}
.mini-kpis span b{

/* ---------- HELPERS ---------- */
const brDate = new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
function fmt(n){ return Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:0}); }
function pct(n){ return Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%'; }
function money(n){ return 'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function initials(s){ return String(s||'?').trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(); }
function chunk(arr,n){ const out=[]; for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n)); return out; }

async function getJson(url){
  try{
    const r = await fetch(url+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}
async function loadData(){
  const keys = Object.keys(API);
  const vals = await Promise.all(keys.map(k=>getJson(API[k])));
  let liveCount = 0;
  keys.forEach((k,i)=>{ if(vals[i]){ data[k] = vals[i]; liveCount++; } });
  window.__liveMode = liveCount>0;
}

/* ============================================
   RENDER + LOOP
   ============================================ */
const stage = document.getElementById('stage');
let currentScenes = [];
let idx = 0;
let timer = null;

function render(){
  currentScenes = buildAllScenes();
  stage.innerHTML = currentScenes.join('');
  const total = currentScenes.length;
  document.querySelectorAll('.scene').forEach((sc,i)=>{
    const progEl = sc.querySelector('.progress');
    if(progEl){
      progEl.innerHTML = Array.from({length:total},(_,x)=>`<span class="dot ${x===i?'on':''}"></span>`).join('');
    }
  });
  startShow();
  tickClock();
}

function startShow(){
  const sc = [...document.querySelectorAll('.scene')];
  if(sc.length===0) return;
  idx = 0;
  sc.forEach(s=>s.classList.remove('active','exit-up'));
  sc[0].classList.add('active');
  animateCounts();
  updateBgSlideshow(0);

  clearInterval(timer);
  timer = setInterval(()=>{
    const cur = sc[idx];
    cur.classList.remove('active');
    cur.classList.add('exit-up');
    idx = (idx+1) % sc.length;
    setTimeout(()=>{
      sc.forEach(s=>s.classList.remove('exit-up'));
      sc[idx].classList.add('active');
      animateCounts();
      updateBgSlideshow(idx);
    }, 450);
  }, SLIDE_DURATION);
}

let clockTimer = null;
function tickClock(){
  const upd = ()=> document.querySelectorAll('[data-clock]').forEach(e=>{
    e.textContent = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  });
  upd();
  if(clockTimer) clearInterval(clockTimer);
  clockTimer = setInterval(upd, 500);
}

/* Contador animado (KPIs girando estilo slot machine) */
function animateCounts(){
  document.querySelectorAll('.active [data-count]').forEach(el=>{
    const end  = Number(el.dataset.count||0);
    const suffix = el.dataset.suffix || '';
    const isPct = el.classList.contains('score') || suffix === '%';
    const dur = 1600;
    const start = performance.now();
    function step(now){
      const p = Math.min(1,(now-start)/dur);
      // easeOutCubic
      const e = 1 - Math.pow(1-p,3);
      let val;
      if(p < 1){
        // Efeito "slot machine": nos primeiros 40% mostra jitter aleatório
        if(p < 0.4){
          const cap = Math.round(end * (0.3 + p * 1.5));
          val = Math.floor(Math.random() * Math.min(cap, end));
        } else {
          val = Math.round(end*e);
        }
        if(val > end) val = end;
        el.textContent = isPct ? val+'%' : fmt(val);
        requestAnimationFrame(step);
      } else {
        // Estado final: sempre o valor exato
        el.textContent = isPct ? end+'%' : fmt(end);
      }
    }
    requestAnimationFrame(step);
  });
}

/* ============================================
   SLIDESHOW DE FUNDO (fotos das obras)
   ============================================ */
const bgSlideshow = document.getElementById('bg-slideshow');
OBRA_PHOTOS.forEach((src,i)=>{
  const s = document.createElement('div');
  s.className = 'bg-slide';
  s.style.backgroundImage = `url('${src}')`;
  if(i===0) s.classList.add('active');
  bgSlideshow.appendChild(s);
});
function updateBgSlideshow(sceneIdx){
  const slides = [...bgSlideshow.querySelectorAll('.bg-slide')];
  if(slides.length===0) return;
  const target = sceneIdx % slides.length;
  slides.forEach((s,i)=> s.classList.toggle('active', i===target));
}

/* ============================================
   PARTÍCULAS DE FUNDO (discreto)
   ============================================ */
const c = document.getElementById('fx');
const ctx = c.getContext('2d');
let W, H, pts = [];
function resize(){
  W = c.width  = innerWidth;
  H = c.height = innerHeight;
  const count = Math.min(60, Math.floor((W*H)/32000));
  pts = Array.from({length:count},()=>({
    x:Math.random()*W, y:Math.random()*H,
    vx:(Math.random()-.5)*.28, vy:(Math.random()-.5)*.28,
    r:Math.random()*1.2+.8
  }));
}
addEventListener('resize', resize);
resize();

function anim(){
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<pts.length;i++){
    const p = pts[i];
    p.x += p.vx; p.y += p.vy;
    if(p.x<0||p.x>W) p.vx*=-1;
    if(p.y<0||p.y>H) p.vy*=-1;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle = 'rgba(92,255,141,.32)';
    ctx.fill();
    for(let j=i+1;j<pts.length;j++){
      const q = pts[j];
      const dx = p.x-q.x, dy = p.y-q.y;
      const d = Math.hypot(dx,dy);
      if(d<160){
        ctx.strokeStyle = `rgba(57,215,255,${(1-d/160)*.14})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y);
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(anim);
}
anim();

      idx = savedIdx;
      sc[idx].classList.add('active');
