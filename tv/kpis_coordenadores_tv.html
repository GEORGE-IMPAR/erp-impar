<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ERP ÍMPAR • KPIs Coordenadores TV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0} html,body{width:100%;height:100%;overflow:hidden;background:#020617}
iframe{width:100vw;height:100vh;border:0;background:#020617;display:block}
#mask{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(120deg,#061634,#0b3b68,#0f766e);color:#fff;font:900 28px system-ui;z-index:5;transition:.25s}
#mask.hide{opacity:0;visibility:hidden;pointer-events:none}

/* PREMIUM TV — efeitos visuais */
body{animation:tvEnter .8s cubic-bezier(.16,1,.3,1) both;}
@keyframes tvEnter{from{opacity:0;transform:translateY(24px) scale(.985);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.card,.kpi,.obra-card,.status-card,.person-card,[class*="card"],[class*="Card"]{transition:transform .3s ease, box-shadow .3s ease!important;}
.card:hover,.kpi:hover,.obra-card:hover,.status-card:hover,.person-card:hover{transform:translateY(-3px) scale(1.01)!important;}
.warn,.warning,.yellow,[class*="warn"],[class*="yellow"]{animation:tvPulseYellow 2.4s ease-in-out infinite!important;}
.bad,.red,.danger,.atrasado,.pendente,[class*="bad"],[class*="red"],[class*="late"]{animation:tvPulseRed 2.2s ease-in-out infinite!important;}
@keyframes tvPulseRed{0%,100%{box-shadow:0 12px 28px rgba(0,0,0,.22),0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 18px 44px rgba(0,0,0,.32),0 0 24px rgba(239,68,68,.34)}}
@keyframes tvPulseYellow{0%,100%{box-shadow:0 12px 28px rgba(0,0,0,.22),0 0 0 rgba(250,204,21,0)}50%{box-shadow:0 18px 44px rgba(0,0,0,.32),0 0 24px rgba(250,204,21,.30)}}
</style>
</head>
<body>
<div id="mask">📊 Carregando KPIs oficiais...</div>
<iframe id="frame" src="../KPI_Coordenadores/index.html?tv=1&fromMaster=1"></iframe>
<script>
const frame=document.getElementById('frame');
frame.addEventListener('load',()=>{
  setTimeout(()=>document.getElementById('mask').classList.add('hide'),700);
  try{
    const d=frame.contentDocument;
    const st=d.createElement('style');
    st.textContent=`
      body{overflow:auto!important;}
      .btn-fullscreen,#btnFullscreen,[onclick*="Fullscreen"],[onclick*="fullscreen"]{display:none!important}
      img{object-fit:cover} img:not([src]), img[src=""]{display:none!important}
      img{background:linear-gradient(135deg,#22c55e,#14b8a6)!important;}
    `;
    d.head.appendChild(st);
  }catch(e){}
});
try{window.parent.postMessage({type:'ERP_IMPAR_TV_BADGE',text:'📊 KPIs Coordenadores'},'*')}catch(e){}
</script>
</body>
</html>
