<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ERP ÍMPAR • Showcase</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#eef6ff;background:radial-gradient(circle at 16% 12%,rgba(34,211,238,.20),transparent 34%),radial-gradient(circle at 82% 16%,rgba(155,227,41,.18),transparent 30%),linear-gradient(135deg,#071a3b,#0b2a5a 44%,#075f5a);}
.stage{height:100vh;padding:46px 56px;display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:center;position:relative}.stage:before{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 0 42%,rgba(255,255,255,.06) 48%,transparent 54%);animation:sweep 5s ease-in-out infinite}.brand{position:absolute;top:28px;left:42px;display:flex;align-items:center;gap:14px}.orb{width:58px;height:58px;border-radius:18px;background:conic-gradient(from 210deg,#22d3ee,#7c3aed,#fb7185,#facc15,#22c55e,#22d3ee);box-shadow:0 0 30px rgba(34,211,238,.28),inset 0 0 20px rgba(255,255,255,.18)}.kicker{color:#b8ff38;font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:950}.brand-title{font-size:30px;font-weight:950;line-height:1}.copy{position:relative;z-index:2}.copy h1{font-size:72px;line-height:.95;letter-spacing:-.06em;font-weight:1000;text-transform:uppercase;text-shadow:0 16px 36px rgba(0,0,0,.35)}.copy h1 span{display:block;color:#b8ff38}.copy p{margin-top:22px;font-size:23px;line-height:1.32;color:#dbeafe;font-weight:800;max-width:780px}.badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.badge{border:1px solid rgba(155,227,41,.30);background:rgba(155,227,41,.10);color:#eaffc6;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:950;letter-spacing:.06em;text-transform:uppercase}.grid{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{min-height:168px;border-radius:26px;border:1px solid rgba(255,255,255,.14);background:linear-gradient(145deg,rgba(3,12,31,.80),rgba(7,27,59,.58));box-shadow:0 24px 60px rgba(0,0,0,.30);padding:22px;display:grid;align-content:space-between;overflow:hidden;position:relative;animation:float 4s ease-in-out infinite}.card:nth-child(2){animation-delay:.4s}.card:nth-child(3){animation-delay:.8s}.card:nth-child(4){animation-delay:1.2s}.card:before{content:"";position:absolute;right:-40px;top:-50px;width:130px;height:130px;border-radius:999px;background:radial-gradient(circle,rgba(155,227,41,.22),transparent 65%)}.ico{font-size:42px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}.card h3{font-size:24px;line-height:1.05;font-weight:950}.card p{font-size:14px;color:#cbd5e1;font-weight:800;line-height:1.35}.footer{position:absolute;right:42px;bottom:30px;color:#b8ff38;font-weight:950;letter-spacing:.12em;text-transform:uppercase;font-size:13px}@keyframes sweep{0%,55%{transform:translateX(-80%)}100%{transform:translateX(80%)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<div class="stage">
  <div class="brand"><div class="orb"></div><div><div class="kicker">PLATAFORMA ERP ÍMPAR</div><div class="brand-title">Gestão Integrada de Obras</div></div></div>
  <section class="copy"><h1 id="titulo">Do orçamento à entrega<span>tudo conectado.</span></h1><p id="texto">Cronograma, atividades, materiais, RH, KPIs, RDO e TV executiva falando a mesma língua.</p><div class="badges" id="badges"></div></section>
  <section class="grid" id="cards"></section>
  <div class="footer">ERP ÍMPAR • tecnologia aplicada à operação real</div>
</div>
<script>
const data={
 fluxo:{t:'Do orçamento à entrega',s:'tudo conectado.',p:'Uma obra nasce no orçamento, vira contrato, solicitação, compra, cronograma, atividade diária, RDO e KPI sem perder rastreabilidade.',b:['Cronograma oficial','Obras ativas','Gestão em tempo real'],c:[['💰','Orçamento','Base comercial conectada ao projeto.'],['📄','Documentos','Contrato e OS integrados à obra.'],['📦','Materiais','Solicitação e recebimento rastreáveis.'],['📊','Cronograma','Fonte oficial para toda a gestão.']]},
 tecnologia:{t:'Dados confiáveis',s:'decisão mais rápida.',p:'GitHub no front, KingHost em JSON/PHP, integração com Telegram, dashboards e TV executiva em ciclo automático.',b:['SSO','JSON oficial','Telegram','TV Master'],c:[['🔐','SSO ERP ÍMPAR','Usuário único em todos os módulos.'],['⚙️','Automação leve','PHP só como ponte de leitura e gravação.'],['🤖','Telegram/RDO','Rotina de campo virando gestão.'],['📺','TV executiva','Visibilidade constante para a equipe.']]},
 cim:{t:'C.I.M',s:'controle integrado de materiais.',p:'Recebimento por DANFE, conferência, conciliação e rastreabilidade para reduzir perda, retrabalho e compra duplicada.',b:['DANFE','Conferência','Estoque','Rastreabilidade'],c:[['📥','Recebimento','Entrada de mercadoria padronizada.'],['🔎','Conciliação','NF x solicitação com evidência.'],['📦','Estoque por obra','Materiais vinculados ao centro de custo.'],['✅','Menos perda','Controle operacional com visão executiva.']]},
 futuro:{t:'Próximas entregas',s:'mais inteligência.',p:'Nova Solicitação de Material, SIM e dashboards executivos evoluindo sobre uma base integrada e estabilizada.',b:['Solicitação 2.0','SIM','Dashboards','IA operacional'],c:[['🧠','SIM','Assistente para consultar e orientar a operação.'],['📦','Material 2.0','Fluxo mais rápido e inteligente.'],['📈','Dashboards premium','Indicadores para decisão diária.'],['🚀','Inovação contínua','ERP evoluindo com a rotina da ÍMPAR.']]}
};
const q=new URLSearchParams(location.search);const slide=data[q.get('slide')]||data.fluxo;document.getElementById('titulo').innerHTML=slide.t+'<span>'+slide.s+'</span>';document.getElementById('texto').textContent=slide.p;document.getElementById('badges').innerHTML=slide.b.map(x=>`<span class="badge">${x}</span>`).join('');document.getElementById('cards').innerHTML=slide.c.map(x=>`<article class="card"><div class="ico">${x[0]}</div><div><h3>${x[1]}</h3><p>${x[2]}</p></div></article>`).join('');
</script>
</body>
</html>
