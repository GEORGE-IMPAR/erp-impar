<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="tv_style.css"><title>TV • Status Obras</title></head><body><main class="page"><header class="top"><div class="brand"><div class="orb"></div><div><div class="kicker">Gestão à vista</div><div class="title">Status das obras</div><div class="subtitle">Status digitado pelos coordenadores na TV oficial</div></div></div><div class="clock"><div class="date"></div><div class="hour"></div></div></header><section id="metrics" class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px"></section><section id="cards" class="grid fade-pane" style="grid-template-columns:repeat(3,1fr)"></section><div class="footer-note" id="note">Carregando TV oficial...</div></main><script src="tv_common.js"></script><script>
let pages=[],page=0;
function colorBy(p){const f=norm(p.farol); const d=p.dias; if(f.includes('VERM')||d>10)return ['bad','#ef4444','🔴 Atenção']; if(f.includes('AMAR')||d>7)return ['warn','#facc15','🟡 Atualizar']; return ['ok','#22c55e','🟢 Atualizado'];}
function render(){const pane=$('#cards');pane.classList.add('hide');setTimeout(()=>{const list=pages[page]||[];pane.innerHTML=list.map((p,i)=>{const [cls,col,label]=colorBy(p);return `<article class="glass card ${cls}" style="--accent:${col};padding:24px;min-height:225px;animation-delay:${i*.07}s"><div class="pill ${cls}">${label}</div><h2 style="font-size:28px;line-height:1.08;margin:16px 0 10px;text-transform:uppercase">${p.nome}</h2><p style="font-size:20px;font-weight:950;line-height:1.22;color:#fff">${p.status}</p><div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap"><span class="pill">${p.coord}</span><span class="pill">${p.execucao||'Execução não informada'}</span><span class="pill">${p.dias>=999?'Sem data':'há '+p.dias+' dia(s)'}</span></div></article>`}).join('')||'<div class="empty">Nenhum status encontrado na TV.</div>'; pane.classList.remove('hide'); $('#note').textContent=`Fonte: /api/tv/data/projetos.json • Página ${page+1} de ${pages.length||1}`},260)}
async function main(){const [ativas,tv,fuel]=await Promise.all([obrasAtivas().catch(()=>[]),tvProjetos().catch(()=>[]),combustivelMes()]); const ok=tv.filter(p=>p.dias<=7).length; const pend=tv.filter(p=>p.dias>7).length; $('#metrics').innerHTML=`<div class="metric glass"><span>Obras ativas</span><b>${ativas.length||'—'}</b><small>Fonte cronograma</small></div><div class="metric glass"><span>Status TV</span><b>${tv.length}</b><small>Projetos cadastrados</small></div><div class="metric glass"><span>Pendências TV</span><b>${pend}</b><small>Acima de 7 dias / sem data</small></div><div class="metric glass"><span>Combustível mês</span><b style="font-size:34px">${money(fuel)}</b><small>RH/KPI</small></div>`; tv.sort((a,b)=>b.dias-a.dias||a.nome.localeCompare(b.nome,'pt-BR')); pages=chunk(tv,6); render(); if(pages.length>1)setInterval(()=>{page=(page+1)%pages.length;render()},9000)}
main().catch(e=>{$('#cards').innerHTML='<div class="empty">Não consegui carregar os status da TV.</div>';console.error(e)})
</script></body></html>
