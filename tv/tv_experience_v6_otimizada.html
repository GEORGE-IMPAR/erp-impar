<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ERP ÍMPAR • TV Experience V6</title>
<style>
/* ============================================================
   ERP ÍMPAR — TV V6
   FONTES GIGANTES · FUNDOS REAIS · MOVIMENTO CONTÍNUO
   ============================================================ */
:root{
  --bg:#020814;
  --deep:#04101c;
  --green:#5cff8d;
  --green-2:#22c55e;
  --lime:#a7ff3c;
  --cyan:#39d7ff;
  --blue:#3b82f6;
  --yellow:#ffd35a;
  --red:#ff5a5a;
  --purple:#a855f7;
  --orange:#ff8b3d;
  --text:#f4fbff;
  --muted:#bad2df;
  --line:rgba(255,255,255,.14);
  --glow:0 0 60px rgba(92,255,141,.45);
  --shadow:0 30px 90px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  background:#020814;
  -webkit-font-smoothing:antialiased;
}

/* ============ FUNDO — FOTOS REAIS DE OBRA ============ */
#bg-photo{
  position:fixed;inset:0;z-index:0;
  background-size:cover;background-position:center;
  transition:background-image 2s ease, transform 22s linear;
  will-change:background-image,transform;
  transform:scale(1.05);
}
#bg-photo.zoom{transform:scale(1.15)}
/* Overlay dark pra manter legibilidade */
.bg-overlay{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(2,8,20,.75) 0%,rgba(2,8,20,.55) 40%,rgba(2,8,20,.85) 100%),
    radial-gradient(ellipse at 70% 20%,rgba(34,197,94,.14),transparent 55%),
    radial-gradient(ellipse at 20% 80%,rgba(57,215,255,.10),transparent 50%);
}
/* Grid discreto */
.grid-bg{
  position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.10;
  background-image:
    linear-gradient(rgba(92,255,141,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(57,215,255,.05) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle at center,#000,transparent 88%);
  animation:gridShift 24s linear infinite;
}
@keyframes gridShift{to{background-position:64px 64px,64px 64px}}
.scanline{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,transparent 0%,rgba(92,255,141,.025) 50%,transparent 100%);
  background-size:100% 8px;opacity:.3;
  animation:scan 10s linear infinite;
}
@keyframes scan{to{background-position:0 8px}}
.vignette{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.6) 100%);
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}

/* ============ STAGE / CENAS ============ */
.stage{position:relative;z-index:4;width:100vw;height:100vh}
.scene{
  position:absolute;inset:0;padding:4vh 4.5vw 10vh;
  opacity:0;transform:scale(1.05) translateY(24px);filter:blur(16px);
  transition:opacity 1.2s cubic-bezier(.16,1,.3,1),
             transform 1.2s cubic-bezier(.16,1,.3,1),
             filter 1.2s cubic-bezier(.16,1,.3,1);
  pointer-events:none;
  display:flex;flex-direction:column;
}
.scene.active{opacity:1;transform:scale(1) translateY(0);filter:blur(0);pointer-events:auto}
.scene.exit-up{transform:scale(.96) translateY(-40px);opacity:0;filter:blur(10px)}

/* ============ HEADER ============ */
.top{display:flex;align-items:center;justify-content:space-between;gap:26px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:24px}
.orb{
  width:88px;height:88px;border-radius:28px;
  background:conic-gradient(from 210deg,#22c55e,#22d3ee,#3b82f6,#a855f7,#f97316,#facc15,#22c55e);
  box-shadow:0 22px 65px rgba(0,0,0,.4),0 0 44px rgba(92,255,141,.35);
  position:relative;
  animation:float 5s ease-in-out infinite, spin 20s linear infinite;
  flex-shrink:0;
}
.orb:after{
  content:"";position:absolute;inset:11px;border-radius:22px;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.8),transparent 42%);
}
@keyframes float{50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.kicker{
  font-weight:1000;letter-spacing:.32em;color:var(--green);
  font-size:18px;text-transform:uppercase;
  text-shadow:0 0 24px rgba(92,255,141,.4);
}
.title{
  font-size:clamp(48px,4.8vw,74px);line-height:.9;font-weight:1000;
  letter-spacing:-.045em;margin-top:6px;
  text-shadow:0 8px 32px rgba(0,0,0,.6);
}
.subtitle{
  font-size:clamp(17px,1.3vw,24px);font-weight:800;color:#d7eef6;
  margin-top:6px;text-shadow:0 4px 16px rgba(0,0,0,.5);
}
.clock{text-align:right;flex-shrink:0}
.date{font-weight:1000;color:var(--lime);font-size:20px;letter-spacing:.03em;text-shadow:0 0 20px rgba(167,255,60,.35)}
.time{
  font-weight:1000;font-size:clamp(44px,4.4vw,64px);line-height:1;
  font-variant-numeric:tabular-nums;color:#fff;
  text-shadow:0 8px 28px rgba(0,0,0,.5);
}

/* ============ BODY / FOOTER ============ */
.body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;margin-top:2vh;overflow:hidden}
.footer{
  position:absolute;left:4.5vw;right:4.5vw;bottom:3vh;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  color:#c9dce6;font-weight:900;font-size:14px;
  z-index:5;
}
.progress{display:flex;gap:8px;flex:1;justify-content:center;flex-wrap:wrap;max-width:60%}
.dot{width:44px;height:5px;border-radius:999px;background:rgba(255,255,255,.16);transition:all .5s ease}
.dot.on{background:linear-gradient(90deg,var(--green),var(--cyan));box-shadow:0 0 20px rgba(92,255,141,.6);width:70px}
.live{
  display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;
  background:rgba(92,255,141,.14);border:1px solid rgba(92,255,141,.42);color:var(--green);font-size:13px;
  text-shadow:0 0 12px rgba(92,255,141,.5);
}
.live:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 16px var(--green);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}

/* ============================================================
   1. HERO — massivo
============================================================ */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:5vw;align-items:center;flex:1}
.hero .headline{
  font-size:clamp(72px,7.5vw,140px);
  font-weight:1000;letter-spacing:-.055em;line-height:.85;
  text-shadow:0 10px 40px rgba(0,0,0,.6);
}
.hero .headline span{
  color:var(--green);display:block;
  text-shadow:0 0 60px rgba(92,255,141,.55);
}
.hero .lead{
  font-size:clamp(22px,1.7vw,32px);color:#e8f5f9;font-weight:600;
  line-height:1.4;max-width:820px;margin-top:32px;
  text-shadow:0 4px 20px rgba(0,0,0,.6);
}
.hero .cta-line{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.pill{
  border:1.5px solid rgba(92,255,141,.42);
  background:rgba(5,30,36,.62);
  border-radius:999px;padding:14px 22px;font-weight:1000;color:#dfffea;
  font-size:16px;letter-spacing:.03em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 0 24px rgba(92,255,141,.12);
  backdrop-filter:blur(8px);
}

/* Network do hero */
.network{
  height:min(64vh,640px);border-radius:44px;
  border:1.5px solid rgba(92,255,141,.32);
  background:
    radial-gradient(circle at 50% 50%,rgba(92,255,141,.14),transparent 65%),
    linear-gradient(145deg,rgba(2,8,23,.5),rgba(5,84,72,.32));
  box-shadow:var(--glow),inset 0 0 100px rgba(57,215,255,.08);
  position:relative;overflow:hidden;
  backdrop-filter:blur(6px);
}
.node{
  position:absolute;width:140px;height:140px;border-radius:34px;
  background:rgba(2,16,28,.9);border:1.5px solid rgba(92,255,141,.4);
  display:grid;place-items:center;text-align:center;font-size:15px;font-weight:1000;color:#e2f4fb;
  box-shadow:0 22px 55px rgba(0,0,0,.4),0 0 36px rgba(92,255,141,.2);
  animation:pulse 3.2s ease-in-out infinite;padding:12px;line-height:1.2;
  backdrop-filter:blur(4px);
}
.node b{font-size:34px;display:block;color:var(--green);margin-bottom:6px;line-height:1;text-shadow:0 0 22px rgba(92,255,141,.5)}
.node.pos-tl{left:5%;top:7%}
.node.pos-tc{left:calc(50% - 70px);top:4%;animation-delay:.2s}
.node.pos-tr{right:5%;top:7%;animation-delay:.4s}
.node.pos-bl{left:5%;bottom:7%;animation-delay:.6s}
.node.pos-bc{left:calc(50% - 70px);bottom:4%;animation-delay:.8s}
.node.pos-br{right:5%;bottom:7%;animation-delay:1s}
.beam{position:absolute;height:2.5px;background:linear-gradient(90deg,transparent,var(--green),transparent);transform-origin:left center;opacity:.85;animation:draw 3.8s ease-in-out infinite}
.b1{width:26%;left:18%;top:22%;transform:rotate(-6deg)}
.b2{width:26%;left:56%;top:22%;transform:rotate(6deg);animation-delay:.5s}
.b3{width:26%;left:18%;bottom:26%;transform:rotate(6deg);animation-delay:1s}
.b4{width:26%;left:56%;bottom:26%;transform:rotate(-6deg);animation-delay:1.5s}
.b5{width:22%;left:39%;top:44%;animation-delay:.75s}
.b6{width:22%;left:39%;bottom:44%;animation-delay:1.25s}
@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 22px 55px rgba(0,0,0,.4),0 0 55px rgba(92,255,141,.4)}}
@keyframes draw{0%,100%{opacity:.2;clip-path:inset(0 100% 0 0)}50%{opacity:.95;clip-path:inset(0 0 0 0)}}

/* ============================================================
   2. FAROL — Previsto × Realizado em DESTAQUE
============================================================ */
.farol-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;flex:1;align-items:stretch;min-height:0}
.farol-card{
  padding:32px 28px;border-radius:30px;
  background:linear-gradient(145deg,rgba(4,20,34,.88),rgba(5,60,55,.55));
  border:1.5px solid rgba(255,255,255,.15);
  box-shadow:0 26px 80px rgba(0,0,0,.4),inset 0 0 0 1px rgba(92,255,141,.06);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:18px;
  backdrop-filter:blur(10px);
}
.farol-card.verde{border-color:rgba(92,255,141,.4);box-shadow:0 26px 80px rgba(0,0,0,.4),0 0 42px rgba(92,255,141,.18)}
.farol-card.amarelo{border-color:rgba(255,211,90,.4);box-shadow:0 26px 80px rgba(0,0,0,.4),0 0 42px rgba(255,211,90,.15)}
.farol-card.vermelho{border-color:rgba(255,90,90,.4);box-shadow:0 26px 80px rgba(0,0,0,.4),0 0 42px rgba(255,90,90,.15)}
.farol-card .farol-tag{
  display:inline-flex;align-self:flex-start;
  padding:8px 16px;border-radius:12px;
  font-size:14px;font-weight:1000;letter-spacing:.1em;text-transform:uppercase;
}
.farol-card.verde .farol-tag{background:rgba(92,255,141,.18);color:var(--green);border:1.5px solid rgba(92,255,141,.5)}
.farol-card.amarelo .farol-tag{background:rgba(255,211,90,.18);color:var(--yellow);border:1.5px solid rgba(255,211,90,.5)}
.farol-card.vermelho .farol-tag{background:rgba(255,90,90,.18);color:var(--red);border:1.5px solid rgba(255,90,90,.5)}
.farol-card h3{
  font-size:clamp(28px,2.4vw,40px);margin:0;font-weight:1000;line-height:1.1;
  text-shadow:0 4px 16px rgba(0,0,0,.55);
}
.farol-card .coord{font-size:15px;color:#a8bfcc;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.dual-progress{display:flex;gap:20px;margin-top:12px}
.dual-progress .col{flex:1;display:flex;flex-direction:column;gap:8px}
.dual-progress .col .lbl{
  font-size:14px;color:#a8bfcc;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;
}
.dual-progress .col .val{
  font-size:clamp(38px,3.8vw,64px);font-weight:1000;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em;
}
.dual-progress .col.prev .val{color:var(--cyan);text-shadow:0 0 24px rgba(57,215,255,.4)}
.dual-progress .col.real .val{color:var(--green);text-shadow:0 0 24px rgba(92,255,141,.45)}
.dual-progress .col .bar{
  height:14px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;
  position:relative;margin-top:4px;
}
.dual-progress .col .bar i{
  display:block;height:100%;width:0;border-radius:999px;
  transition:width 1.8s cubic-bezier(.16,1,.3,1);
  position:relative;
}
.dual-progress .col.prev .bar i{background:linear-gradient(90deg,var(--cyan),#7ee0ff);box-shadow:0 0 14px rgba(57,215,255,.6)}
.dual-progress .col.real .bar i{background:linear-gradient(90deg,var(--green),var(--lime));box-shadow:0 0 14px rgba(92,255,141,.7)}
.dual-progress .col .bar i:after{
  content:"";position:absolute;top:0;right:0;width:20px;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));
  animation:barGlow 2s ease-in-out infinite;
}
@keyframes barGlow{50%{transform:translateX(-8px);opacity:.7}}
.active .dual-progress .col .bar i{width:var(--w)}
.farol-card .diff{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;border-radius:12px;
  background:rgba(255,255,255,.05);
  font-weight:1000;font-size:15px;
  margin-top:4px;
}
.farol-card .diff.pos{color:var(--green);background:rgba(92,255,141,.10);border:1px solid rgba(92,255,141,.3)}
.farol-card .diff.neg{color:var(--red);background:rgba(255,90,90,.10);border:1px solid rgba(255,90,90,.3)}
.farol-card .diff.zero{color:var(--yellow);background:rgba(255,211,90,.10);border:1px solid rgba(255,211,90,.3)}
.farol-card .stats{
  display:flex;gap:10px;flex-wrap:wrap;padding-top:14px;
  border-top:1px solid rgba(255,255,255,.08);
  margin-top:auto;
}
.farol-card .stats .st{
  flex:1;min-width:80px;
  padding:12px;border-radius:14px;
  background:rgba(2,15,28,.55);
  text-align:center;
}
.farol-card .stats .st b{
  display:block;font-size:26px;color:#fff;font-weight:1000;
  font-variant-numeric:tabular-nums;line-height:1;margin-bottom:4px;
}
.farol-card .stats .st span{font-size:12px;color:#a8bfcc;font-weight:800;letter-spacing:.06em;text-transform:uppercase}

/* Métricas topo do farol */
.farol-topline{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.metric-big{
  padding:22px 24px;border-radius:22px;
  background:linear-gradient(145deg,rgba(2,13,24,.82),rgba(4,42,47,.42));
  border:1px solid rgba(255,255,255,.12);
  position:relative;overflow:hidden;
  backdrop-filter:blur(8px);
}
.metric-big:before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--green),transparent);
}
.metric-big small{
  display:block;letter-spacing:.14em;text-transform:uppercase;
  color:#b8ccdb;font-weight:1000;font-size:13px;
}
.metric-big strong{
  display:block;font-size:clamp(42px,4vw,68px);line-height:1;
  margin-top:8px;color:#fff;font-variant-numeric:tabular-nums;font-weight:1000;
}
.metric-big.good strong{color:var(--green);text-shadow:0 0 24px rgba(92,255,141,.4)}
.metric-big.warn strong{color:var(--yellow);text-shadow:0 0 24px rgba(255,211,90,.35)}
.metric-big.danger strong{color:var(--red);text-shadow:0 0 24px rgba(255,90,90,.4)}
.metric-big.cyan strong{color:var(--cyan);text-shadow:0 0 24px rgba(57,215,255,.4)}

/* ============================================================
   3. STATUS DAS OBRAS — cards GRANDES
============================================================ */
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;flex:1;align-items:stretch;min-height:0}
.status-card{
  padding:26px 28px;border-radius:28px;
  background:linear-gradient(145deg,rgba(4,20,34,.85),rgba(5,77,66,.5));
  border:1.5px solid rgba(255,255,255,.13);
  box-shadow:0 22px 64px rgba(0,0,0,.32);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:16px;
  backdrop-filter:blur(10px);
}
.status-card.verde{border-color:rgba(92,255,141,.4)}
.status-card.amarelo{border-color:rgba(255,211,90,.4)}
.status-card.vermelho{border-color:rgba(255,90,90,.4)}
.status-card h3{
  font-size:clamp(24px,2.2vw,34px);margin:0;font-weight:1000;line-height:1.15;
  text-shadow:0 4px 16px rgba(0,0,0,.55);
}
.status-card p{
  font-size:clamp(15px,1.15vw,20px);
  color:#e2f4fb;font-weight:600;line-height:1.45;margin:0;flex:1;
}
.status-card .foot-info{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:12px;border-top:1px solid rgba(255,255,255,.08);
  font-size:13px;color:#a8bfcc;font-weight:800;letter-spacing:.04em;
}
.status-card .days{
  font-size:15px;color:#fff;font-weight:1000;
  padding:6px 12px;border-radius:8px;
  background:rgba(255,255,255,.06);
}

/* ============================================================
   4. AGENDA SEMANAL — grid Segunda/Terça/etc VISÍVEL
============================================================ */
.agenda-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.agenda-head{
  display:grid;grid-template-columns:180px repeat(5,1fr);gap:14px;
  margin-bottom:14px;padding-bottom:14px;
  border-bottom:2px solid rgba(92,255,141,.25);
}
.agenda-head .col-lbl{
  font-size:clamp(18px,1.5vw,24px);
  font-weight:1000;color:var(--green);
  text-align:center;letter-spacing:.06em;text-transform:uppercase;
  padding:12px 8px;border-radius:14px;
  background:rgba(92,255,141,.1);border:1px solid rgba(92,255,141,.3);
  text-shadow:0 0 18px rgba(92,255,141,.4);
}
.agenda-head .col-lbl.pessoa{
  background:rgba(2,15,28,.55);border-color:rgba(255,255,255,.14);color:#d7eef6;
}
.agenda-row{
  display:grid;grid-template-columns:180px repeat(5,1fr);gap:14px;
  margin-bottom:12px;align-items:stretch;
}
.agenda-pessoa{
  display:flex;align-items:center;gap:12px;
  padding:16px 18px;border-radius:16px;
  background:linear-gradient(90deg,rgba(2,14,26,.78),rgba(2,14,26,.5));
  border:1px solid rgba(255,255,255,.1);
}
.agenda-avatar{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,#0f766e,#22c55e);
  display:grid;place-items:center;font-weight:1000;font-size:15px;color:#fff;
  border:2px solid rgba(255,255,255,.5);flex-shrink:0;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.agenda-pessoa b{font-size:16px;color:#fff;font-weight:1000;line-height:1.15}
.agenda-cell{
  padding:14px 12px;border-radius:14px;
  background:rgba(4,20,34,.72);
  border:1px solid rgba(255,255,255,.08);
  display:flex;flex-direction:column;justify-content:center;gap:4px;
  min-height:70px;
}
.agenda-cell.empty{background:rgba(2,8,20,.35);border-style:dashed;border-color:rgba(255,255,255,.06)}
.agenda-cell .obra{
  font-size:14px;font-weight:1000;color:var(--green);
  text-transform:uppercase;letter-spacing:.03em;line-height:1.1;
}
.agenda-cell .ativ{font-size:12px;color:#c5d8e2;font-weight:700;line-height:1.2;margin-top:2px}
.agenda-cell.empty:after{content:"—";color:rgba(255,255,255,.15);font-size:20px;font-weight:1000;text-align:center;display:block}

/* ============================================================
   5. ATIVIDADE DO DIA — timeline GRANDE
============================================================ */
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:36px;flex:1;align-items:center;min-height:0}
.split-txt{display:flex;flex-direction:column;justify-content:center}
.split-txt .headline-md{
  font-size:clamp(48px,5vw,90px);font-weight:1000;letter-spacing:-.05em;line-height:.9;margin:0 0 22px;
  text-shadow:0 8px 32px rgba(0,0,0,.55);
}
.split-txt .headline-md span{color:var(--green);display:block;text-shadow:0 0 50px rgba(92,255,141,.45)}
.split-txt .lead-p{
  font-size:clamp(19px,1.5vw,26px);color:#e8f5f9;font-weight:600;
  line-height:1.5;max-width:600px;margin:0 0 30px;
  text-shadow:0 4px 16px rgba(0,0,0,.5);
}
.timeline{display:grid;gap:14px;max-height:72vh;overflow:hidden;align-content:center}
.line-item{
  display:grid;grid-template-columns:200px 1fr auto;gap:24px;align-items:center;
  padding:22px 26px;border-radius:22px;
  background:linear-gradient(90deg,rgba(2,14,26,.82),rgba(2,14,26,.55));
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(6px);
}
.line-item .who{display:flex;align-items:center;gap:16px}
.line-item .avatar-mini{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#0f766e,#22c55e);
  display:grid;place-items:center;font-weight:1000;font-size:18px;color:#fff;
  border:2px solid rgba(255,255,255,.5);flex-shrink:0;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.line-item b{font-size:19px;color:#fff;font-weight:1000;line-height:1.15}
.line-item .info strong{font-size:24px;color:var(--green);font-weight:1000;display:block;line-height:1.15;text-shadow:0 0 20px rgba(92,255,141,.3)}
.line-item .info span{display:block;color:#c5d8e2;font-weight:700;margin-top:4px;font-size:16px}
.line-item .badge{
  padding:10px 16px;border-radius:12px;
  background:rgba(92,255,141,.14);border:1.5px solid rgba(92,255,141,.35);
  font-size:14px;font-weight:1000;color:var(--green);white-space:nowrap;letter-spacing:.05em;
}
.line-item .badge.placa{background:rgba(57,215,255,.12);border-color:rgba(57,215,255,.38);color:var(--cyan)}

/* ============================================================
   6. KPIs COORDENADORES — score GIGANTE
============================================================ */
.kpi-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;flex:1;align-items:stretch;margin-top:2vh;min-height:0}
.kpi-card{
  padding:32px;border-radius:34px;
  background:linear-gradient(145deg,rgba(2,15,28,.88),rgba(5,83,70,.55));
  border:1.5px solid rgba(92,255,141,.35);
  box-shadow:0 26px 80px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.03);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  backdrop-filter:blur(10px);
}
.kpi-card:before{
  content:"";position:absolute;top:-30%;right:-30%;width:80%;height:80%;
  background:radial-gradient(circle,rgba(92,255,141,.22),transparent 65%);
  animation:kpiGlow 5s ease-in-out infinite;
}
@keyframes kpiGlow{50%{transform:scale(1.15) rotate(20deg);opacity:.7}}
.kpi-head{display:flex;align-items:center;gap:20px;position:relative}
.avatar{
  width:88px;height:88px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#0f766e,#22c55e);
  font-size:32px;font-weight:1000;color:#fff;
  border:3px solid rgba(255,255,255,.55);
  box-shadow:0 12px 32px rgba(0,0,0,.45),0 0 28px rgba(92,255,141,.35);
  flex-shrink:0;
}
.kpi-card h3{
  font-size:clamp(28px,2.4vw,40px);margin:0;font-weight:1000;line-height:1.1;
  text-shadow:0 4px 16px rgba(0,0,0,.55);
}
.status-mini{
  font-size:14px;font-weight:1000;letter-spacing:.12em;text-transform:uppercase;margin-top:6px;
  display:inline-flex;padding:6px 14px;border-radius:10px;
}
.status-mini.excelente{background:rgba(92,255,141,.16);color:var(--green);border:1.5px solid rgba(92,255,141,.4)}
.status-mini.muito-bom{background:rgba(57,215,255,.14);color:var(--cyan);border:1.5px solid rgba(57,215,255,.4)}
.status-mini.bom{background:rgba(167,255,60,.14);color:var(--lime);border:1.5px solid rgba(167,255,60,.4)}
.status-mini.atencao{background:rgba(255,211,90,.16);color:var(--yellow);border:1.5px solid rgba(255,211,90,.42)}
.status-mini.critico{background:rgba(255,90,90,.16);color:var(--red);border:1.5px solid rgba(255,90,90,.42)}
.score{
  font-size:clamp(88px,8vw,132px);font-weight:1000;line-height:1;
  margin:32px 0 16px;color:var(--green);
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 50px rgba(92,255,141,.55);
  position:relative;letter-spacing:-.04em;
}
.score.warn{color:var(--yellow);text-shadow:0 0 50px rgba(255,211,90,.5)}
.score.danger{color:var(--red);text-shadow:0 0 50px rgba(255,90,90,.5)}
.kpi-card .kpi-bar{
  height:16px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;
  position:relative;
}
.kpi-card .kpi-bar i{
  display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--green),var(--lime));
  transition:width 1.8s cubic-bezier(.16,1,.3,1);
  box-shadow:0 0 16px rgba(92,255,141,.7);position:relative;
}
.kpi-card .kpi-bar i:after{
  content:"";position:absolute;top:0;right:0;width:24px;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));
  animation:barGlow 2s ease-in-out infinite;
}
.active .kpi-card .kpi-bar i{width:var(--w)}
.kpi-card .kpi-meta{
  margin-top:16px;color:#a8bfcc;font-size:14px;font-weight:800;
  letter-spacing:.05em;line-height:1.4;
}
.kpi-card .kpi-meta b{color:#fff;font-weight:1000}
.mini-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:20px;position:relative}
.mini-kpis span{
  border-radius:12px;text-align:center;padding:12px 4px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  font-weight:1000;font-size:11px;color:#daf7e6;letter-spacing:.06em;
}
.mini-kpis span b{
  display:block;font-size:22px;color:#fff;font-weight:1000;margin-bottom:3px;
  font-variant-numeric:tabular-nums;
}

/* ============================================================
   7. PRODUTO — device + callouts explicando funcionalidade
============================================================ */
.product{display:grid;grid-template-columns:1fr 1fr;gap:5vw;flex:1;align-items:center;min-height:0}
.product-txt{display:flex;flex-direction:column;justify-content:center}
.product-txt h2{
  font-size:clamp(46px,4.8vw,86px);font-weight:1000;letter-spacing:-.05em;line-height:.9;margin:0 0 20px;
  text-shadow:0 8px 32px rgba(0,0,0,.6);
}
.product-txt h2 em{font-style:normal;color:var(--green);display:block;text-shadow:0 0 50px rgba(92,255,141,.45)}
.product-txt p.desc{
  font-size:clamp(17px,1.35vw,22px);color:#e8f5f9;font-weight:600;line-height:1.45;
  max-width:640px;margin:0 0 22px;text-shadow:0 4px 14px rgba(0,0,0,.5);
}
.feature-list{display:flex;flex-direction:column;gap:11px}
.feature{
  display:flex;align-items:center;gap:16px;padding:14px 20px;
  border-radius:18px;background:rgba(2,15,28,.72);
  border:1.5px solid rgba(92,255,141,.24);
  font-weight:800;color:#e2f4fb;font-size:17px;
  backdrop-filter:blur(6px);
}
.feature .ico{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(92,255,141,.28),rgba(57,215,255,.14));
  border:1.5px solid rgba(92,255,141,.38);flex-shrink:0;font-size:22px;
}
/* Device (celular) com callouts */
.device-wrap{position:relative;display:flex;justify-content:center}
.device{
  position:relative;width:min(360px,80%);aspect-ratio:392/850;
  border-radius:48px;
  background:linear-gradient(135deg,#0a1526,#050f1c);
  padding:14px;
  box-shadow:0 40px 130px rgba(0,0,0,.7),0 0 80px rgba(92,255,141,.28),
             inset 0 0 0 1.5px rgba(92,255,141,.32),inset 0 0 0 3px rgba(0,0,0,.5);
}
.device:before{
  content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:130px;height:24px;background:#000;border-radius:14px;z-index:3;
}
.device-screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:#000;position:relative}
.device-screen video,.device-screen img{width:100%;height:100%;object-fit:cover;display:block}
.device-glow{
  position:absolute;inset:-50px;border-radius:80px;pointer-events:none;z-index:-1;
  background:radial-gradient(circle,rgba(92,255,141,.32),transparent 65%);
  animation:deviceGlow 4s ease-in-out infinite;
}
@keyframes deviceGlow{50%{transform:scale(1.15);opacity:.65}}
/* Callouts flutuando ao redor do device */
.callout{
  position:absolute;padding:14px 20px;border-radius:18px;
  background:rgba(2,15,28,.92);border:2px solid rgba(92,255,141,.5);
  color:#e2f4fb;font-weight:1000;font-size:15px;
  box-shadow:0 12px 32px rgba(0,0,0,.5),0 0 24px rgba(92,255,141,.3);
  backdrop-filter:blur(8px);animation:calloutIn .7s cubic-bezier(.16,1,.3,1) backwards;
  max-width:220px;
}
.callout .co-lbl{
  display:block;font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--green);margin-bottom:2px;
}
.callout .co-txt{color:#fff;font-weight:800;font-size:14px;line-height:1.3}
.callout:before{
  content:"";position:absolute;width:12px;height:12px;
  background:var(--green);border-radius:50%;box-shadow:0 0 20px var(--green);
  animation:blink 1.4s ease-in-out infinite;
}
.callout.top-left{top:8%;left:-6%;animation-delay:.6s}
.callout.top-left:before{right:-8px;top:50%;transform:translateY(-50%)}
.callout.mid-right{top:42%;right:-8%;animation-delay:.9s}
.callout.mid-right:before{left:-8px;top:50%;transform:translateY(-50%)}
.callout.bot-left{bottom:12%;left:-6%;animation-delay:1.2s}
.callout.bot-left:before{right:-8px;top:50%;transform:translateY(-50%)}
@keyframes calloutIn{from{opacity:0;transform:scale(.85) translateX(-10px)}to{opacity:1;transform:scale(1) translateX(0)}}

/* ============================================================
   8. TELEGRAM + IA (dedicada, com chat)
============================================================ */
.telegram-hi{display:grid;grid-template-columns:1fr .8fr;gap:5vw;flex:1;align-items:center;min-height:0}
.telegram-txt h2{
  font-size:clamp(48px,5vw,90px);font-weight:1000;letter-spacing:-.05em;line-height:.9;margin:0 0 18px;
  text-shadow:0 8px 32px rgba(0,0,0,.6);
}
.telegram-txt h2 span{color:var(--cyan);display:block;text-shadow:0 0 50px rgba(57,215,255,.5)}
.telegram-txt .desc{
  font-size:clamp(17px,1.35vw,22px);color:#e8f5f9;font-weight:600;line-height:1.4;
  margin-bottom:20px;max-width:620px;text-shadow:0 4px 14px rgba(0,0,0,.5);
}
.chat-preview{
  padding:20px;border-radius:22px;
  background:linear-gradient(145deg,rgba(2,15,28,.85),rgba(5,60,80,.5));
  border:1.5px solid rgba(57,215,255,.32);
  display:flex;flex-direction:column;gap:10px;
  backdrop-filter:blur(10px);
  box-shadow:0 30px 80px rgba(0,0,0,.4),0 0 42px rgba(57,215,255,.15);
}
.msg{
  padding:14px 18px;border-radius:16px;font-weight:700;
  font-size:16px;line-height:1.35;max-width:88%;
}
.msg.user{background:rgba(57,215,255,.18);border:1.5px solid rgba(57,215,255,.35);align-self:flex-end;color:#e0f7ff}
.msg.ai{background:rgba(92,255,141,.14);border:1.5px solid rgba(92,255,141,.35);align-self:flex-start;color:#e2f9ea}
.msg b{color:var(--cyan);font-weight:1000}
.msg.ai b{color:var(--green)}

/* ============================================================
   9. GOOGLE MAPS (dedicada)
============================================================ */
.gmaps-hi{display:grid;grid-template-columns:1fr 1fr;gap:5vw;flex:1;align-items:center;min-height:0}
.gmaps-txt h2{
  font-size:clamp(46px,4.8vw,86px);font-weight:1000;letter-spacing:-.05em;line-height:.9;margin:0 0 20px;
  text-shadow:0 8px 32px rgba(0,0,0,.6);
}
.gmaps-txt h2 span{color:var(--red);display:block;text-shadow:0 0 50px rgba(255,90,90,.4)}

/* ============================================================
   10. NÚMEROS QUE IMPRESSIONAM — Arquitetura completa
============================================================ */
.impress-hero{display:grid;grid-template-columns:1fr 1.15fr;gap:40px;flex:1;align-items:center;min-height:0}
.impress-txt h2{
  font-size:clamp(46px,4.8vw,84px);font-weight:1000;letter-spacing:-.05em;line-height:.9;margin:0 0 20px;
  text-shadow:0 8px 32px rgba(0,0,0,.6);
}
.impress-txt h2 span{color:var(--green);display:block;text-shadow:0 0 50px rgba(92,255,141,.45)}
.impress-txt .slogan{
  font-size:clamp(18px,1.4vw,24px);color:#e8f5f9;font-weight:600;line-height:1.5;
  padding:24px 28px;border-left:4px solid var(--green);
  background:linear-gradient(90deg,rgba(92,255,141,.1),transparent);
  border-radius:0 16px 16px 0;margin:24px 0;
  text-shadow:0 4px 14px rgba(0,0,0,.4);
}
.impress-txt .val{
  display:inline-flex;align-items:center;gap:14px;padding:18px 26px;
  border-radius:16px;background:rgba(92,255,141,.14);border:1.5px solid rgba(92,255,141,.42);
  font-weight:1000;color:var(--green);font-size:19px;
  box-shadow:0 0 32px rgba(92,255,141,.2);
}
.impress-txt .val small{color:#8aa5b4;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.12em}

.impress-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.impress-cell{
  padding:22px 18px;border-radius:22px;
  background:linear-gradient(145deg,rgba(2,13,24,.82),rgba(4,42,47,.5));
  border:1.5px solid rgba(92,255,141,.22);
  min-height:140px;display:flex;flex-direction:column;justify-content:center;
  position:relative;overflow:hidden;min-width:0;
  backdrop-filter:blur(6px);
}
.impress-cell:before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:.75;
}
.impress-cell strong{
  font-size:clamp(24px,2.4vw,44px);color:var(--green);display:block;
  font-weight:1000;line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 0 28px rgba(92,255,141,.4);
  white-space:nowrap;overflow:visible;letter-spacing:-.03em;
}
.impress-cell .lbl{
  font-weight:900;color:#dcebf2;text-transform:uppercase;
  letter-spacing:.08em;font-size:13px;margin-top:10px;display:block;
}
.impress-cell.cyan strong{color:var(--cyan);text-shadow:0 0 28px rgba(57,215,255,.4)}
.impress-cell.lime strong{color:var(--lime)}
.impress-cell.purple strong{color:var(--purple);text-shadow:0 0 28px rgba(168,85,247,.4)}
.impress-cell.orange strong{color:var(--orange);text-shadow:0 0 28px rgba(255,139,61,.4)}

.modules-strip{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.mod-chip{
  padding:10px 18px;border-radius:12px;
  background:rgba(2,15,28,.72);border:1.5px solid rgba(92,255,141,.32);
  font-weight:1000;font-size:14px;color:#e2f4fb;letter-spacing:.05em;
  backdrop-filter:blur(4px);
}
.mod-chip.hi{background:rgba(92,255,141,.18);color:var(--green);border-color:rgba(92,255,141,.5);box-shadow:0 0 24px rgba(92,255,141,.18)}

/* ============================================================
   11. SALA DA OBRA (mosaico fotos reais)
============================================================ */
.sala-obra{display:grid;grid-template-columns:1fr 1fr;gap:36px;flex:1;align-items:center;min-height:0}
.sala-txt{display:flex;flex-direction:column;justify-content:center}
.sala-txt h2{
  font-size:clamp(46px,4.8vw,86px);font-weight:1000;letter-spacing:-.05em;line-height:.9;margin:0 0 20px;
  text-shadow:0 8px 32px rgba(0,0,0,.6);
}
.sala-txt h2 em{font-style:normal;color:var(--green);display:block;text-shadow:0 0 50px rgba(92,255,141,.45)}
.sala-txt .desc{
  font-size:clamp(17px,1.35vw,22px);color:#e8f5f9;font-weight:600;line-height:1.45;
  max-width:560px;margin:0 0 20px;text-shadow:0 4px 14px rgba(0,0,0,.5);
}
.obra-mosaic{
  display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr;gap:14px;height:65vh;
}
.obra-mosaic .cell{
  border-radius:22px;overflow:hidden;position:relative;
  border:1.5px solid rgba(92,255,141,.32);
  box-shadow:0 22px 60px rgba(0,0,0,.45),0 0 42px rgba(92,255,141,.14);background:#000;
}
.obra-mosaic .cell:nth-child(1){grid-row:1/3}
.obra-mosaic .cell img{width:100%;height:100%;object-fit:cover;display:block;animation:kenBurns 18s ease-in-out infinite alternate}
.obra-mosaic .cell:nth-child(2) img{animation-delay:-6s}
.obra-mosaic .cell:nth-child(3) img{animation-delay:-12s}
.obra-mosaic .cell .cap{
  position:absolute;bottom:0;left:0;right:0;padding:14px 18px;
  background:linear-gradient(0deg,rgba(2,10,20,.95),transparent);
  font-size:15px;font-weight:1000;color:#fff;letter-spacing:.03em;
}
@keyframes kenBurns{0%{transform:scale(1.05) translate(0,0)}100%{transform:scale(1.2) translate(-2%,-3%)}}

const brDate = new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
const fmt = n => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const pct = n => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
const money = n => 'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const initials = s => String(s||'?').trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const chunk = (arr,n) => { const out=[]; for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n)); return out; };

async function getJson(url){try{const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return null;return await r.json();}catch(e){return null;}}
async function loadData(){
  const keys = Object.keys(API);
  const vals = await Promise.all(keys.map(k=>getJson(API[k])));
  let liveCount = 0;
  keys.forEach((k,i)=>{ if(vals[i]){ data[k]=vals[i]; liveCount++; } });
  window.__liveMode = liveCount>0;
}

/* FAROL — Previsto × Realizado destacado */
function scene_farol(){
  const obras = (data.farol.obras||[]).slice().sort((a,b)=>{
    // primeiro os verdes, depois amarelos, depois vermelhos
    const order = {verde:0,amarelo:1,vermelho:2};
    const oa = order[a.farol] ?? 3;
    const ob = order[b.farol] ?? 3;
    if(oa!==ob) return oa-ob;
    return (b.realizado||0)-(a.realizado||0);
  });
  const pages = chunk(obras,3); // 3 obras por slide pra ficar GRANDE
  if(pages.length===0) pages.push([]);

  return pages.map((page,pi)=>`
  <section class="scene" data-scene="farol">
    ${header('Gestão à Vista','Farol Executivo',`Previsto × Realizado • Página ${pi+1}/${pages.length}`)}
    <div class="body">
      <div class="farol-topline">
        <div class="metric-big good"><small>Obras ativas</small><strong data-count="${data.farol.total_obras||obras.length}">0</strong></div>
        <div class="metric-big good"><small>Verde</small><strong data-count="${data.farol.verde||0}">0</strong></div>
        <div class="metric-big warn"><small>Amarelo</small><strong data-count="${data.farol.amarelo||0}">0</strong></div>
        <div class="metric-big danger"><small>Vermelho</small><strong data-count="${data.farol.vermelho||0}">0</strong></div>
      </div>
      <div class="farol-hero">
        ${page.map(o=>{
          const prev = Number(o.previsto||0);
          const real = Number(o.realizado||o.real||0);
          const diff = real - prev;
          const diffCls = diff > 0.5 ? 'pos' : (diff < -0.5 ? 'neg' : 'zero');
          const diffSign = diff > 0 ? '+' : '';
          return `
          <div class="farol-card ${esc(o.farol||'')}">
            <span class="farol-tag">${esc((o.farol||'farol').toUpperCase())}</span>
            <h3>${esc(o.obra||o.nome)}</h3>
            ${o.coord?`<div class="coord">Coord: <b style="color:#fff">${esc(o.coord)}</b></div>`:''}
            <div class="dual-progress">
              <div class="col prev">
                <div class="lbl">Previsto</div>
                <div class="val">${pct(prev)}</div>
                <div class="bar" style="--w:${Math.min(100,prev)}%"><i></i></div>
              </div>
              <div class="col real">
                <div class="lbl">Realizado</div>
                <div class="val">${pct(real)}</div>
                <div class="bar" style="--w:${Math.min(100,real)}%"><i></i></div>
              </div>
            </div>
            <div class="diff ${diffCls}">
              ${diffCls==='pos'?'▲':diffCls==='neg'?'▼':'●'} ${diffSign}${diff.toFixed(1).replace('.',',')} p.p. ${diffCls==='pos'?'à frente':diffCls==='neg'?'atrás':'no ponto'}
            </div>
            <div class="stats">
              <div class="st"><b>${fmt(o.atividades?.total||o.total||0)}</b><span>Total</span></div>
              <div class="st"><b>${fmt(o.atividades?.concluidas||o.concluidas||0)}</b><span>Concluídas</span></div>
              <div class="st"><b>${fmt(o.atividades?.atrasadas||o.atrasadas||0)}</b><span>Atrasadas</span></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
    ${foot()}
  </section>`);
}

  return pages.map((page,pi)=>`

      <div class="farol-topline">
        <div class="metric-big good"><small>Ativas</small><strong data-count="${data.farol.total_obras||obras.length}">0</strong></div>
        <div class="metric-big good"><small>Atualizadas ≤7d</small><strong data-count="${ok}">0</strong></div>
        <div class="metric-big warn"><small>Pendentes</small><strong data-count="${pen}">0</strong></div>
        <div class="metric-big cyan"><small>Combustível/mês</small><strong style="font-size:clamp(24px,2.4vw,42px)">${money(data.kpi.combustivel||0)}</strong></div>

        ${page.map(o=>`

              <span class="farol-tag" style="font-size:12px;padding:5px 10px">${esc((o.farol||'').toUpperCase())}</span>

            <p>${esc(o.ultimo_status||o.status||'Status ainda não informado.')}</p>
            <div class="foot-info">
              <span>ÚLTIMA ATUALIZAÇÃO</span>
              <span class="days">${fmt(o.dias_sem_atualizacao??0)} DIA${(o.dias_sem_atualizacao??0)===1?'':'S'}</span>
            </div>
          </div>`).join('')}
      </div>
    </div>
    ${foot()}
  </section>`);
}

/* =====================================================
   RENDER + LOOP
===================================================== */
const stage = document.getElementById('stage');
const bgPhoto = document.getElementById('bg-photo');
let currentScenes = [];
let idx = 0;
let timer = null;

function render(){
  currentScenes = buildAllScenes();
  stage.innerHTML = currentScenes.join('');
  const total = currentScenes.length;
  document.querySelectorAll('.scene').forEach((sc,i)=>{
    const progEl = sc.querySelector('.progress');
    if(progEl){
      progEl.innerHTML = Array.from({length:total},(_,x)=>`<span class="dot ${x===i?'on':''}"></span>`).join('');
    }
  });
  startShow();
  tickClock();
}
function updateBg(sceneIdx){
  const sc = document.querySelectorAll('.scene')[sceneIdx];
  if(!sc) return;
  const ds = sc.dataset.scene;
  const src = BG_MAP[ds] || BG_MAP.hero;
  bgPhoto.style.backgroundImage = `url('${src}')`;
  bgPhoto.classList.remove('zoom');
  // trigger reflow pra reiniciar animação de zoom
  void bgPhoto.offsetWidth;
  bgPhoto.classList.add('zoom');
}
function getSceneVideo(scene){return scene?.querySelector('video[data-src],video[src]')||null}
function ensureVideoSource(video,preload='auto'){
  if(!video)return;
  video.preload=preload;
  if(!video.getAttribute('src')){
    const src=video.dataset.src;
    if(src){video.src=src;video.load()}
  }
}
function waitVideoReady(video,maxWait=3000){
  if(!video)return Promise.resolve();
  ensureVideoSource(video,'auto');
  if(video.readyState>=3)return Promise.resolve();
  return new Promise(resolve=>{
    let done=false;
    const finish=()=>{
      if(done)return;
      done=true;
      clearTimeout(to);
      video.removeEventListener('canplay',finish);
      resolve();
    };
    const to=setTimeout(finish,maxWait);
    video.addEventListener('canplay',finish,{once:true});
  });
}
function pauseInactiveVideos(activeScene){
  document.querySelectorAll('.scene video').forEach(v=>{
    if(!activeScene.contains(v)){try{v.pause()}catch(e){}}
  });
}
function preloadNextVideo(scenes,currentIndex){
  const next=scenes[(currentIndex+1)%scenes.length];
  const video=getSceneVideo(next);
  if(video)ensureVideoSource(video,'auto');
}
async function activateScene(scenes,newIndex,first=false){
  const previous=scenes[idx];
  if(!first&&previous){
    previous.classList.remove('active');
    previous.classList.add('exit-up');
    await new Promise(r=>setTimeout(r,450));
  }
  scenes.forEach(s=>s.classList.remove('active','exit-up'));
  idx=newIndex;
  const current=scenes[idx];
  current.classList.add('active');
  updateBg(idx);
  animateCounts();
  pauseInactiveVideos(current);
  preloadNextVideo(scenes,idx);

  const video=getSceneVideo(current);
  if(video){
    await waitVideoReady(video,3000);
    try{video.currentTime=0}catch(e){}
    try{await video.play()}catch(e){}
  }
}
function startShow(){
  const sc=[...document.querySelectorAll('.scene')];
  if(sc.length===0)return;
  if(timer){clearTimeout(timer);timer=null}
  idx=0;
  sc.forEach(s=>s.classList.remove('active','exit-up'));

  const cycle=async(first=false)=>{
    await activateScene(sc,idx,first);
    timer=setTimeout(async()=>{
      idx=(idx+1)%sc.length;
      await cycle(false);
    },SLIDE_DURATION);
  };
  cycle(true);
}
let clockTimer = null;
function tickClock(){
  const upd = ()=> document.querySelectorAll('[data-clock]').forEach(e=>{
    e.textContent = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  });
  upd();
  if(clockTimer) clearInterval(clockTimer);
  clockTimer = setInterval(upd, 500);
}

/* Contador slot-machine */
function animateCounts(){
  document.querySelectorAll('.active [data-count]').forEach(el=>{
    const end = Number(el.dataset.count||0);
    const isPct = el.classList.contains('score');
    const dur = 1600;
    const start = performance.now();
    function step(now){
      const p = Math.min(1,(now-start)/dur);
      if(p < 1){
        let val;
        if(p < 0.4){
          const cap = Math.round(end * (0.3 + p * 1.5));
          val = Math.floor(Math.random() * Math.min(cap, end));
        } else {
          const e = 1 - Math.pow(1-p,3);
          val = Math.round(end*e);
        }
        if(val > end) val = end;
        el.textContent = isPct ? val+'%' : fmt(val);
        requestAnimationFrame(step);
      } else {
        el.textContent = isPct ? end+'%' : fmt(end);
      }
    }
    requestAnimationFrame(step);
  });
}

/* Partículas de fundo (bem discreto) */
const c = document.getElementById('fx');
const ctx = c.getContext('2d');
let W,H,pts=[];
function resize(){
  W=c.width=innerWidth; H=c.height=innerHeight;
  const count = Math.min(40, Math.floor((W*H)/45000));
  pts = Array.from({length:count},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,r:Math.random()*1.1+.7}));
}
addEventListener('resize',resize);resize();
function anim(){
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<pts.length;i++){
    const p=pts[i];
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1;
    if(p.y<0||p.y>H)p.vy*=-1;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(92,255,141,.28)';ctx.fill();
    for(let j=i+1;j<pts.length;j++){
      const q=pts[j];const d=Math.hypot(p.x-q.x,p.y-q.y);
      if(d<170){
        ctx.strokeStyle=`rgba(57,215,255,${(1-d/170)*.12})`;
        ctx.lineWidth=1;ctx.beginPath();
        ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
      }
    }
  }
  requestAnimationFrame(anim);
}
anim();

/* Boot */
(async()=>{
  await loadData();
  render();
  setInterval(async()=>{
    await loadData();
    const savedIdx = idx;
    render();
    if(savedIdx < currentScenes.length){
      const sc = [...document.querySelectorAll('.scene')];
      sc.forEach(s=>s.classList.remove('active','exit-up'));
      idx = savedIdx;
      sc[idx].classList.add('active');
      updateBg(idx);
    }
  }, REFRESH_DATA);
})();
</script>
</body>
</html>
