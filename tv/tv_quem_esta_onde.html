<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="tv_style.css"><title>TV • Quem está onde</title></head><body><main class="page"><header class="top"><div class="brand"><div class="orb"></div><div><div class="kicker">Operação do dia</div><div class="title">Quem está onde?</div><div class="subtitle">Leitura executiva da Atividade do Dia</div></div></div><div class="clock"><div class="date"></div><div class="hour"></div></div></header><section id="stats" class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px"></section><section id="people" class="grid fade-pane" style="grid-template-columns:repeat(3,1fr)"></section><div class="footer-note" id="src">Carregando atividade do dia...</div></main><script src="tv_common.js"></script><script>
function ymd(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
async function atividade(){return await getJson(`${API_ROOT}/agenda/data/atividade_dia_${ymd()}.json`)}
function current(x){return (Array.isArray(x.execucoes)&&x.execucoes[0])||x.executado||x.execucao||x.planejado||x}
let pages=[],page=0;
function render(){const el=$('#people');el.classList.add('hide');setTimeout(()=>{const list=pages[page]||[];el.innerHTML=list.map((p,i)=>`<article class="glass card ${p.alerta?'warn':''}" style="--accent:${p.alerta?'#facc15':'#22c55e'};padding:25px;min-height:214px;animation-delay:${i*.07}s"><div class="pill ${p.viagem?'warn':'ok'}">${p.viagem?'🚗 Viagem':p.gestao?'📋 Gestão':'🏗️ Obra'}</div><h2 style="font-size:34px;margin:14px 0 8px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.nome}</h2><h3 style="font-size:22px;color:#b7ff43;text-transform:uppercase;line-height:1.1">${p.obra}</h3><p style="font-size:19px;font-weight:950;margin-top:12px;line-height:1.18">${p.atividade}</p><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><span class="pill">${p.horas}h</span>${p.carro?`<span class="pill">🚘 ${p.carro}</span>`:''}</div></article>`).join('')||'<div class="empty">Nenhuma atividade carregada para hoje.</div>';el.classList.remove('hide');$('#src').textContent=`Fonte: /api/agenda/data/atividade_dia_${ymd()}.json • Página ${page+1} de ${pages.length||1}`},240)}
async function main(){const j=await atividade(); const raw=Array.isArray(j.atividades)?j.atividades:arr(j); const pessoas=[]; raw.forEach(x=>{const execs=Array.isArray(x.execucoes)&&x.execucoes.length?x.execucoes:[current(x)]; execs.forEach(e=>{const nome=String(x.colaborador||x.nome||e.colaborador||'SEM NOME'); const obra=String(e.obra||x.obra||x.planejado?.obra||'OBRA NÃO INFORMADA'); const atividade=String(e.atividade||x.atividade||x.planejado?.atividade||'Atividade não informada'); pessoas.push({nome,obra,atividade,viagem:!!(e.viagem||x.viagem||x.planejado?.viagem),gestao:norm(atividade).includes('GESTAO')||norm(e.tipo).includes('GESTAO'),horas:e.horas||x.horas||x.carga||8,carro:e.carro||x.carro||x.placa||'',alerta:norm(obra).includes('NAO INFORMADA')||norm(atividade).includes('NAO INFORMADA')})})}); $('#stats').innerHTML=`<div class="metric glass"><span>Pessoas</span><b>${new Set(pessoas.map(p=>norm(p.nome))).size}</b><small>Na operação</small></div><div class="metric glass"><span>Linhas</span><b>${pessoas.length}</b><small>Atividades</small></div><div class="metric glass"><span>Viagens</span><b>${pessoas.filter(p=>p.viagem).length}</b><small>Programadas</small></div><div class="metric glass"><span>Data</span><b style="font-size:32px">${j.data||ymd()}</b><small>${j.diaSemana||''}</small></div>`; pages=chunk(pessoas,9); render(); if(pages.length>1)setInterval(()=>{page=(page+1)%pages.length;render()},9000)}
main().catch(e=>{$('#people').innerHTML='<div class="empty">Não consegui carregar atividade do dia.</div>';console.error(e)})
</script></body></html>
