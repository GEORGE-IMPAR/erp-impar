<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV • Quem está onde</title><style>
:root{--bg1:#06172f;--bg2:#0b3b6e;--bg3:#08746b;--ink:#f8fbff;--muted:#b6c7db;--green:#22c55e;--lime:#a3e635;--yellow:#facc15;--red:#ef4444;--blue:#38bdf8;--purple:#a855f7;--panel:rgba(2,8,23,.72);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 18% 8%,rgba(34,211,238,.18),transparent 30%),radial-gradient(circle at 82% 18%,rgba(163,230,53,.14),transparent 32%),linear-gradient(135deg,var(--bg1),var(--bg2) 45%,var(--bg3));}.page{width:100vw;height:100vh;padding:28px;position:relative;overflow:hidden}.page:before{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 0 43%,rgba(255,255,255,.07) 50%,transparent 57%);animation:sheen 9s linear infinite;pointer-events:none}@keyframes sheen{from{transform:translateX(-55%)}to{transform:translateX(55%)}}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px;position:relative;z-index:2}.brand{display:flex;align-items:center;gap:14px}.orb{width:64px;height:64px;border-radius:20px;background:conic-gradient(from 210deg,#22d3ee,#7c3aed,#fb7185,#facc15,#22c55e,#22d3ee);box-shadow:0 0 34px rgba(34,211,238,.35),inset 0 0 18px rgba(255,255,255,.22);animation:orb 5s linear infinite}@keyframes orb{to{filter:hue-rotate(360deg)}}.kicker{font-size:13px;color:var(--lime);font-weight:1000;letter-spacing:.22em;text-transform:uppercase}.title{font-size:42px;font-weight:1000;line-height:.96;text-transform:uppercase;text-shadow:0 8px 26px rgba(0,0,0,.36)}.subtitle{font-size:16px;color:#dbeafe;font-weight:850;margin-top:6px}.clock{text-align:right}.clock .date{font-size:15px;color:#b7ff43;font-weight:950}.clock .hour{font-size:42px;font-weight:1000;font-variant-numeric:tabular-nums}.grid{display:grid;gap:16px}.glass{background:linear-gradient(145deg,rgba(2,8,23,.78),rgba(7,44,55,.62));border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.34);border-radius:24px}.metric{padding:18px}.metric span{font-size:12px;color:#a9bad0;font-weight:1000;text-transform:uppercase;letter-spacing:.12em}.metric b{display:block;font-size:44px;line-height:1;color:#fff;margin-top:6px}.metric small{color:#dbeafe;font-weight:850}.ok{--accent:var(--green)}.warn{--accent:var(--yellow)}.bad{--accent:var(--red)}.card{position:relative;overflow:hidden;border-left:7px solid var(--accent,var(--green));animation:enter .65s ease both}.card.warn,.pulse-warn{animation:enter .65s ease both,pulseY 1.9s ease-in-out infinite}.card.bad,.pulse-bad{animation:enter .65s ease both,pulseR 1.25s ease-in-out infinite}@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.98);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}@keyframes pulseY{0%,100%{box-shadow:0 20px 55px rgba(0,0,0,.30),0 0 0 0 rgba(250,204,21,.24)}50%{box-shadow:0 20px 55px rgba(0,0,0,.30),0 0 0 9px rgba(250,204,21,.06)}}@keyframes pulseR{0%,100%{box-shadow:0 20px 55px rgba(0,0,0,.30),0 0 0 0 rgba(239,68,68,.28)}50%{box-shadow:0 20px 55px rgba(0,0,0,.30),0 0 0 10px rgba(239,68,68,.08)}}.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;background:rgba(2,8,23,.50);border:1px solid rgba(255,255,255,.13);font-size:11px;font-weight:1000;text-transform:uppercase;color:#dbeafe}.pill.ok{color:#bbf7d0;border-color:rgba(34,197,94,.36);background:rgba(34,197,94,.13)}.pill.warn{color:#fef08a;border-color:rgba(250,204,21,.38);background:rgba(250,204,21,.13)}.pill.bad{color:#fecaca;border-color:rgba(239,68,68,.40);background:rgba(239,68,68,.13)}.row{display:grid;grid-template-columns:86px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;background:rgba(2,8,23,.54);border:1px solid rgba(255,255,255,.10)}.row b{font-size:18px}.row small{display:block;color:#cbd5e1;font-weight:850;margin-top:2px}.empty{display:grid;place-items:center;text-align:center;color:#dbeafe;font-size:22px;font-weight:950;border:1px dashed rgba(163,230,53,.30);border-radius:24px;padding:28px;background:rgba(2,8,23,.38)}.footer-note{position:absolute;left:28px;bottom:18px;font-size:12px;color:#cbd5e1;font-weight:800}.big-icon{font-size:58px;margin-bottom:20px;filter:drop-shadow(0 10px 25px rgba(0,0,0,.35))}.bar{height:14px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#22c55e,#a3e635);width:var(--w,50%);box-shadow:0 0 18px rgba(34,197,94,.5)}.fade-pane{opacity:1;transition:opacity .45s ease,transform .45s ease}.fade-pane.hide{opacity:0;transform:translateX(-24px) scale(.985)}
</style></head><body>
<main class="page"><header class="top"><div class="brand"><div class="orb"></div><div><div class="kicker">Operação do Dia</div><div class="title">Quem está onde?</div><div class="subtitle">Fonte oficial: Atividade do Dia</div></div></div><div class="clock"><div class="date"></div><div class="hour"></div></div></header><section class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px" id="stats"></section><section class="grid fade-pane" style="grid-template-columns:repeat(3,1fr)" id="people"></section><div class="footer-note" id="src">Carregando atividade do dia...</div></main><script>
const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function tick(){const d=new Date(); const de=$('.date'), he=$('.hour'); if(de)de.textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}); if(he)he.textContent=d.toLocaleTimeString('pt-BR');} setInterval(tick,1000); addEventListener('DOMContentLoaded',tick);
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim()}
async function getJson(url){const r=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'}); if(!r.ok)throw new Error(url+' '+r.status); return r.json()}
function arr(x){return Array.isArray(x)?x:Array.isArray(x?.data)?x.data:Array.isArray(x?.data?.projetos)?x.data.projetos:Array.isArray(x?.projetos)?x.projetos:Array.isArray(x?.items)?x.items:Array.isArray(x?.itens)?x.itens:[]}
function money(n){return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function parseDate(s){if(!s)return null; const raw=String(s).trim(); const d=new Date(raw.replace(' ','T')); return isNaN(d)?null:d}
function daysSince(s){const d=parseDate(s); if(!d)return 9999; return Math.max(0,Math.floor((Date.now()-d.getTime())/86400000))}
function pick(o,keys,def=''){for(const k of keys){if(o&&o[k]!=null&&String(o[k]).trim()!=='')return o[k]}return def}
async function obrasAtivas(){const j=await getJson('https://api.erpimpar.com.br/cronograma/listar_obras.php');return arr(j).map(o=>({id:String(o.id||o.codigo||'').replace(/\D/g,'').padStart(3,'0'),nome:String(o.nome||o.obra||'').trim(),coord:String(o.coordenador||o.responsavel||o.coord||'').trim()})).filter(o=>o.id&&o.nome)}
async function tvProjetos(){for(const u of ['https://api.erpimpar.com.br/tv/listar.php','https://api.erpimpar.com.br/tv/data/projetos.json']){try{return arr(await getJson(u))}catch(e){}}return[]}
async function combustivelMes(){try{const j=await getJson('https://api.erpimpar.com.br/rh/combustivel/data/combustivel.json'); const ym=new Date().toISOString().slice(0,7); const items=[]; if(Array.isArray(j))items.push(...j); ['lancamentos','dados','data','items','registros'].forEach(k=>Array.isArray(j?.[k])&&items.push(...j[k])); let total=0; items.forEach(x=>{const data=String(x.data||x.date||x.dia||x.data_lancamento||''); if(!data||data.startsWith(ym)){let v=x.valor??x.value??x.total??x.valorTotal??0; if(typeof v==='string')v=Number(v.replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.')); total+=Number(v)||0;}}); return total}catch(e){return 0}}
async function atividadeHoje(){const d=new Date(); const ymd=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; try{return await getJson(`https://api.erpimpar.com.br/agenda/data/atividade_dia_${ymd}.json`)}catch(e){return {data:ymd,atividades:[]}}}
function currentItem(a){return (Array.isArray(a.execucoes)&&a.execucoes[0]) || a.executado || a.execucao || a.planejado || a;}
function normId(v){return String(v||'').replace(/\D/g,'').padStart(3,'0')}
</script><script>
let pages=[],page=0,timer=null;
function renderPage(){const el=$('#people');el.classList.add('hide');setTimeout(()=>{const list=pages[page]||[];el.innerHTML=list.map((p,i)=>`<article class="glass card ${p.obraNaoInformada?'warn':'ok'}" style="--accent:${p.obraNaoInformada?'#facc15':'#22c55e'};padding:24px;min-height:205px;animation-delay:${i*.07}s"><div class="pill ${p.viagem?'warn':'ok'}">${p.viagem?'🚗 Viagem':p.gestao?'📋 Gestão':'🏗️ Obra'}</div><h2 style="font-size:34px;margin:14px 0 10px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.nome}</h2><h3 style="font-size:22px;color:#b7ff43;text-transform:uppercase;line-height:1.08">${p.obra}</h3><p style="font-size:19px;font-weight:950;margin-top:12px;line-height:1.18">${p.atividade}</p><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><span class="pill">${p.horas||8}h</span>${p.motivo?`<span class="pill warn">Replanejado</span>`:''}</div></article>`).join('')||'<div class="empty">Nenhuma atividade carregada para hoje.</div>'; el.classList.remove('hide'); $('#src').textContent=`Fonte: /api/agenda/data/atividade_dia_${window.__dia||'hoje'}.json • Página ${page+1} de ${pages.length||1}`},240)}
async function main(){const j=await atividadeHoje(); window.__dia=j.data||''; let ats=Array.isArray(j.atividades)?j.atividades:arr(j); const pessoas=[]; ats.forEach(x=>{const execs=Array.isArray(x.execucoes)&&x.execucoes.length?x.execucoes:[currentItem(x)]; execs.forEach(e=>{const nome=String(x.colaborador||x.nome||e.colaborador||'SEM NOME'); const obra=String(e.obra||x.obra||x.planejado?.obra||'OBRA NÃO INFORMADA'); const atividade=String(e.atividade||x.atividade||x.planejado?.atividade||'Atividade não informada'); pessoas.push({nome,obra,atividade,viagem:!!(e.viagem||x.viagem||x.planejado?.viagem),gestao:norm(atividade).includes('GESTAO')||norm(e.tipo).includes('GESTAO'),horas:e.horas||x.horas||x.carga||8,motivo:x.motivo||'',obraNaoInformada:norm(obra).includes('NAO INFORMADA')})})});
$('#stats').innerHTML=`<div class="metric glass"><span>Pessoas</span><b>${new Set(pessoas.map(p=>norm(p.nome))).size}</b><small>Na operação</small></div><div class="metric glass"><span>Linhas</span><b>${pessoas.length}</b><small>Atividades</small></div><div class="metric glass"><span>Viagens</span><b>${pessoas.filter(p=>p.viagem).length}</b><small>Programadas</small></div><div class="metric glass"><span>Data</span><b style="font-size:32px">${j.data||'Hoje'}</b><small>${j.diaSemana||''}</small></div>`; pages=[]; for(let i=0;i<pessoas.length;i+=9)pages.push(pessoas.slice(i,i+9)); renderPage(); if(pages.length>1)timer=setInterval(()=>{page=(page+1)%pages.length;renderPage()},9000)}
main().catch(e=>{$('#people').innerHTML='<div class="empty">Não consegui carregar atividade do dia.</div>';console.error(e)})
</script></body></html>
