<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ERP ÍMPAR • TV Experience V3 Preview 2</title>
<style>
:root{--ink:#f4fbff;--muted:#d4e4ec;--green:#59ff8f;--lime:#a7ff3c;--cyan:#3bdcff;--yellow:#ffd35a;--red:#ff6464;--panel:rgba(3,13,25,.64);--line:rgba(255,255,255,.14);--glass:blur(18px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#020817;color:var(--ink)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#020817}.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transform:scale(1.04);filter:blur(16px);transition:opacity 1.15s cubic-bezier(.16,1,.3,1),transform 1.15s cubic-bezier(.16,1,.3,1),filter 1.15s cubic-bezier(.16,1,.3,1)}.scene.active{opacity:1;pointer-events:auto;transform:scale(1);filter:blur(0)}.scene.exit{opacity:0;transform:scale(.96) translateY(-42px);filter:blur(14px)}
.bg{position:absolute;inset:0;background:#020817}.bg:before{content:"";position:absolute;inset:-5%;background:var(--photo) center/cover no-repeat;filter:saturate(1.05) contrast(1.08) brightness(.74);transform:scale(1.08);animation:ken 22s ease-in-out infinite alternate}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,6,23,.95) 0%,rgba(2,20,27,.76) 38%,rgba(3,87,70,.42) 74%,rgba(3,87,70,.25)),radial-gradient(circle at 78% 22%,rgba(92,255,141,.28),transparent 28%),linear-gradient(180deg,rgba(2,6,23,.18),rgba(2,6,23,.78));}.blueprint{position:absolute;inset:0;opacity:.20;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(circle at 58% 48%,#000 0 58%,transparent 86%)}
.content{position:relative;z-index:5;height:100%;padding:5vh 4.4vw;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:18px}.orb{width:76px;height:76px;border-radius:24px;background:conic-gradient(from 210deg,#22c55e,#22d3ee,#3b82f6,#a855f7,#f97316,#facc15,#22c55e);box-shadow:0 22px 60px rgba(0,0,0,.45),0 0 38px rgba(92,255,141,.28);position:relative;animation:float 5.6s ease-in-out infinite}.orb:after{content:"";position:absolute;inset:10px;border-radius:20px;background:radial-gradient(circle at 28% 24%,rgba(255,255,255,.68),transparent 38%)}.kicker{font-size:14px;letter-spacing:.35em;color:var(--green);font-weight:1000;text-transform:uppercase}.title{font-size:clamp(38px,4.7vw,86px);line-height:.9;font-weight:1000;letter-spacing:-.06em;text-shadow:0 16px 50px rgba(0,0,0,.55)}.subtitle{font-size:clamp(16px,1.5vw,26px);font-weight:900;color:#d8eaf2;opacity:.94}.clock{text-align:right}.date{font-size:19px;font-weight:1000;color:var(--lime)}.time{font-size:56px;font-weight:1000;line-height:1;text-shadow:0 14px 38px rgba(0,0,0,.45)}
.center{flex:1;display:grid;align-items:center}.hero-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:5vw;align-items:center}.headline{font-size:clamp(56px,7vw,130px);font-weight:1000;letter-spacing:-.08em;line-height:.84;text-shadow:0 18px 60px rgba(0,0,0,.58)}.headline span{display:block;color:var(--green)}.lead{max-width:760px;margin-top:28px;font-size:clamp(18px,1.6vw,29px);line-height:1.42;font-weight:780;color:#dbeaf1}.chips{display:flex;gap:13px;flex-wrap:wrap;margin-top:34px}.chip{border:1px solid rgba(92,255,141,.28);background:rgba(2,16,28,.55);border-radius:999px;padding:12px 16px;font-weight:1000;color:#effff5;box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);backdrop-filter:var(--glass)}
.mock-network{height:62vh;border:1px solid rgba(92,255,141,.22);border-radius:44px;background:linear-gradient(145deg,rgba(2,8,23,.34),rgba(7,95,70,.20));box-shadow:0 0 50px rgba(92,255,141,.16),inset 0 0 90px rgba(57,215,255,.08);position:relative;overflow:hidden;backdrop-filter:blur(12px)}.node{position:absolute;width:128px;height:128px;border-radius:30px;background:rgba(2,13,25,.72);border:1px solid rgba(92,255,141,.32);display:grid;place-items:center;text-align:center;font-size:12px;font-weight:1000;box-shadow:0 22px 54px rgba(0,0,0,.38),0 0 28px rgba(92,255,141,.12);animation:pulse 3.2s ease-in-out infinite}.node b{font-size:34px;display:block;color:var(--green)}.node:nth-child(1){left:7%;top:13%}.node:nth-child(2){left:38%;top:6%;animation-delay:.2s}.node:nth-child(3){right:8%;top:17%;animation-delay:.4s}.node:nth-child(4){left:17%;bottom:10%;animation-delay:.6s}.node:nth-child(5){left:51%;bottom:16%;animation-delay:.8s}.node:nth-child(6){right:12%;bottom:8%;animation-delay:1s}.beam{position:absolute;height:2px;background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:.78;transform-origin:left center;animation:draw 3.8s ease-in-out infinite}.b1{width:31%;left:18%;top:26%;transform:rotate(-6deg)}.b2{width:33%;left:48%;top:27%;transform:rotate(12deg);animation-delay:.5s}.b3{width:34%;left:25%;bottom:31%;transform:rotate(-8deg);animation-delay:1s}.b4{width:28%;right:20%;bottom:27%;transform:rotate(8deg);animation-delay:1.5s}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:34px}.metric{padding:26px;border-radius:28px;background:rgba(2,13,24,.56);border:1px solid rgba(255,255,255,.13);backdrop-filter:var(--glass);box-shadow:0 20px 70px rgba(0,0,0,.32)}.metric small{display:block;letter-spacing:.16em;text-transform:uppercase;color:#b9ced9;font-weight:1000}.metric strong{display:block;font-size:clamp(48px,4.8vw,88px);line-height:1;margin-top:12px}.good strong{color:var(--green)}.warn strong{color:var(--yellow)}
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:30px}.story-card{min-height:245px;padding:27px;border-radius:30px;background:linear-gradient(145deg,rgba(2,13,24,.72),rgba(4,74,61,.38));border:1px solid rgba(255,255,255,.13);box-shadow:0 24px 72px rgba(0,0,0,.34);backdrop-filter:var(--glass);position:relative;overflow:hidden}.story-card:before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,rgba(92,255,141,.16),transparent 33%);animation:orbit 10s linear infinite}.story-card>*{position:relative}.tag{display:inline-flex;border:1px solid rgba(92,255,141,.28);border-radius:999px;padding:9px 13px;font-size:12px;font-weight:1000;color:var(--lime);background:rgba(92,255,141,.10);margin-bottom:18px}.story-card h3{font-size:clamp(28px,2.45vw,44px);line-height:1;margin:0 0 12px;font-weight:1000}.story-card p{font-size:18px;line-height:1.36;color:#dfedf3;font-weight:820}.bar{height:15px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--lime));border-radius:999px;transition:width 1.4s ease}.active .bar i{width:var(--w,0%)}
.split{display:grid;grid-template-columns:.94fr 1.06fr;gap:4vw;align-items:center;height:100%}.floating-photo{height:68vh;border-radius:46px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.16);box-shadow:0 34px 110px rgba(0,0,0,.48);background:rgba(2,13,24,.48);backdrop-filter:blur(14px)}.floating-photo:before{content:"";position:absolute;inset:-4%;background:var(--photo) center/cover no-repeat;filter:brightness(.82) contrast(1.05) saturate(1.06);transform:scale(1.06);animation:ken 20s ease-in-out infinite alternate}.floating-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,6,23,.58),transparent 45%,rgba(8,115,85,.22)),linear-gradient(0deg,rgba(2,6,23,.86),transparent 55%)}.glass-box{position:absolute;z-index:4;left:34px;right:34px;bottom:34px;padding:24px;border-radius:28px;background:rgba(2,12,22,.56);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px)}.glass-box h3{font-size:42px;margin:0 0 8px}.glass-box p{font-size:19px;color:#dcebf2;font-weight:760;line-height:1.35}
.timeline{display:grid;gap:14px;max-height:70vh;overflow:hidden}.line-item{display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:start;padding:19px 22px;border-radius:23px;background:rgba(2,13,24,.56);border:1px solid rgba(255,255,255,.11);backdrop-filter:var(--glass);box-shadow:0 18px 50px rgba(0,0,0,.25)}.line-item b{font-size:18px;color:var(--green);text-transform:uppercase}.line-item strong{font-size:24px;line-height:1.1}.line-item span{display:block;color:#d4e4ec;font-weight:760;margin-top:5px;line-height:1.28}
.kpi-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:34px}.kpi-card{padding:32px;border-radius:34px;background:rgba(2,13,24,.62);border:1px solid rgba(92,255,141,.25);box-shadow:0 24px 80px rgba(0,0,0,.32);backdrop-filter:var(--glass)}.kpi-head{display:flex;align-items:center;gap:18px}.avatar{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#0f766e,#22c55e);font-size:27px;font-weight:1000;border:2px solid rgba(255,255,255,.55)}.kpi-card h3{font-size:36px;margin:0}.score{font-size:clamp(72px,6vw,112px);font-weight:1000;line-height:.95;margin:28px 0 14px;color:var(--green);text-shadow:0 0 34px rgba(92,255,141,.16)}.mini-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}.mini-kpis span{border-radius:18px;text-align:center;padding:14px 8px;background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.11);font-weight:1000;font-size:16px;color:#eafff0}.mini-kpis small{display:block;color:#b7d0dc;font-size:10px;letter-spacing:.10em;text-transform:uppercase;margin-bottom:5px}.mini-kpis b{font-size:22px;color:var(--green)}
.tech-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:stretch;margin-top:34px}.tech-main{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.tech-big{padding:30px;border-radius:28px;background:rgba(244,248,252,.93);color:#0b172a;box-shadow:0 24px 70px rgba(0,0,0,.30);border-top:4px solid #2f7fff;text-align:center}.tech-big .icon{font-size:36px}.tech-big strong{display:block;font-size:68px;line-height:1;margin:16px 0 8px;font-weight:1000;color:#10192d}.tech-big span{display:block;color:#52647c;font-weight:850}.tech-list{display:grid;gap:14px}.tech-row{padding:17px 20px;border-radius:22px;background:rgba(2,13,24,.58);border:1px solid rgba(255,255,255,.13);backdrop-filter:var(--glass);font-weight:950;display:flex;align-items:center;justify-content:space-between}.tech-row b{font-size:26px;color:var(--green)}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-top:46px}.flow-card{min-height:150px;border-radius:24px;background:rgba(244,248,252,.92);color:#10192d;display:grid;place-items:center;text-align:center;padding:18px;font-weight:1000;box-shadow:0 20px 60px rgba(0,0,0,.25)}.flow-card .fi{font-size:34px;color:#2f7fff}.flow-card small{display:block;margin-top:8px;color:#53657b;font-weight:800}
.footer{position:absolute;left:4.4vw;right:4.4vw;bottom:3.8vh;z-index:8;display:flex;align-items:center;justify-content:space-between;color:#cbdce6;font-weight:900}.progress{display:flex;gap:10px}.dot{width:54px;height:5px;border-radius:999px;background:rgba(255,255,255,.26)}.dot.on{background:linear-gradient(90deg,var(--green),var(--cyan))}
@keyframes ken{to{transform:scale(1.16) translate3d(-1.5%,1.5%,0)}}@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}@keyframes pulse{50%{transform:translateY(-7px);box-shadow:0 28px 70px rgba(0,0,0,.46),0 0 42px rgba(92,255,141,.22)}}@keyframes draw{0%,100%{opacity:.22;clip-path:inset(0 100% 0 0)}50%{opacity:.9;clip-path:inset(0 0 0 0)}}@keyframes orbit{to{transform:rotate(360deg)}}
@media(max-width:1100px){.hero-grid,.split,.tech-layout{grid-template-columns:1fr}.kpi-wrap,.card-grid,.metric-grid{grid-template-columns:1fr 1fr}.floating-photo{height:36vh}.mini-kpis{grid-template-columns:repeat(5,1fr)}.flow{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="stage" id="stage"></div>
<script>
const API={farol:'https://api.erpimpar.com.br/tv/farol_resumo.php',atividade:'https://api.erpimpar.com.br/tv/atividade_dia_resumo.php',agenda:'https://api.erpimpar.com.br/tv/agenda_semanal_resumo.php',status:'https://api.erpimpar.com.br/tv/status_tv_resumo.php',kpi:'https://api.erpimpar.com.br/tv/kpi_resumo.php',tech:'https://api.erpimpar.com.br/tv/tecnologia_resumo.php'};
const P={hero:'url(https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=2200&q=85)',mat:'url(https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=2200&q=85)',status:'url(https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=2200&q=85)',agenda:'url(https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=2200&q=85)',atividade:'url(https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=2200&q=85)',kpi:'url(https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=2200&q=85)',tech:'url(https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=2200&q=85)',flow:'url(https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=2200&q=85)'};
let data={farol:{},atividade:{},agenda:{},status:{},kpi:{},tech:{}};const stage=document.getElementById('stage');const brDate=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});const fmt=n=>Number(n||0).toLocaleString('pt-BR');const pct=n=>(Number(n||0)).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function getJson(url){try{const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});return await r.json()}catch(e){return null}}
async function load(){const keys=Object.keys(API);const vals=await Promise.all(keys.map(k=>getJson(API[k])));keys.forEach((k,i)=>{if(vals[i])data[k]=vals[i]});render();}
function bg(photo){return `<div class="bg" style="--photo:${photo}"></div><div class="blueprint"></div>`}
function header(k,t,s){return `<div class="top"><div class="brand"><div class="orb"></div><div><div class="kicker">${k}</div><div class="title">${t}</div><div class="subtitle">${s}</div></div></div><div class="clock"><div class="date">${brDate.format(new Date())}</div><div class="time" data-clock></div></div></div>`}
function foot(i,total){return `<div class="footer"><div>ERP ÍMPAR • Gestão inteligente em tempo real</div><div class="progress">${Array.from({length:total},(_,x)=>`<span class="dot ${x===i?'on':''}"></span>`).join('')}</div><div>${i+1}/${total}</div></div>`}
function hero(i,t){return `<section class="scene">${bg(P.hero)}<div class="content">${header('ERP ÍMPAR','Experience V3','Centro Integrado de Gestão de Obras')}<div class="center hero-grid"><div><div class="headline">Do orçamento à entrega, <span>tudo conectado.</span></div><p class="lead">Uma plataforma viva para planejamento, execução, materiais, RDO, indicadores e gestão à vista em tempo real.</p><div class="chips"><span class="chip">Cronograma</span><span class="chip">Agenda</span><span class="chip">RDO</span><span class="chip">KPIs</span><span class="chip">TV Corporativa</span></div></div><div class="mock-network"><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div><div class="beam b4"></div><div class="node"><div><b>01</b>Orçamento</div></div><div class="node"><div><b>02</b>Documentos</div></div><div class="node"><div><b>03</b>Compras</div></div><div class="node"><div><b>04</b>Cronograma</div></div><div class="node"><div><b>05</b>RDO</div></div><div class="node"><div><b>06</b>KPIs</div></div></div></div>${foot(i,t)}</div></section>`}
function plataforma(i,t){return `<section class="scene">${bg(P.mat)}<div class="content">${header('Centro Integrado','Materiais','Solicitação • Compras • Estoque • Curva ABC • C.I.M')}<div class="center split"><div><div class="headline" style="font-size:clamp(52px,6vw,112px)">Da obra para compras, <span>com rastreabilidade.</span></div><p class="lead">Solicitação 2.0 por centro de custo, aprovação, compras, recebimento por DANFE e histórico de preços.</p><div class="chips"><span class="chip">📦 Solicitação 2.0</span><span class="chip">🛒 Compras</span><span class="chip">📊 Curva ABC</span><span class="chip">📥 C.I.M</span></div></div><div class="floating-photo" style="--photo:${P.mat}"><div class="glass-box"><h3>Fluxo completo</h3><p>Material pedido na obra, comprado com controle e recebido com conferência.</p></div></div></div>${foot(i,t)}</div></section>`}
function status(i,t){const obras=(data.status.obras||data.status.items||[]);const ok=obras.filter(o=>String(o.ultimo_status||o.status||'').trim()).length;const total=data.farol.total_obras||obras.length;return `<section class="scene">${bg(P.status)}<div class="content">${header('Gestão à vista','Status das Obras','Último status digitado pelos coordenadores • dados reais da TV')}<div class="center"><div class="metric-grid"><div class="metric good"><small>Obras ativas</small><strong>${fmt(total)}</strong></div><div class="metric good"><small>Status localizados</small><strong>${fmt(ok)}</strong></div><div class="metric warn"><small>Acompanhar</small><strong>${fmt(Math.max(0,total-ok))}</strong></div><div class="metric"><small>Combustível mês</small><strong>R$ ${Number(data.kpi.combustivel||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</strong></div></div><div class="card-grid">${obras.slice(0,6).map(o=>`<div class="story-card"><span class="tag">${esc(o.farol||'TV')}</span><h3>${esc(o.obra||o.nome)}</h3><p>${esc(o.ultimo_status||o.status||'Status ainda não informado.')}</p></div>`).join('')}</div></div>${foot(i,t)}</div></section>`}
function farol(i,t){const obras=(data.farol.obras||[]).slice().sort((a,b)=>(b.previsto||0)-(a.previsto||0)).slice(0,6);return `<section class="scene">${bg(P.flow)}<div class="content">${header('Obras','Farol Executivo','Percentuais, prazos e atividades consolidadas pelo cronograma')}<div class="center"><div class="card-grid">${obras.map(o=>`<div class="story-card"><span class="tag">${esc(o.status||o.farol||'Farol')}</span><h3>${esc(o.obra||o.nome)}</h3><p>Previsto ${pct(o.previsto)} • Realizado ${pct(o.realizado||o.real)}</p><div class="bar" style="--w:${Math.max(0,Math.min(100,o.realizado||o.real||0))}%"><i></i></div><p style="margin-top:16px">Total ${fmt(o.atividades?.total||o.total||0)} • Atrasadas ${fmt(o.atividades?.atrasadas||o.atrasadas||0)} • Concluídas ${fmt(o.atividades?.concluidas||o.concluidas||0)}</p></div>`).join('')}</div></div>${foot(i,t)}</div></section>`}
function agenda(i,t){const col=(data.agenda.colaboradores||[]).slice(0,9);return `<section class="scene">${bg(P.agenda)}<div class="content">${header('Planejamento','Agenda da Semana','Equipe, obras e atividades planejadas para execução')}<div class="center split"><div class="floating-photo" style="--photo:${P.agenda}"><div class="glass-box"><h3>Planejamento vivo</h3><p>Equipe conectada ao cronograma, com visão semanal e execução diária.</p></div></div><div class="timeline">${col.map(c=>{let dias=['segunda','terca','quarta','quinta','sexta'];let arr=dias.flatMap(d=>Array.isArray(c[d])?c[d]:[]);let a=arr[0]||{};return `<div class="line-item"><b>${esc(c.nome)}</b><div><strong>${esc(a.obra||'Planejamento semanal')}</strong><span>${esc(a.atividade||a.ativ||'Atividades distribuídas na semana')}</span></div></div>`}).join('')}</div></div>${foot(i,t)}</div></section>`}
function atividade(i,t){const eq=(data.atividade.equipes||data.atividade.colaboradores||[]).slice(0,8);return `<section class="scene">${bg(P.atividade)}<div class="content">${header('Operação','Atividade do Dia','Resumo operacional igual ao relatório de impressão')}<div class="center split"><div><div class="headline" style="font-size:clamp(52px,6vw,108px)">Quem está <span>onde?</span></div><p class="lead">Alocação diária, carros, obras e atividades em execução — leitura rápida para a operação.</p></div><div class="timeline">${eq.map(e=>`<div class="line-item"><b>${esc(e.nome)}</b><div><strong>${esc(e.obra||'Obra não informada')}</strong><span>${esc(e.atividade||'Atividade não informada')} ${e.placa?'• '+esc(e.placa):''}</span></div></div>`).join('')}</div></div>${foot(i,t)}</div></section>`}
function kpi(i,t){const coords=(data.kpi.coordenadores||[]).slice(0,3);return `<section class="scene">${bg(P.kpi)}<div class="content">${header('Performance','KPIs dos Coordenadores','Resumo executivo • score ponderado • indicadores individuais')}<div class="center"><div class="kpi-wrap">${coords.map(c=>`<div class="kpi-card"><div class="kpi-head"><div class="avatar">${esc((c.nome||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2))}</div><div><h3>${esc(c.nome)}</h3><span class="tag">${esc(c.status||'Indicador')}</span></div></div><div class="score" data-count="${Number(c.percentual||c.score||0)}">0%</div><div class="bar" style="--w:${Number(c.percentual||c.score||0)}%"><i></i></div><div class="mini-kpis"><span><small>QPI 1</small><b>${fmt(c.kpi1||0)}%</b></span><span><small>QPI 2</small><b>${fmt(c.kpi2||0)}%</b></span><span><small>QPI 3</small><b>${fmt(c.kpi3||0)}%</b></span><span><small>QPI 4</small><b>${fmt(c.kpi4||0)}%</b></span><span><small>QPI 5</small><b>${fmt(c.kpi5||0)}%</b></span></div></div>`).join('')}</div></div>${foot(i,t)}</div></section>`}
function tech(i,t){let x=data.tech||{};return `<section class="scene">${bg(P.tech)}<div class="content">${header('Tecnologia','Números que Impressionam','Arquitetura, APIs, integrações e evolução contínua')}<div class="center"><div class="tech-layout"><div class="tech-main"><div class="tech-big"><div class="icon">📄</div><strong>${fmt(x.arquivos||1452)}</strong><span>Arquivos totais</span></div><div class="tech-big"><div class="icon">&lt;/&gt;</div><strong>${fmt(x.linhas_codigo||388584)}</strong><span>Linhas totais</span></div><div class="tech-big"><div class="icon">🌐</div><strong>${fmt(x.github||598)}</strong><span>Arquivos GitHub</span></div><div class="tech-big"><div class="icon">🖥️</div><strong>${fmt(x.api||854)}</strong><span>Arquivos KingHost/API</span></div></div><div class="tech-list"><div class="tech-row">HTML / UI <b>194</b></div><div class="tech-row">JavaScript <b>88</b></div><div class="tech-row">PHP / API <b>${fmt(x.php||459)}</b></div><div class="tech-row">JSON / dados <b>${fmt(x.json||151)}</b></div><div class="tech-row">PWA na obra <b>ON</b></div><div class="tech-row">Office 365 + Graph <b>ON</b></div></div></div></div>${foot(i,t)}</div></section>`}
function arquitetura(i,t){return `<section class="scene">${bg(P.flow)}<div class="content">${header('Arquitetura','Fluxo de Dados','Da obra ao dashboard, tudo conectado')}<div class="center"><div class="flow"><div class="flow-card"><div><div class="fi">👥</div>Usuário / Coordenador / TV<small>Interface de entrada</small></div></div><div class="flow-card"><div><div class="fi">🌐</div>www.erpimpar.com.br<small>GitHub • HTML/CSS/JS</small></div></div><div class="flow-card"><div><div class="fi">🖥️</div>api.erpimpar.com.br<small>KingHost • PHP</small></div></div><div class="flow-card"><div><div class="fi">🗄️</div>JSON / Storage / DOCX / PDF<small>Persistência</small></div></div><div class="flow-card"><div><div class="fi">📊</div>Dashboards / TV / Office 365<small>Visualização</small></div></div></div></div>${foot(i,t)}</div></section>`}
function render(){const scenes=[hero,plataforma,status,farol,agenda,atividade,kpi,tech,arquitetura];stage.innerHTML=scenes.map((fn,i)=>fn(i,scenes.length)).join('');start();tickClock();animateCounts()}
let idx=0,timer=null;function start(){const sc=[...document.querySelectorAll('.scene')];idx=0;sc[0]?.classList.add('active');clearInterval(timer);timer=setInterval(()=>{sc[idx].classList.remove('active');sc[idx].classList.add('exit');idx=(idx+1)%sc.length;setTimeout(()=>{sc.forEach(s=>s.classList.remove('exit'));sc[idx].classList.add('active');animateCounts()},430)},15000)}
function tickClock(){const f=()=>document.querySelectorAll('[data-clock]').forEach(e=>e.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));f();setInterval(f,500)}
function animateCounts(){document.querySelectorAll('.active [data-count]').forEach(el=>{let end=Number(el.dataset.count||0),n=0,step=Math.max(1,end/45);let it=setInterval(()=>{n+=step;if(n>=end){n=end;clearInterval(it)}el.textContent=Math.round(n)+'%'},20)})}
const c=document.getElementById('fx'),ctx=c.getContext('2d');let W,H,pts=[];function resize(){W=c.width=innerWidth;H=c.height=innerHeight;pts=Array.from({length:82},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28}))}addEventListener('resize',resize);resize();function anim(){ctx.clearRect(0,0,W,H);pts.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,1.6,0,Math.PI*2);ctx.fillStyle='rgba(92,255,141,.38)';ctx.fill();for(let j=i+1;j<pts.length;j++){let q=pts[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<145){ctx.strokeStyle=`rgba(57,215,255,${(1-d/145)*.16})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}}});requestAnimationFrame(anim)}anim();load();setInterval(load,5*60*1000);
</script>
