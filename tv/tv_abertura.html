<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="tv_style.css"><title>TV • Abertura</title><style>.hero{height:calc(100vh - 56px);display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center}.hero h1{font-size:70px;line-height:.95;text-transform:uppercase}.hero h1 span{display:block;color:#57f287}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:30px}.step{padding:16px;border-radius:22px;background:rgba(2,8,23,.55);border:1px solid rgba(34,197,94,.22);text-align:center;animation:enter .6s both}.step b{display:block;font-size:26px}.art{height:560px;border-radius:34px;background:radial-gradient(circle at 45% 35%,rgba(34,197,94,.22),transparent 38%),linear-gradient(145deg,rgba(2,8,23,.62),rgba(7,44,55,.42));border:1px solid rgba(255,255,255,.14);position:relative;overflow:hidden}.building{position:absolute;right:100px;bottom:60px;width:210px;height:360px;border:2px solid rgba(125,211,252,.22);transform:skewY(-6deg);background:rgba(56,189,248,.08)}.building:before{content:"";position:absolute;inset:28px;background:repeating-linear-gradient(to bottom,transparent 0 36px,rgba(191,219,254,.28) 38px 41px),repeating-linear-gradient(to right,transparent 0 42px,rgba(191,219,254,.20) 44px 47px)}.orbit{position:absolute;inset:80px 0 0 -60px;border-top:6px solid #22c55e;border-radius:50%;transform:rotate(-16deg);filter:drop-shadow(0 0 16px #22c55e)}</style></head><body><main class="page"><div class="hero"><section><div class="brand"><div class="orb"></div><div><div class="kicker">ERP ÍMPAR</div><div class="title">Centro Integrado</div></div></div><h1 style="margin-top:30px">Do orçamento à entrega,<span>tudo conectado.</span></h1><p style="font-size:24px;color:#dbeafe;font-weight:800;margin-top:24px;line-height:1.45">Uma plataforma integrada para orçamento, documentos, compras, cronograma, RDO, RH, empreiteiros, KPIs e gestão à vista.</p><div class="flow">${''}</div></section><section class="art"><div class="building"></div><div class="orbit"></div></section></div><div class="footer-note">ERP ÍMPAR • gestão inteligente em tempo real</div></main><script src="tv_common.js"></script><script>const itens=['💰 Orçamento','📄 Documentos','📊 Cronograma','📺 TV','📋 RDO','📈 KPI'];document.querySelector('.flow').innerHTML=itens.map((x,i)=>`<div class="step" style="animation-delay:${i*.08}s"><b>${x.split(' ')[0]}</b><span>${x.substring(2)}</span></div>`).join('')</script></body></html>
