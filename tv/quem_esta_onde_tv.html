<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>ERP ÍMPAR • Quem está onde?</title><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#eef6ff;background:linear-gradient(120deg,#071a3b,#0b2a5a,#075f5a);padding:14px}.top{height:88px;border:1px solid rgba(34,197,94,.45);border-radius:20px;background:rgba(2,8,23,.45);display:flex;align-items:center;justify-content:space-between;padding:16px 22px}h1{font-size:48px;line-height:1;font-weight:1000}.sub{font-weight:900;color:#cbd5e1}.kpis{display:flex;gap:12px}.kpi{min-width:140px;background:rgba(2,8,23,.55);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px}.kpi b{font-size:34px}.kpi span{display:block;font-size:10px;font-weight:950;color:#a9bad0;text-transform:uppercase}.grid{height:calc(100vh - 110px);display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.card{border:1px solid rgba(34,211,238,.45);border-radius:18px;background:rgba(2,8,23,.55);padding:20px;display:flex;flex-direction:column;gap:8px;overflow:hidden}.name{font-size:30px;font-weight:1000;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.obra{font-size:20px;font-weight:1000;text-transform:uppercase;color:#fff}.ativ{font-size:16px;font-weight:850;color:#dbeafe;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.pill{border-radius:999px;padding:6px 9px;background:rgba(96,165,250,.14);border:1px solid rgba(96,165,250,.3);font-size:11px;font-weight:950}.trip{background:rgba(59,130,246,.25)}.warn{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#fecaca}</style></head><body><section class="top"><div><h1>Quem está onde?</h1><div class="sub" id="sub">Base: atividade do dia</div></div><div class="kpis"><div class="kpi"><span>Pessoas</span><b id="kpP">0</b></div><div class="kpi"><span>Obras</span><b id="kpO">0</b></div><div class="kpi"><span>Linhas</span><b id="kpL">0</b></div></div></section><main class="grid" id="grid"></main><script>
const API='https://api.erpimpar.com.br/api/agenda/data/';
function hoje(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function arr(v){return Array.isArray(v)?v:(v?[v]:[])} function txt(v){return String(v??'').trim()}
function nomesDe(r){return arr(r.nomes||r.colaboradores||r.pessoas||r.nome||r.colaborador).map(x=>typeof x==='string'?x:(x.nome||x.name)).filter(Boolean)}
function obraDe(r){return txt(r.obra||r.obraNome||r.nome_obra||r.projeto||r.local||'Obra não informada')}
function ativDe(r){return txt(r.atividade||r.atividadeNome||r.descricao||r.tarefa||'Atividade não informada')}
async function load(){let data=hoje(), j={};try{let r=await fetch(API+'atividade_dia_'+data+'.json?t='+Date.now(),{cache:'no-store'});j=await r.json()}catch(e){}let linhas=arr(j.atividades||j.data||j.linhas||j.items);let pessoas=[];linhas.forEach(l=>{const ns=nomesDe(l);if(!ns.length&&txt(l.nome))ns.push(txt(l.nome));ns.forEach(n=>pessoas.push({nome:n,obra:obraDe(l),ativ:ativDe(l),viagem:!!(l.viagem||l.travel),horas:txt(l.horas||l.carga||'')}))});let obras=new Set(pessoas.map(p=>p.obra).filter(x=>x&&x!=='Obra não informada'));kpP.textContent=new Set(pessoas.map(p=>p.nome)).size;kpO.textContent=obras.size;kpL.textContent=pessoas.length;sub.textContent=`Base: atividade_dia_${data}.json • última leitura ${new Date().toLocaleTimeString('pt-BR')}`;grid.innerHTML=pessoas.slice(0,9).map(p=>`<article class="card"><div class="name">${p.nome}</div><div class="obra">${p.obra}</div><div class="ativ">${p.ativ}</div><div class="pills"><span class="pill">${p.horas||'—'}</span>${p.viagem?'<span class="pill trip">✈️ Viagem</span>':''}${p.obra==='Obra não informada'?'<span class="pill warn">Verificar origem</span>':''}</div></article>`).join('')||'<article class="card"><div class="name">Sem dados</div><div class="ativ">Nenhum registro encontrado para hoje.</div></article>'}
load();setInterval(load,60000);try{window.parent.postMessage({type:'ERP_IMPAR_TV_BADGE',text:'📍 Quem está onde?'},'*')}catch(e){}
</script></body></html>
