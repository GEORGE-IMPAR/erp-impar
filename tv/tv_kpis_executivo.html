<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV • KPIs</title><style>
:root{--bg1:#06172f;--bg2:#0b3b6e;--bg3:#08746b;--ink:#f8fbff;--muted:#b6c7db;--green:#22c55e;--lime:#a3e635;--yellow:#facc15;--red:#ef4444;--blue:#38bdf8;--purple:#a855f7;--panel:rgba(2,8,23,.72);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 18% 8%,rgba(34,211,238,.18),transparent 30%),radial-gradient(circle at 82% 18%,rgba(163,230,53,.14),transparent 32%),linear-gradient(135deg,var(--bg1),var(--bg2) 45%,var(--bg3));}.page{width:100vw;height:100vh;padding:28px;position:relative;overflow:hidden}.page:before{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 0 43%,rgba(255,255,255,.07) 50%,transparent 57%);animation:sheen 9s linear infinite;pointer-events:none}@keyframes sheen{from{transform:translateX(-55%)}to{transform:translateX(55%)}}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:14px}.orb{width:64px;height:64px;border-radius:20px;background:conic-gradient(from 210deg,#22d3ee,#7c3aed,#fb7185,#facc15,#22c55e,#22d3ee);box-shadow:0 0 34px rgba(34,211,238,.35),inset 0 0 18px rgba(255,255,255,.22);animation:orb 5s linear infinite}@keyframes orb{to{filter:hue-rotate(360deg)}}.kicker{font-size:13px;color:var(--lime);font-weight:1000;letter-spacing:.22em;text-transform:uppercase}.title{font-size:42px;font-weight:1000;line-height:.96;text-transform:uppercase;text-shadow:0 8px 26px rgba(0,0,0,.36)}.subtitle{font-size:16px;color:#dbeafe;font-weight:850;margin-top:6px}.clock{text-align:right}.clock .date{font-size:15px;color:#b7ff43;font-weight:950}.clock .hour{font-size:42px;font-weight:1000;font-variant-numeric:tabular-nums}.grid{display:grid;gap:16px}.glass{background:linear-gradient(145deg,rgba(2,8,23,.78),rgba(7,44,55,.62));border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.34);border-radius:24px}.metric{padding:18px}.metric span{font-size:12px;color:#a9bad0;font-weight:1000;text-transform:uppercase;letter-spacing:.12em}.metric b{display:block;font-size:44px;line-height:1;color:#fff;margin-top:6px}.metric small{color:#dbeafe;font-weight:850}.ok{--accent:var(--green)}.warn{--accent:var(--yellow)}.bad{--accent:var(--red)}.card{position:relative;overflow:hidden;border-left:6px solid var(--accent,var(--green));animation:enter .65s ease both}.card.warn,.pulse-warn{animation:enter .65s ease both,pulseY 1.9s ease-in-out infinite}.card.bad,.pulse-bad{animation:enter .65s ease both,pulseR 1.25s ease-in-out infinite}@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.98);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}@keyframes pulseY{0%,100%{box-shadow:0 20px 55px rgba(0,0,0,.30),0 0 0 0 rgba(250,204,21,.24)}50%{box-shadow:0 20px 55px rgba(0,0,0,.30),0 0 0 9px rgba(250,204,21,.06)}}@keyframes pulseR{0%,100%{box-shadow:0 20px 55px rgba(0,0,0,.30),0 0 0 0 rgba(239,68,68,.28)}50%{box-shadow:0 20px 55px rgba(0,0,0,.30),0 0 0 10px rgba(239,68,68,.08)}}.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;background:rgba(2,8,23,.50);border:1px solid rgba(255,255,255,.13);font-size:11px;font-weight:1000;text-transform:uppercase;color:#dbeafe}.pill.ok{color:#bbf7d0;border-color:rgba(34,197,94,.36);background:rgba(34,197,94,.13)}.pill.warn{color:#fef08a;border-color:rgba(250,204,21,.38);background:rgba(250,204,21,.13)}.pill.bad{color:#fecaca;border-color:rgba(239,68,68,.40);background:rgba(239,68,68,.13)}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:86px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;background:rgba(2,8,23,.54);border:1px solid rgba(255,255,255,.10)}.row b{font-size:18px}.row small{display:block;color:#cbd5e1;font-weight:850;margin-top:2px}.empty{display:grid;place-items:center;text-align:center;color:#dbeafe;font-size:22px;font-weight:950;border:1px dashed rgba(163,230,53,.30);border-radius:24px;padding:28px;background:rgba(2,8,23,.38)}.footer-note{position:absolute;left:28px;bottom:18px;font-size:12px;color:#cbd5e1;font-weight:800}.loading{font-size:22px;font-weight:950;color:#dbeafe}.logo-text{letter-spacing:.02em}.hero-word{font-size:82px;line-height:.95;font-weight:1000;text-transform:uppercase;text-shadow:0 14px 40px rgba(0,0,0,.45)}.hero-word span{display:block;color:#57f287}.feature{padding:22px;min-height:160px;display:flex;flex-direction:column;justify-content:flex-end}.feature h3{font-size:28px;line-height:1.05}.feature p{font-size:15px;color:#dbeafe;font-weight:800;margin-top:8px}.big-icon{font-size:44px;margin-bottom:14px}.bar{height:14px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#22c55e,#a3e635);width:var(--w,50%);box-shadow:0 0 18px rgba(34,197,94,.5)}
</style></head><body><main class="page"><header class="top"><div class="brand"><div class="orb"></div><div><div class="kicker">Performance</div><div class="title">KPIs dos Coordenadores</div><div class="subtitle">Painel executivo • leitura rápida</div></div></div><div class="clock"><div class="date"></div><div class="hour"></div></div></header><section id="coord" class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px"></section><section class="glass" style="padding:20px"><div class="kicker">Pendências críticas</div><div class="list" id="pend" style="margin-top:12px"></div></section><div class="footer-note">Mesmo conceito do KPI oficial, em formato executivo para TV.</div></main><script>
const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function tick(){const d=new Date(); const de=$('.date'), he=$('.hour'); if(de)de.textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}); if(he)he.textContent=d.toLocaleTimeString('pt-BR');} setInterval(tick,1000); addEventListener('DOMContentLoaded',tick);
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim()}
async function getJson(url){const r=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'}); if(!r.ok)throw new Error(url+' '+r.status); return r.json()}
function arr(x){return Array.isArray(x)?x:Array.isArray(x?.data)?x.data:Array.isArray(x?.projetos)?x.projetos:Array.isArray(x?.items)?x.items:[]}
function pct(v){const n=Number(String(v??0).replace('%','').replace(',','.'));return Number.isFinite(n)?n:0}
function money(n){return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
async function obrasAtivas(){const j=await getJson('https://api.erpimpar.com.br/cronograma/listar_obras.php');return arr(j).map(o=>({id:String(o.id||'').padStart(3,'0'),nome:o.nome||o.obra||'',coord:o.coordenador||o.responsavel||''})).filter(o=>o.id&&o.nome)}
async function tvProjetos(){try{return arr(await getJson('https://api.erpimpar.com.br/tv/listar.php'))}catch(e){try{return arr(await getJson('https://api.erpimpar.com.br/tv/data/projetos.json'))}catch(_){return[]}}}
function parseDate(s){if(!s)return null; const d=new Date(String(s).replace(' ','T')); return isNaN(d)?null:d}
function daysSince(s){const d=parseDate(s); if(!d)return 9999; return Math.floor((Date.now()-d.getTime())/86400000)}
async function combustivelMes(){try{const j=await getJson('https://api.erpimpar.com.br/rh/combustivel/data/combustivel.json'); const ym=new Date().toISOString().slice(0,7); const items=[]; if(Array.isArray(j))items.push(...j); ['lancamentos','dados','data','items'].forEach(k=>Array.isArray(j?.[k])&&items.push(...j[k])); let total=0; items.forEach(x=>{const data=String(x.data||x.date||x.dia||''); if(!data||data.startsWith(ym)){let v=x.valor??x.value??x.total??0; if(typeof v==='string')v=Number(v.replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.')); total+=Number(v)||0;}}); return total}catch(e){return 0}}
async function atividadeHoje(){const d=new Date(); const ymd=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; try{return await getJson(`https://api.erpimpar.com.br/agenda/data/atividade_dia_${ymd}.json`)}catch(e){return {data:ymd,atividades:[]}}}


function iniciais(n){let p=String(n||'').split(/\s+/).filter(Boolean);return ((p[0]||'U')[0]+(p.at(-1)||'')[0]).toUpperCase()}
async function main(){const obras=await obrasAtivas(); const tv=await tvProjetos(); const tvMap=new Map(tv.map(p=>[norm(p.nome||p.obra),p])); const coords=['PABLO','FABIO','NICOLAS']; const data=coords.map(c=>{const minhas=obras.filter(o=>norm(o.coord||'').includes(c)); const ok=minhas.filter(o=>daysSince(tvMap.get(norm(o.nome))?.data_atualizacao)<=7).length; const score=minhas.length?Math.round((ok/minhas.length)*100):100; return {c,minhas,ok,score}}); $('#coord').innerHTML=data.map((x,i)=>`<article class="glass card ${x.score>=90?'ok':x.score>=75?'warn':'bad'}" style="--accent:${x.score>=90?'#22c55e':x.score>=75?'#facc15':'#ef4444'};padding:22px;animation-delay:${i*.12}s"><div style="display:flex;gap:16px;align-items:center"><div style="width:74px;height:74px;border-radius:999px;border:2px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:24px;font-weight:1000;background:rgba(255,255,255,.08)">${iniciais(x.c)}</div><div><h2 style="font-size:32px">${x.c}</h2><div class="pill ${x.score>=90?'ok':x.score>=75?'warn':'bad'}">${x.score>=90?'Excelente':x.score>=75?'Atenção':'Crítico'}</div></div></div><div style="font-size:70px;font-weight:1000;color:${x.score>=90?'#57f287':x.score>=75?'#fde68a':'#fecaca'};margin:18px 0 10px">${x.score}%</div><div class="bar" style="--w:${x.score}%"><i></i></div><p class="subtitle" style="font-size:15px;margin-top:12px">${x.ok} obras TV em dia • ${x.minhas.length} obras ativas</p><div class="grid" style="grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px">${[1,2,3,4,5].map(n=>`<span class="pill ${n===2&&x.score<90?'warn':'ok'}">QPI ${n}</span>`).join('')}</div></article>`).join(''); const pend=[]; obras.forEach(o=>{const p=tvMap.get(norm(o.nome)); const d=daysSince(p?.data_atualizacao); if(d>7) pend.push({tipo:'TV',nome:o.nome,coord:o.coord,dias:d});}); if(!pend.length) $('#pend').innerHTML='<div class="empty">Nenhuma pendência crítica no momento.</div>'; else $('#pend').innerHTML=pend.slice(0,6).map(p=>`<div class="row"><span class="pill warn">${p.tipo}</span><div><b>${p.nome}</b><small>${p.coord||'Coordenador não informado'}</small></div><span class="pill bad">${p.dias>=999?'sem registro':p.dias+' dias'}</span></div>`).join('')}
main().catch(e=>{$('#coord').innerHTML='<div class="empty">Não consegui carregar KPIs.</div>';console.error(e)})
</script></body></html>
