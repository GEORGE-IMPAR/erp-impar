<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="tv_style.css"><title>TV • KPIs</title></head><body><main class="page"><header class="top"><div class="brand"><div class="orb"></div><div><div class="kicker">Performance</div><div class="title">KPIs dos coordenadores</div><div class="subtitle">Painel executivo • mesma regra do KPI oficial</div></div></div><div class="clock"><div class="date"></div><div class="hour"></div></div></header><section id="cards" class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px"></section><section class="glass" style="padding:20px;min-height:225px"><div class="kicker">Pendências críticas</div><div id="issues" class="grid" style="grid-template-columns:repeat(2,1fr);margin-top:14px"></div></section><div class="footer-note" id="src">Carregando KPIs...</div></main><script src="tv_common.js"></script><script>
const COORDS=['PABLO','FABIO','NICOLAS'];
function scoreClass(v){return v>=90?'ok':v>=70?'warn':'bad'} function coordNome(c){return c==='FABIO'?'Fabio Ferrucci':c==='NICOLAS'?'Nicolas Schmitz':'Pablo Ricardo'}
async function qpi1(){return 0} // coletivo mensal: mantido visualmente pelo KPI oficial; TV mostra componentes individuais e deixa QPI1 como coletivo quando fonte não estiver disponível.
async function qpi5(){const t=await combustivelMes(); return t<=5000?100:(t<=7000?50:0)}
function calc(tv,cron,fuel){const issues=[];return COORDS.map(c=>{const tvc=tv.filter(x=>x.coord===c);const cr=cron.filter(x=>x.coord===c);const tvOk=tvc.filter(x=>x.dias<=7);const crOk=cr.filter(x=>x.dias<=7);const q2=tvc.length?tvOk.length/tvc.length*100:100;const q3=100;const q4=cr.length?crOk.length/cr.length*100:100;const q1=0;const q5=fuel;const score=q1*.10+q2*.30+q3*.25+q4*.25+q5*.10;tvc.filter(x=>x.dias>7).forEach(x=>issues.push({coord:c,tipo:'TV',obra:x.nome,det:`há ${x.dias} dia(s)`}));cr.filter(x=>x.dias>7).forEach(x=>issues.push({coord:c,tipo:'CRONOGRAMA',obra:x.nome,det:`há ${x.dias} dia(s)`}));return{coord:c,nome:coordNome(c),score,q1,q2,q3,q4,q5,tv:tvc.length,tvOk:tvOk.length,cron:cr.length,cronOk:crOk.length,issues}})}
async function main(){const [tv,cron,fuel]=await Promise.all([tvProjetos().catch(()=>[]),cronKpi().catch(()=>[]),qpi5()]); const res=calc(tv,cron,fuel); $('#cards').innerHTML=res.map((r,i)=>{const cls=scoreClass(r.score);return `<article class="glass card ${cls==='bad'?'bad':cls==='warn'?'warn':''}" style="--accent:${cls==='ok'?'#22c55e':cls==='warn'?'#facc15':'#ef4444'};padding:28px;min-height:330px;animation-delay:${i*.09}s"><div style="display:flex;gap:18px;align-items:center"><div class="avatar">${initials(r.nome)}</div><div><h2 style="font-size:34px;text-transform:uppercase">${r.nome}</h2><span class="pill ${cls}">${cls==='ok'?'Excelente':cls==='warn'?'Atenção':'Crítico'}</span></div></div><div style="font-size:74px;color:#57f287;font-weight:1000;margin:26px 0 12px">${Math.round(r.score)}%</div><div class="bar" style="--w:${Math.max(0,Math.min(100,r.score))}%"><i></i></div><p style="font-size:15px;font-weight:900;color:#dbeafe;margin-top:16px">${r.tvOk}/${r.tv} TV em dia • ${r.cronOk}/${r.cron} cronogramas atualizados</p><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px">${['QPI1','QPI2','QPI3','QPI4','QPI5'].map((q,ix)=>`<span class="pill">${q} ${Math.round([r.q1,r.q2,r.q3,r.q4,r.q5][ix])}%</span>`).join('')}</div></article>`}).join(''); const issues=res.flatMap(r=>r.issues).sort((a,b)=>a.coord.localeCompare(b.coord)).slice(0,8); $('#issues').innerHTML=issues.map(x=>`<div class="pill warn" style="justify-content:flex-start;padding:13px 16px;border-radius:16px"><b style="min-width:120px">${x.tipo}</b><span>${x.obra} • ${x.coord} • ${x.det}</span></div>`).join('')||'<div class="empty">Sem pendências críticas abertas.</div>'; $('#src').textContent='Fonte: TV oficial + cronograma/listar_kpi.php + RH combustível'}
main().catch(e=>{$('#cards').innerHTML='<div class="empty">Não consegui carregar KPIs.</div>';console.error(e)})
</script></body></html>
