<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ERP ÍMPAR • TV Experience V4 — Gestão à Vista</title>
<meta name="description" content="TV corporativa do ERP ÍMPAR — KPIs, agenda, farol, atividades e produto em tempo real." />
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#020814;
  --bg-2:#04101c;
  --deep:#061b24;
  --green:#5cff8d;
  --green-2:#22c55e;
  --lime:#a7ff3c;
  --cyan:#39d7ff;
  --blue:#3b82f6;
  --yellow:#ffd35a;
  --red:#ff5a5a;
  --purple:#a855f7;
  --text:#f4fbff;
  --muted:#bad2df;
  --dim:#8aa5b4;
  --card:rgba(3,18,30,.62);
  --line:rgba(255,255,255,.13);
  --line-2:rgba(92,255,141,.22);
  --glow:0 0 42px rgba(92,255,141,.28);
  --glow-cyan:0 0 42px rgba(57,215,255,.28);
  --shadow:0 24px 80px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 82% 18%,rgba(34,197,94,.22),transparent 34%),
    radial-gradient(circle at 12% 82%,rgba(57,215,255,.14),transparent 32%),
    radial-gradient(circle at 50% 50%,rgba(168,85,247,.06),transparent 40%),
    linear-gradient(135deg,#020617 0%,#052024 55%,#053b3a 100%);
  -webkit-font-smoothing:antialiased;
}

/* ============ FUNDO ANIMADO ============ */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.grid-bg{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.18;
  background-image:
    linear-gradient(rgba(92,255,141,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(57,215,255,.035) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle at center,#000,transparent 88%);
  animation:gridShift 20s linear infinite;
}
@keyframes gridShift{to{background-position:64px 64px,64px 64px}}
.scanline{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,transparent 0%,rgba(92,255,141,.02) 50%,transparent 100%);
  background-size:100% 6px;opacity:.35;
}

/* ============ STAGE / CENAS ============ */
.stage{position:relative;z-index:2;width:100vw;height:100vh}
.scene{
  position:absolute;inset:0;padding:4.5vh 4.2vw;
  opacity:0;transform:scale(1.06) translateY(28px);filter:blur(18px);
  transition:opacity 1.3s cubic-bezier(.16,1,.3,1),transform 1.3s cubic-bezier(.16,1,.3,1),filter 1.3s cubic-bezier(.16,1,.3,1);
  pointer-events:none;
  display:flex;flex-direction:column;
}
.scene.active{opacity:1;transform:scale(1) translateY(0);filter:blur(0);pointer-events:auto}
.scene.exit-up{transform:scale(.96) translateY(-54px);opacity:0;filter:blur(12px)}

/* ============ HEADER / TOP ============ */
.top{display:flex;align-items:center;justify-content:space-between;gap:26px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:20px}
.orb{
  width:74px;height:74px;border-radius:24px;
  background:conic-gradient(from 210deg,#22c55e,#22d3ee,#3b82f6,#a855f7,#f97316,#facc15,#22c55e);
  box-shadow:0 22px 65px rgba(0,0,0,.35),0 0 36px rgba(92,255,141,.28);
  position:relative;animation:float 5.5s ease-in-out infinite;
}
.orb:after{
  content:"";position:absolute;inset:9px;border-radius:20px;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.75),transparent 40%);
}
.brand-txt{display:flex;flex-direction:column;gap:2px}
.kicker{font-weight:900;letter-spacing:.32em;color:var(--green);font-size:13px;text-transform:uppercase}
.title{font-size:clamp(30px,3.4vw,54px);line-height:.95;font-weight:900;letter-spacing:-.03em;text-shadow:0 12px 42px rgba(0,0,0,.45)}
.subtitle{font-size:clamp(13px,1.05vw,18px);font-weight:700;color:#d7eef6;opacity:.9;margin-top:4px}
.clock{text-align:right;display:flex;flex-direction:column;gap:2px}
.date{font-weight:900;color:var(--lime);font-size:15px;letter-spacing:.05em}
.time{font-weight:900;font-size:clamp(32px,3.6vw,52px);line-height:1;text-shadow:0 12px 34px rgba(0,0,0,.35);font-variant-numeric:tabular-nums;color:#fff}

/* ============ BODY ÁREA (entre header e footer) ============ */
.body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;margin-top:2.5vh}

/* ============ FOOTER / RODAPÉ ============ */
.footer{
  position:absolute;left:4.2vw;right:4.2vw;bottom:3vh;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  color:#c9dce6;font-weight:800;font-size:13px;letter-spacing:.05em;
}
.footer .brand-mini{opacity:.8}
.progress{display:flex;gap:8px;flex:1;justify-content:center}
.dot{width:38px;height:4px;border-radius:999px;background:rgba(255,255,255,.18);transition:all .5s ease}
.dot.on{background:linear-gradient(90deg,var(--green),var(--cyan));box-shadow:0 0 18px rgba(92,255,141,.5);width:56px}
.footer .live{
  display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
  background:rgba(92,255,141,.1);border:1px solid rgba(92,255,141,.35);color:var(--green);font-size:12px;
}
.footer .live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

/* ============ HERO (cena 1) ============ */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:5vw;align-items:center;flex:1}
.headline{font-size:clamp(46px,6.4vw,112px);font-weight:900;letter-spacing:-.045em;line-height:.88}
.headline span{color:var(--green);display:block;text-shadow:0 0 40px rgba(92,255,141,.35)}
.lead{font-size:clamp(16px,1.4vw,24px);color:#d4e7ef;font-weight:600;line-height:1.5;max-width:780px;margin-top:28px}
.cta-line{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.pill{
  border:1px solid rgba(92,255,141,.35);
  background:rgba(5,30,36,.52);
  border-radius:999px;padding:11px 18px;font-weight:800;color:#dfffea;font-size:14px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 0 24px rgba(92,255,141,.08);
  transition:transform .3s ease,box-shadow .3s ease;
}
.active .pill{animation:pillIn .6s cubic-bezier(.16,1,.3,1) backwards}
.active .pill:nth-child(1){animation-delay:.4s}
.active .pill:nth-child(2){animation-delay:.5s}
.active .pill:nth-child(3){animation-delay:.6s}
.active .pill:nth-child(4){animation-delay:.7s}
.active .pill:nth-child(5){animation-delay:.8s}
.active .pill:nth-child(6){animation-delay:.9s}
@keyframes pillIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* Network (rede de nós no hero) */
.network{
  height:min(58vh,600px);border-radius:32px;
  border:1px solid rgba(92,255,141,.22);
  background:
    radial-gradient(circle at 50% 50%,rgba(92,255,141,.06),transparent 65%),
    linear-gradient(145deg,rgba(2,8,23,.35),rgba(5,84,72,.30));
  box-shadow:var(--glow),inset 0 0 80px rgba(57,215,255,.05);
  position:relative;overflow:hidden;
}
.node{
  position:absolute;width:108px;height:108px;border-radius:24px;
  background:rgba(2,16,28,.88);border:1px solid rgba(92,255,141,.32);
  display:grid;place-items:center;text-align:center;font-size:11px;font-weight:800;color:#e2f4fb;
  box-shadow:0 20px 50px rgba(0,0,0,.28),0 0 28px rgba(92,255,141,.14);
  animation:pulse 3.2s ease-in-out infinite;padding:8px;line-height:1.2;
}
.node b{font-size:22px;display:block;color:var(--green);margin-bottom:4px;line-height:1}
/* posições dos nodes via inline style (não usar nth-of-type pq beams e nodes são ambos div) */
.node.pos-tl{left:8%;top:8%}
.node.pos-tc{left:calc(50% - 54px);top:6%;animation-delay:.2s}
.node.pos-tr{right:8%;top:8%;animation-delay:.4s}
.node.pos-bl{left:8%;bottom:8%;animation-delay:.6s}
.node.pos-bc{left:calc(50% - 54px);bottom:6%;animation-delay:.8s}
.node.pos-br{right:8%;bottom:8%;animation-delay:1s}
.beam{
  position:absolute;height:2px;
  background:linear-gradient(90deg,transparent,var(--green),transparent);
  transform-origin:left center;opacity:.85;
  animation:draw 3.8s ease-in-out infinite;
}
.b1{width:30%;left:16%;top:22%;transform:rotate(-4deg)}
.b2{width:30%;left:54%;top:22%;transform:rotate(4deg);animation-delay:.5s}
.b3{width:30%;left:16%;bottom:26%;transform:rotate(4deg);animation-delay:1s}
.b4{width:30%;left:54%;bottom:26%;transform:rotate(-4deg);animation-delay:1.5s}
.b5{width:22%;left:39%;top:44%;transform:rotate(0);animation-delay:.75s}
.b6{width:22%;left:39%;bottom:44%;transform:rotate(0);animation-delay:1.25s}

/* ============ MÉTRICAS (data-grid) ============ */
.data-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:2vh}
.metric{
  padding:24px;border-radius:24px;border:1px solid var(--line);
  background:linear-gradient(145deg,rgba(2,13,24,.78),rgba(4,42,47,.42));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);
  position:relative;overflow:hidden;
}
.metric:before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--green),transparent);
  opacity:.6;
}
.metric small{
  display:block;letter-spacing:.16em;text-transform:uppercase;
  color:#b8ccdb;font-weight:800;font-size:11px;margin-bottom:10px;
}
.metric strong{display:block;font-size:clamp(38px,4.2vw,72px);line-height:1;color:#fff;font-variant-numeric:tabular-nums;font-weight:900}
.metric.warn strong{color:var(--yellow)}
.metric.good strong{color:var(--green)}
.metric.danger strong{color:var(--red)}
.metric span.hint{display:block;color:#8aa5b4;font-size:12px;margin-top:8px;font-weight:600}

/* ============ CARDS DE OBRA / FAROL ============ */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:2vh}
.work-card{
  min-height:220px;padding:22px;border-radius:24px;
  background:linear-gradient(145deg,rgba(4,20,34,.85),rgba(5,77,66,.42));
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 22px 64px rgba(0,0,0,.28),inset 0 0 0 1px rgba(92,255,141,.05);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.work-card:before{
  content:"";position:absolute;inset:-40%;
  background:radial-gradient(circle,rgba(92,255,141,.13),transparent 35%);
  transform:translate(-35%,-35%);animation:orbit 9s linear infinite;
}
.work-card h3{position:relative;font-size:clamp(18px,1.5vw,24px);margin:0 0 10px;font-weight:900;line-height:1.15}
.work-card p{position:relative;color:#dcebf2;font-size:13px;font-weight:600;line-height:1.4;margin:6px 0}
.tag{
  position:relative;display:inline-flex;align-self:flex-start;margin-bottom:12px;
  border-radius:999px;padding:6px 12px;
  background:rgba(92,255,141,.14);border:1px solid rgba(92,255,141,.32);
  font-size:11px;font-weight:900;color:var(--lime);letter-spacing:.05em;text-transform:uppercase;
}
.tag.verde{background:rgba(92,255,141,.15);border-color:rgba(92,255,141,.4);color:var(--green)}
.tag.amarelo{background:rgba(255,211,90,.12);border-color:rgba(255,211,90,.4);color:var(--yellow)}
.tag.vermelho{background:rgba(255,90,90,.12);border-color:rgba(255,90,90,.4);color:var(--red)}

/* barras de progresso */
.bar{
  height:10px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;
  margin-top:12px;position:relative;
}
.bar i{
  display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--green),var(--lime));
  transition:width 1.5s cubic-bezier(.16,1,.3,1);
  box-shadow:0 0 12px rgba(92,255,141,.6);
}
.active .bar i{width:var(--w)}
.bar.warn i{background:linear-gradient(90deg,var(--yellow),#ffb84a);box-shadow:0 0 12px rgba(255,211,90,.5)}
.bar.danger i{background:linear-gradient(90deg,var(--red),#ff8080);box-shadow:0 0 12px rgba(255,90,90,.5)}

.stats-line{
  display:flex;gap:12px;margin-top:auto;padding-top:12px;
  border-top:1px solid rgba(255,255,255,.06);
  font-size:11px;color:#a8bfcc;font-weight:700;
}
.stats-line span b{color:#fff;font-weight:900;font-size:14px;display:block}

/* ============ PRODUCT CARD (marketing) ============ */
.product{display:grid;grid-template-columns:1.05fr .95fr;gap:4vw;align-items:center;flex:1}
.product-txt{display:flex;flex-direction:column;justify-content:center}
.product .kicker-lg{
  font-weight:900;letter-spacing:.25em;color:var(--cyan);
  font-size:14px;text-transform:uppercase;margin-bottom:16px;
}
.product h2{
  font-size:clamp(48px,5.8vw,96px);font-weight:900;letter-spacing:-.04em;line-height:.92;margin:0 0 22px;
}
.product h2 em{font-style:normal;color:var(--green);text-shadow:0 0 40px rgba(92,255,141,.35);display:block}
.product p.desc{
  font-size:clamp(16px,1.35vw,22px);color:#d4e7ef;font-weight:600;line-height:1.5;max-width:640px;margin:0 0 26px;
}
.feature-list{display:flex;flex-direction:column;gap:14px;margin-bottom:26px}
.feature{
  display:flex;align-items:center;gap:14px;padding:14px 18px;
  border-radius:16px;background:rgba(2,15,28,.55);border:1px solid rgba(92,255,141,.18);
  font-weight:700;color:#e2f4fb;font-size:15px;
}
.feature .ico{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(92,255,141,.2),rgba(57,215,255,.1));
  border:1px solid rgba(92,255,141,.3);flex-shrink:0;font-size:18px;
}

/* Device mockup (moldura de celular pros vídeos) */
.device{
  position:relative;width:min(340px,90%);aspect-ratio:392/850;margin:0 auto;
  border-radius:44px;
  background:linear-gradient(135deg,#0a1526,#050f1c);
  padding:14px;
  box-shadow:
    0 40px 120px rgba(0,0,0,.55),
    0 0 60px rgba(92,255,141,.15),
    inset 0 0 0 1.5px rgba(92,255,141,.22),
    inset 0 0 0 3px rgba(0,0,0,.5);
}
.device:before{
  content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:110px;height:22px;background:#000;border-radius:14px;z-index:3;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
}
.device-screen{
  width:100%;height:100%;border-radius:32px;overflow:hidden;
  background:#000;position:relative;
}
.device-screen video,.device-screen img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.device-glow{
  position:absolute;inset:-30px;border-radius:60px;pointer-events:none;
  background:radial-gradient(circle,rgba(92,255,141,.22),transparent 65%);
  z-index:-1;animation:deviceGlow 4s ease-in-out infinite;
}
@keyframes deviceGlow{50%{transform:scale(1.08);opacity:.75}}

/* Static image variant */
.tela-wrap{
  position:relative;width:min(90%,600px);margin:0 auto;
  border-radius:24px;overflow:hidden;
  border:1px solid rgba(92,255,141,.22);
  box-shadow:0 30px 100px rgba(0,0,0,.42),0 0 60px rgba(92,255,141,.18);
}
.tela-wrap img{width:100%;display:block}

/* ============ TIMELINE / AGENDA / ATIVIDADE ============ */
.split{display:grid;grid-template-columns:.85fr 1.15fr;gap:36px;flex:1;align-items:center;min-height:0}
.split-txt{display:flex;flex-direction:column;justify-content:center}
.split-txt .headline-md{font-size:clamp(38px,4.6vw,78px);font-weight:900;letter-spacing:-.035em;line-height:.92;margin:0 0 22px}
.split-txt .headline-md span{color:var(--green);display:block}
.split-txt p{font-size:clamp(15px,1.25vw,20px);color:#d4e7ef;font-weight:600;line-height:1.5;max-width:520px;margin:0 0 24px}

.timeline{
  display:grid;gap:12px;max-height:70vh;overflow:hidden;align-content:center;
}
.line-item{
  display:grid;grid-template-columns:150px 1fr auto;gap:20px;align-items:center;
  padding:16px 20px;border-radius:18px;
  background:linear-gradient(90deg,rgba(2,14,26,.72),rgba(2,14,26,.45));
  border:1px solid rgba(255,255,255,.08);
  transition:all .3s ease;
}
.line-item .who{display:flex;align-items:center;gap:12px}
.line-item .avatar-mini{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#0f766e,#22c55e);
  display:grid;place-items:center;font-weight:900;font-size:13px;color:#fff;
  border:1.5px solid rgba(255,255,255,.4);flex-shrink:0;
}
.line-item b{font-size:14px;color:#fff;font-weight:800;line-height:1.15}
.line-item .info strong{font-size:16px;color:var(--green);font-weight:900;display:block;line-height:1.2}
.line-item .info span{display:block;color:#c5d8e2;font-weight:600;margin-top:3px;font-size:13px}
.line-item .badge{
  padding:5px 10px;border-radius:8px;background:rgba(92,255,141,.12);
  border:1px solid rgba(92,255,141,.28);font-size:11px;font-weight:900;color:var(--green);
  white-space:nowrap;
}
.line-item .badge.placa{background:rgba(57,215,255,.1);border-color:rgba(57,215,255,.3);color:var(--cyan)}

/* ============ KPI CARDS ============ */
.kpi-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:2vh}
.kpi-card{
  padding:28px;border-radius:28px;
  background:linear-gradient(145deg,rgba(2,15,28,.82),rgba(5,83,70,.45));
  border:1px solid rgba(92,255,141,.28);
  box-shadow:0 24px 80px rgba(0,0,0,.32),inset 0 0 0 1px rgba(255,255,255,.03);
  position:relative;overflow:hidden;
}
.kpi-card:before{
  content:"";position:absolute;top:-30%;right:-30%;width:80%;height:80%;
  background:radial-gradient(circle,rgba(92,255,141,.14),transparent 65%);
}
.kpi-head{display:flex;align-items:center;gap:16px;position:relative}
.avatar{
  width:64px;height:64px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#0f766e,#22c55e);
  font-size:22px;font-weight:900;color:#fff;
  border:2px solid rgba(255,255,255,.5);
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  flex-shrink:0;
}
.kpi-card h3{font-size:clamp(20px,1.8vw,28px);margin:0;font-weight:900;line-height:1.1}
.kpi-card .status-mini{font-size:12px;color:var(--lime);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.score{
  font-size:clamp(56px,6vw,96px);font-weight:900;line-height:1;
  margin:22px 0 12px;color:var(--green);
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 30px rgba(92,255,141,.4);
  position:relative;
}
.mini-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px;position:relative}
.mini-kpis span{
  border-radius:8px;text-align:center;padding:8px 4px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);
  font-weight:800;font-size:11px;color:#daf7e6;
}
.mini-kpis span b{display:block;font-size:16px;color:#fff;font-weight:900;margin-bottom:2px}

/* ============ TECH / ARQUITETURA (grand finale) ============ */
.arch-hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;flex:1;align-items:center}
.arch-txt h2{
  font-size:clamp(44px,5.4vw,88px);font-weight:900;letter-spacing:-.04em;line-height:.9;margin:0 0 20px;
}
.arch-txt h2 span{color:var(--green);display:block;text-shadow:0 0 40px rgba(92,255,141,.35)}
.arch-txt p.slogan{
  font-size:clamp(16px,1.3vw,22px);color:#d4e7ef;font-weight:600;line-height:1.5;
  padding:20px 24px;border-left:3px solid var(--green);
  background:linear-gradient(90deg,rgba(92,255,141,.08),transparent);border-radius:0 12px 12px 0;
  margin:24px 0;
}
.arch-txt .val{
  display:inline-flex;align-items:center;gap:12px;padding:14px 22px;
  border-radius:14px;background:rgba(92,255,141,.1);border:1px solid rgba(92,255,141,.32);
  font-weight:900;color:var(--green);font-size:16px;
}
.arch-txt .val small{color:#8aa5b4;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.1em}

.tech-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tech{
  padding:20px 16px;border-radius:20px;
  background:linear-gradient(145deg,rgba(2,13,24,.68),rgba(4,42,47,.4));
  border:1px solid rgba(92,255,141,.18);
  min-height:120px;display:flex;flex-direction:column;justify-content:center;
  position:relative;overflow:hidden;min-width:0;
}
.tech:before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--green),transparent);
  opacity:.7;
}
.tech strong{
  font-size:clamp(22px,2.4vw,40px);color:var(--green);display:block;
  font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 0 24px rgba(92,255,141,.3);
  white-space:nowrap;overflow:hidden;text-overflow:clip;
  letter-spacing:-.02em;
}
.tech span.lbl{
  font-weight:800;color:#dcebf2;text-transform:uppercase;
  letter-spacing:.08em;font-size:11px;margin-top:8px;display:block;
}
.tech.cyan strong{color:var(--cyan);text-shadow:0 0 24px rgba(57,215,255,.3)}
.tech.lime strong{color:var(--lime)}
.tech.purple strong{color:var(--purple);text-shadow:0 0 24px rgba(168,85,247,.3)}

.modules-strip{
  display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;
}
.mod-chip{
  padding:8px 14px;border-radius:10px;
  background:rgba(2,15,28,.6);border:1px solid rgba(92,255,141,.25);
  font-weight:800;font-size:12px;color:#e2f4fb;letter-spacing:.05em;
}
.mod-chip.hi{background:rgba(92,255,141,.14);color:var(--green);border-color:rgba(92,255,141,.4)}

const brDate = new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
function fmt(n){ return Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:0}); }
function pct(n){ return Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%'; }
function money(n){ return 'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function initials(s){ return String(s||'?').trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(); }
function chunk(arr,n){ const out=[]; for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n)); return out; }

async function getJson(url){
  try{
    const r = await fetch(url+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}
async function loadData(){
  const keys = Object.keys(API);
  const vals = await Promise.all(keys.map(k=>getJson(API[k])));
  let liveCount = 0;
  keys.forEach((k,i)=>{ if(vals[i]){ data[k] = vals[i]; liveCount++; } });
  window.__liveMode = liveCount>0;
}

function foot(i,total){
  const dots = Array.from({length:total},(_,x)=>`<span class="dot ${x===i?'on':''}"></span>`).join('');

/* ============================================
   RENDER + LOOP
   ============================================ */
const stage = document.getElementById('stage');
let currentScenes = [];
let idx = 0;
let timer = null;

function render(){
  currentScenes = buildAllScenes();
  stage.innerHTML = currentScenes.join('');
  // atualiza rodapé (dots) com total real
  const total = currentScenes.length;
  document.querySelectorAll('.scene').forEach((sc,i)=>{
    const footEl = sc.querySelector('.footer');
    if(footEl){
      const dots = Array.from({length:total},(_,x)=>`<span class="dot ${x===i?'on':''}"></span>`).join('');
      footEl.querySelector('.progress').innerHTML = dots;
    }
  });
  startShow();
  tickClock();
}

function startShow(){
  const sc = [...document.querySelectorAll('.scene')];
  if(sc.length===0) return;
  idx = 0;
  sc.forEach(s=>s.classList.remove('active','exit-up'));
  sc[0].classList.add('active');
  animateCounts();

  clearInterval(timer);
  timer = setInterval(()=>{
    const cur = sc[idx];
    cur.classList.remove('active');
    cur.classList.add('exit-up');
    idx = (idx+1) % sc.length;
    setTimeout(()=>{
      sc.forEach(s=>s.classList.remove('exit-up'));
      sc[idx].classList.add('active');
      animateCounts();
    }, 450);
  }, SLIDE_DURATION);
}

let clockTimer = null;
function tickClock(){
  const upd = ()=> document.querySelectorAll('[data-clock]').forEach(e=>{
    e.textContent = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  });
  upd();
  if(clockTimer) clearInterval(clockTimer);
  clockTimer = setInterval(upd, 500);
}

/* Contador animado (0 → valor) */
function animateCounts(){
  document.querySelectorAll('.active [data-count]').forEach(el=>{
    const end  = Number(el.dataset.count||0);
    const isPct = el.classList.contains('score');
    const dur  = 1400;
    const start = performance.now();
    function step(now){
      const p = Math.min(1,(now-start)/dur);
      // easeOutCubic
      const e = 1 - Math.pow(1-p,3);
      const val = Math.round(end*e);
      el.textContent = isPct ? val+'%' : fmt(val);
      if(p<1) requestAnimationFrame(step);
      else el.textContent = isPct ? end+'%' : fmt(end);
    }
    requestAnimationFrame(step);
  });
}

/* ============================================
   PARTÍCULAS DE FUNDO (canvas)
   ============================================ */
const c = document.getElementById('fx');
const ctx = c.getContext('2d');
let W, H, pts = [];
function resize(){
  W = c.width  = innerWidth;
  H = c.height = innerHeight;
  const count = Math.min(90, Math.floor((W*H)/22000));
  pts = Array.from({length:count},()=>({
    x:Math.random()*W, y:Math.random()*H,
    vx:(Math.random()-.5)*.32, vy:(Math.random()-.5)*.32,
    r:Math.random()*1.4+1
  }));
}
addEventListener('resize', resize);
resize();

function anim(){
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<pts.length;i++){
    const p = pts[i];
    p.x += p.vx; p.y += p.vy;
    if(p.x<0||p.x>W) p.vx*=-1;
    if(p.y<0||p.y>H) p.vy*=-1;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle = 'rgba(92,255,141,.42)';
    ctx.fill();
    for(let j=i+1;j<pts.length;j++){
      const q = pts[j];
      const dx = p.x-q.x, dy = p.y-q.y;
      const d = Math.hypot(dx,dy);
      if(d<155){
        ctx.strokeStyle = `rgba(57,215,255,${(1-d/155)*.18})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y);
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(anim);
}
anim();

    if(savedIdx < currentScenes.length){
      const sc = [...document.querySelectorAll('.scene')];
      sc.forEach(s=>s.classList.remove('active','exit-up'));
      idx = savedIdx;
      sc[idx].classList.add('active');
    }
