<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP ÍMPAR — Administração</title>
<style>
:root{--bg:#edf4f6;--card:#fff;--line:#cddce5;--text:#0f3146;--muted:#6b8190;--green:#10ad70;--green2:#0a8054;--navy:#173b52;--soft:#f5f9fa;--red:#d9475c;--amber:#dc920d;--blue:#1688c7}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text)}button,input,select{font:inherit}.page{height:100vh;padding:10px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.head{background:#fff;border:1px solid #d8e4ea;border-radius:14px;padding:12px 14px 13px;box-shadow:0 8px 24px rgba(23,52,72,.05);position:relative}.head:before{content:"";position:absolute;left:8px;top:13px;bottom:13px;width:6px;background:#1ab879;border-radius:4px}.head-inner{padding-left:13px}.head-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.head h1{font-size:22px;margin:0;color:#08764f;letter-spacing:-.5px}.head p{font-size:10px;color:#637a8b;margin:3px 0 0}.collapse{width:38px;height:38px;border:1px solid #cadbe5;background:#f5f9fb;border-radius:10px;color:#31576e;font-weight:900;cursor:pointer}.toolbar{display:grid;grid-template-columns:minmax(250px,1.4fr) 210px auto;gap:9px;margin-top:11px;align-items:end}.field label{display:block;font-size:8px;font-weight:1000;letter-spacing:.8px;color:#4d687a;margin:0 0 5px;text-transform:uppercase}.field input,.field select{width:100%;height:39px;border:1px solid #c5d6e0;border-radius:9px;background:#fff;padding:0 11px;color:#173247;font-size:11px;font-weight:750;outline:none}.buttons{display:flex;gap:7px;flex-wrap:wrap}.btn{height:39px;border-radius:9px;border:1px solid #c7d7e1;background:#f3f8fa;color:#274d64;padding:0 13px;font-size:10px;font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#18bd78,#0d9e65);border-color:#0fa267;color:#fff}.btn.dark{background:#23475c;color:#fff;border-color:#23475c}.btn.danger{background:#fff0f2;color:#bd3d52;border-color:#ffd4db}.btn:disabled{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.kpi{background:#fff;border:1px solid #d3e0e7;border-radius:12px;padding:10px 12px}.kpi small{display:block;font-size:8px;font-weight:900;letter-spacing:.7px;color:#69808f;text-transform:uppercase}.kpi b{display:block;margin-top:5px;font-size:20px;color:#12354b}.workspace{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr);gap:10px}.panel{background:#fff;border:1px solid #d2e0e8;border-radius:14px;min-height:0;overflow:hidden;display:flex;flex-direction:column}.panel-head{padding:11px 13px;border-bottom:1px solid #dce6eb;background:#f6fafb;display:flex;align-items:center;justify-content:space-between;gap:8px}.panel-head h2{margin:0;font-size:13px;color:#12394f}.panel-head span{font-size:9px;color:#6b8190}.list{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px}.user-card{border:1px solid #d5e1e7;border-radius:10px;padding:10px;cursor:pointer;background:#fff;position:relative}.user-card:hover{border-color:#80bea6}.user-card.active{background:#eefaf4;border-color:#18af72}.user-card b{font-size:11px}.user-card small{display:block;margin-top:3px;font-size:9px;color:#718694}.pill{display:inline-flex;align-items:center;height:21px;border-radius:999px;padding:0 7px;font-size:8px;font-weight:900;margin-top:6px}.pill.on{background:#e1f6ea;color:#08764f}.pill.off{background:#fff0f2;color:#bd3d52}.detail{overflow:auto;padding:12px}.empty{height:100%;display:grid;place-items:center;text-align:center;color:#738795}.empty b{display:block;font-size:17px;color:#183e55;margin-bottom:5px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.section{border:1px solid #d6e2e8;border-radius:11px;margin-top:10px;overflow:hidden}.section-title{padding:9px 11px;background:#f3f8fa;border-bottom:1px solid #dbe5ea;font-size:10px;font-weight:1000;color:#18445e;display:flex;justify-content:space-between;align-items:center}.perm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px}.perm{border:1px solid #d6e2e8;border-radius:9px;padding:9px;background:#fff;display:flex;align-items:center;gap:8px;cursor:pointer}.perm input{accent-color:#12ad70}.perm b{font-size:10px}.perm small{display:block;color:#738896;font-size:8px;margin-top:2px}.actions{display:flex;justify-content:flex-end;gap:7px;padding-top:11px}.toast-stack{position:fixed;right:18px;top:18px;z-index:50;display:flex;flex-direction:column;gap:8px}.toast{min-width:280px;max-width:420px;background:#fff;border:1px solid #cfdee6;border-left:5px solid var(--green);border-radius:12px;padding:11px 12px;box-shadow:0 18px 45px rgba(24,51,69,.16)}.toast.error{border-left-color:var(--red)}.toast b{font-size:11px}.toast p{font-size:9px;color:#687f8e;margin:3px 0 0}.modal{position:fixed;inset:0;background:rgba(18,42,56,.52);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}.modal.show{display:flex}.modal-card{width:min(760px,94vw);max-height:86vh;background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 25px 70px rgba(0,0,0,.25);display:flex;flex-direction:column}.modal-head{padding:13px 15px;border-bottom:1px solid #dce6eb;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;background:#fff;position:sticky;top:0;z-index:2}.modal-head h3{font-size:15px;margin:0;color:#08764f}.modal-body{padding:13px;overflow:auto;min-height:0;flex:1}.modal-actions{display:flex;justify-content:flex-end;gap:7px;padding:10px 13px 13px;border-top:1px solid #dce6eb;background:#fff;flex:0 0 auto;position:sticky;bottom:0;z-index:2}.x{width:34px;height:34px;border:1px solid #d1dfe7;border-radius:9px;background:#f7fafb;color:#36596e;font-weight:900;cursor:pointer}
@media(max-width:1000px){.workspace{grid-template-columns:1fr}.panel:first-child{max-height:210px}.perm-grid{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 1fr}.buttons{grid-column:1/-1}}@media(max-width:650px){html,body{overflow:auto}.page{height:auto;min-height:100vh;overflow:visible}.kpis{grid-template-columns:1fr 1fr}.form-grid,.perm-grid,.toolbar{grid-template-columns:1fr}.workspace{display:block}.panel{margin-bottom:10px;min-height:300px}}
</style>
</head>
<body>
<div class="page">
  <section class="head" id="head"><div class="head-inner">
    <div class="head-title"><div><h1>ADMINISTRAÇÃO E SEGURANÇA</h1><p>Usuários • Perfis • Permissões • Governança do ERP ÍMPAR</p></div><button class="collapse" id="collapseBtn">⌃</button></div>
    <div class="toolbar" id="toolbar"><div class="field"><label>Pesquisar usuário</label><input id="search" placeholder="Nome, e-mail, função ou perfil..."></div><div class="field"><label>Status</label><select id="statusFilter"><option value="">Todos</option><option value="ativo">Ativos</option><option value="inativo">Inativos</option></select></div><div class="buttons"><button class="btn primary" id="newUser">+ Novo usuário</button><button class="btn" id="profilesBtn">Perfis</button><button class="btn dark" id="refreshBtn">↻ Atualizar</button></div></div>
  </div></section>
  <section class="kpis"><div class="kpi"><small>Usuários</small><b id="kUsers">0</b></div><div class="kpi"><small>Ativos</small><b id="kActive">0</b></div><div class="kpi"><small>Perfis</small><b id="kProfiles">0</b></div><div class="kpi"><small>Administradores</small><b id="kAdmins">0</b></div></section>
  <section class="workspace">
    <div class="panel"><div class="panel-head"><div><h2>Usuários</h2><span>Selecione para editar</span></div><span id="listCount">0</span></div><div class="list" id="userList"></div></div>
    <div class="panel"><div id="detail" class="detail"><div class="empty"><div><b>Selecione ou cadastre um usuário</b>As permissões ficam centralizadas neste módulo.</div></div></div></div>
  </section>
</div>
<div class="toast-stack" id="toasts"></div>
<div class="modal" id="profilesModal"><div class="modal-card"><div class="modal-head"><h3>Perfis de acesso</h3><button class="x" data-close="profilesModal">×</button></div><div class="modal-body" id="profilesBody"></div><div class="modal-actions"><button class="btn" data-close="profilesModal">Fechar</button><button class="btn primary" id="saveProfiles">Salvar perfis</button></div></div></div>
<script>
const API='https://api.erpimpar.com.br/admin/api.php';
const SESSION_KEY='ERPIMPAR_USER';
const MODULES=[
 ['status','Agenda Semanal','Planejamento semanal e equipes'],['atividades','Agenda do Dia','Execução diária'],['cronograma','Cronograma','Cronogramas e planejamento físico'],['obras','Gestão de Obras','Vida da obra e kickoff'],['tv','TV Experience','Gestão à vista'],['pricing','Orçamentos','Orçamentos e formação de preço'],['materiais','Solicitação de Materiais','Solicitações para Compras'],['compras','Compras','Rotinas de compras'],['inventario','Recebimento','Recebimento e estoque'],['custos_rh','RH / Viagens','Custos, viagens e pessoas'],['kpis','Indicadores','KPIs e dashboards'],['documentos','Documentos','Contratos e gestão documental'],['admin','Administração','Usuários, perfis e permissões']
];
const $=id=>document.getElementById(id);let S={users:[],profiles:[],selected:null,editing:null};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(type,title,msg){const e=document.createElement('div');e.className='toast '+(type==='error'?'error':'');e.innerHTML=`<b>${esc(title)}</b><p>${esc(msg)}</p>`;$('toasts').appendChild(e);setTimeout(()=>e.remove(),4200)}
async function api(action,opt={}){const r=await fetch(API+'?acao='+action+'&_='+Date.now(),{cache:'no-store',...opt});const j=await r.json().catch(()=>({ok:false,error:'Resposta inválida'}));if(!r.ok||j.ok===false)throw new Error(j.error||('HTTP '+r.status));return j}

async function carregarUsuariosLegado(){
 const r=await fetch('/usuarios_erp.json?v='+Date.now(),{cache:'no-store'});
 if(!r.ok)throw new Error('usuarios_erp.json HTTP '+r.status);
 const data=JSON.parse((await r.text()).replace(/^\uFEFF/,'').trim()||'[]');
 if(!Array.isArray(data))throw new Error('usuarios_erp.json não é um array');
 return data;
}
async function sincronizarUsuariosLegado(adminUsers){
 let legacy=[];
 try{legacy=await carregarUsuariosLegado()}catch(e){console.warn('Base legada não carregada',e);return false}
 if(!legacy.length)return false;
 const emails=new Set((adminUsers||[]).map(u=>String(u.email||'').trim().toLowerCase()).filter(Boolean));
 const faltantes=legacy.filter(u=>u&&u.email&&!emails.has(String(u.email).trim().toLowerCase()));
 if(!faltantes.length)return false;
 await api('importar_legado',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuarios:faltantes})});
 return true;
}

function session(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||sessionStorage.getItem(SESSION_KEY)||'null')}catch{return null}}
function renderKpis(){const active=S.users.filter(x=>x.ativo!==false).length;$('kUsers').textContent=S.users.length;$('kActive').textContent=active;$('kProfiles').textContent=S.profiles.length;$('kAdmins').textContent=S.users.filter(x=>(x.modulos||[]).includes('admin')&&x.ativo!==false).length}
function renderList(){const q=$('search').value.trim().toLowerCase(),st=$('statusFilter').value;const arr=S.users.filter(u=>{const blob=[u.nome,u.email,u.funcao,u.perfil].join(' ').toLowerCase();if(q&&!blob.includes(q))return false;if(st==='ativo'&&u.ativo===false)return false;if(st==='inativo'&&u.ativo!==false)return false;return true});$('listCount').textContent=arr.length;$('userList').innerHTML=arr.length?arr.map(u=>`<div class="user-card ${S.selected===u.id?'active':''}" data-id="${esc(u.id)}"><b>${esc(u.nome||'Sem nome')}</b><small>${esc(u.email||'')} • ${esc(u.funcao||'Sem função')}</small><span class="pill ${u.ativo===false?'off':'on'}">${u.ativo===false?'INATIVO':'ATIVO'} • ${esc(u.perfil||'Personalizado')}</span></div>`).join(''):'<div class="empty"><div>Nenhum usuário encontrado.</div></div>'}
function profileOptions(current){return '<option value="">Personalizado</option>'+S.profiles.map(p=>`<option value="${esc(p.id)}" ${p.id===current?'selected':''}>${esc(p.nome)}</option>`).join('')}
function detailForm(u={}){const mods=new Set(u.modulos||[]);return `<div class="form-grid"><div class="field"><label>Nome *</label><input id="fNome" value="${esc(u.nome||'')}"></div><div class="field"><label>E-mail *</label><input id="fEmail" value="${esc(u.email||'')}"></div><div class="field"><label>Função / área</label><input id="fFuncao" value="${esc(u.funcao||'')}"></div><div class="field"><label>Perfil</label><select id="fPerfil">${profileOptions(u.perfil||'')}</select></div><div class="field"><label>Status</label><select id="fAtivo"><option value="1" ${u.ativo!==false?'selected':''}>Ativo</option><option value="0" ${u.ativo===false?'selected':''}>Inativo</option></select></div><div class="field"><label>Nova senha ${u.id?'(opcional)':'*'}</label><input id="fSenha" type="password" autocomplete="new-password" placeholder="${u.id?'Deixe vazio para manter':'Mínimo 8 caracteres'}"></div></div><div class="section"><div class="section-title"><span>Permissões por módulo</span><span id="permCount">${mods.size} selecionados</span></div><div class="perm-grid">${MODULES.map(([id,n,d])=>`<label class="perm"><input type="checkbox" data-mod="${id}" ${mods.has(id)?'checked':''}><span><b>${n}</b><small>${d}</small></span></label>`).join('')}</div></div><div class="actions">${u.id?'<button class="btn danger" id="deleteUser">Excluir</button>':''}<button class="btn" id="cancelEdit">Cancelar</button><button class="btn primary" id="saveUser">Salvar usuário</button></div>`}
function bindForm(u){$('fPerfil').addEventListener('change',()=>{const p=S.profiles.find(x=>x.id===$('fPerfil').value);if(p){document.querySelectorAll('[data-mod]').forEach(c=>c.checked=(p.modulos||[]).includes(c.dataset.mod));updatePermCount()}});document.querySelectorAll('[data-mod]').forEach(c=>c.addEventListener('change',updatePermCount));$('cancelEdit').onclick=()=>{S.editing=null;renderDetail()};$('saveUser').onclick=saveUser;if($('deleteUser'))$('deleteUser').onclick=deleteUser}
function updatePermCount(){$('permCount').textContent=document.querySelectorAll('[data-mod]:checked').length+' selecionados'}
function renderDetail(){const u=S.users.find(x=>x.id===S.selected);if(S.editing==='new'){$('detail').innerHTML='<h2 style="margin:0 0 10px;font-size:16px;color:#08764f">Novo usuário</h2>'+detailForm({ativo:true,modulos:[]});bindForm({});return}if(!u){$('detail').innerHTML='<div class="empty"><div><b>Selecione ou cadastre um usuário</b>As permissões ficam centralizadas neste módulo.</div></div>';return}$('detail').innerHTML='<h2 style="margin:0 0 10px;font-size:16px;color:#08764f">Cadastro e permissões</h2>'+detailForm(u);bindForm(u)}
async function saveUser(){const id=S.selected&&S.editing!=='new'?S.selected:null;const data={id,nome:$('fNome').value.trim(),email:$('fEmail').value.trim().toLowerCase(),funcao:$('fFuncao').value.trim(),perfil:$('fPerfil').value,ativo:$('fAtivo').value==='1',senha:$('fSenha').value,modulos:[...document.querySelectorAll('[data-mod]:checked')].map(x=>x.dataset.mod)};if(!data.nome||!data.email){toast('error','Dados obrigatórios','Informe nome e e-mail.');return}if(!id&&data.senha.length<8){toast('error','Senha obrigatória','Cadastre uma senha com pelo menos 8 caracteres.');return}try{const j=await api('salvar_usuario',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});toast('ok','Usuário salvo',data.nome);S.editing=null;S.selected=j.id||id;await load()}catch(e){toast('error','Erro ao salvar',e.message)}}
async function deleteUser(){const u=S.users.find(x=>x.id===S.selected);if(!u||!confirm('Excluir '+u.nome+'?'))return;try{await api('excluir_usuario&id='+encodeURIComponent(u.id),{method:'DELETE'});S.selected=null;await load();toast('ok','Usuário excluído',u.nome)}catch(e){toast('error','Erro ao excluir',e.message)}}
function renderProfiles(){const defaults=[...S.profiles];$('profilesBody').innerHTML=`<div id="profileRows">${defaults.map((p,i)=>profileRow(p,i)).join('')}</div><button class="btn" style="margin-top:9px" id="addProfile">+ Adicionar perfil</button>`;$('addProfile').onclick=()=>{$('profileRows').insertAdjacentHTML('beforeend',profileRow({id:'perfil_'+Date.now(),nome:'Novo perfil',modulos:[]},Date.now()));bindProfileChecks()};bindProfileChecks()}
function profileRow(p,i){return `<div class="section profile-row" data-profile="${esc(p.id)}" style="margin-top:0;margin-bottom:9px"><div class="section-title"><input class="pname" value="${esc(p.nome)}" style="height:30px;border:1px solid #c9d9e2;border-radius:7px;padding:0 8px;font-weight:800"><button class="btn danger premove" type="button" style="height:30px">Remover</button></div><div class="perm-grid">${MODULES.map(([id,n])=>`<label class="perm"><input type="checkbox" class="pmod" value="${id}" ${(p.modulos||[]).includes(id)?'checked':''}><b>${n}</b></label>`).join('')}</div></div>`}
function bindProfileChecks(){document.querySelectorAll('.premove').forEach(b=>b.onclick=()=>b.closest('.profile-row').remove())}
async function saveProfiles(){const rows=[...document.querySelectorAll('.profile-row')].map(r=>({id:r.dataset.profile,nome:r.querySelector('.pname').value.trim(),modulos:[...r.querySelectorAll('.pmod:checked')].map(x=>x.value)})).filter(x=>x.nome);try{await api('salvar_perfis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({perfis:rows})});$('profilesModal').classList.remove('show');await load();toast('ok','Perfis salvos','Matriz de perfis atualizada.')}catch(e){toast('error','Erro ao salvar perfis',e.message)}}
async function load(){try{let j=await api('listar');let users=j.usuarios||[];const imported=await sincronizarUsuariosLegado(users);if(imported){j=await api('listar');users=j.usuarios||[];toast('ok','Usuários sincronizados','A base atual do login foi importada para Administração.')}S.users=users;S.profiles=j.perfis||[];renderKpis();renderList();renderDetail()}catch(e){toast('error','Falha ao carregar Administração',e.message)}}
$('userList').onclick=e=>{const c=e.target.closest('[data-id]');if(c){S.selected=c.dataset.id;S.editing=null;renderList();renderDetail()}};$('search').oninput=renderList;$('statusFilter').onchange=renderList;$('newUser').onclick=()=>{S.selected=null;S.editing='new';renderList();renderDetail()};$('refreshBtn').onclick=async()=>{const b=$('refreshBtn');b.disabled=true;const t=b.textContent;b.textContent='↻ Atualizando...';toast('ok','Atualizando usuários e permissões','Consultando a fonte oficial.');try{await load();toast('ok','Administração atualizada','Usuários, perfis e permissões atualizados.')}finally{b.disabled=false;b.textContent=t}};$('profilesBtn').onclick=()=>{renderProfiles();$('profilesModal').classList.add('show')};$('saveProfiles').onclick=saveProfiles;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('show'));$('collapseBtn').onclick=()=>{const t=$('toolbar');const hidden=t.style.display==='none';t.style.display=hidden?'grid':'none';$('collapseBtn').textContent=hidden?'⌃':'⌄'};
load();
</script>
</body></html>
